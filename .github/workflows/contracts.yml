# =============================================================================
# CI de pf-pkg-contracts (E0-T2 / ADR 25).
#
# Dos responsabilidades:
#   - verificar: en cada push/PR. Lint de OpenAPI y eventos, breaking check,
#     equivalencia estados<->OpenAPI, codegen reproducible y build de Go.
#   - publicar:  al empujar un tag `v*-tracer.*`. UNA sola ejecución publica las
#     fuentes, los artefactos Go y TS, y el manifiesto con tag/SHA/checksums
#     bajo la misma versión contractual.
#
# El freeze del tracer (v0.1.0-tracer.2) sólo existe cuando este workflow corre
# sobre su tag y produce SHA, checksums y manifiesto verificables.
# =============================================================================
name: contracts

on:
  push:
    branches: [pf-contracts-m, pf-contracts-d, pf-contracts-q]
    tags: ['v*-tracer.*']
  pull_request:
    branches: [pf-contracts-m, pf-contracts-d, pf-contracts-q]

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '24'
  BUF_VERSION: '1.45.0'

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # breaking check necesita historia

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint de eventos (buf lint)
        run: buf lint

      - name: Breaking check de eventos contra la rama principal
        # Sólo tiene sentido cuando pf-contracts-m ya contiene contratos
        # publicados. En el primer release aún no hay línea base, así que se
        # omite. Se compara contra el ref LOCAL (no por clone HTTPS, que
        # requeriría credenciales y falla con 'could not read Username').
        if: github.ref != 'refs/heads/pf-contracts-m'
        run: |
          if ! git fetch --no-tags origin pf-contracts-m 2>/dev/null; then
            echo "No existe la rama pf-contracts-m todavía; se omite el breaking check."
            exit 0
          fi
          if git cat-file -e FETCH_HEAD:buf.yaml 2>/dev/null; then
            echo "Comparando eventos contra pf-contracts-m"
            buf breaking --against '.git#ref=FETCH_HEAD'
          else
            echo "pf-contracts-m aún no tiene contratos publicados; se omite el breaking check (primer release)."
          fi

      - name: Lint de OpenAPI (redocly)
        run: make lint-openapi

      - name: Breaking check de OpenAPI vs la última release publicada
        # Invariante 4 de ADR 25: un cambio incompatible de OpenAPI debe romper
        # CI contra la última release publicada. Antes de tracer.2 sólo corría
        # `buf breaking`, que cubre los EVENTOS; el spec HTTP podía cambiar de
        # forma incompatible sin que nada lo notara.
        # Se compara contra el último TAG de tracer, no contra una rama: una
        # rama no es evidencia de freeze (invariante 2). Sin release previa, el
        # script lo dice y sale 0, igual que `buf breaking` en el primer release.
        run: make breaking-openapi

      - name: Equivalencia estados <-> OpenAPI
        run: make check-estados

      - name: Consistencia del registro de eventos (registro <-> .proto <-> INVENTARIO)
        run: make check-registro

      - name: El árbol publicado trae todos los paquetes del módulo Go
        # Así se convirtió el defecto de tracer.1 (tag sin clientes generados)
        # en un fallo de CI en vez de en un retiro de release.
        run: make check-tags

      - name: Codegen reproducible (no debe dejar diffs)
        run: make check-reproducible

      - name: Build y vet del módulo Go
        run: |
          cd packages/api-client-go
          go build ./...
          go vet ./...

      - name: Typecheck del paquete TS
        run: |
          cd packages/api-client-ts
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: El paquete TS sirve los subpath que declara en exports
        # tsc --noEmit mira los archivos por ruta relativa: nunca resuelve un
        # subpath de 'exports'. Un 'exports' que promete un subpath inexistente
        # sólo revienta en el build del consumidor, sin relación aparente con
        # este repo. Se prueba sobre el tarball real, en un proyecto limpio.
        run: make check-ts-exports

  publicar:
    # Sólo al empujar un tag de tracer. Depende de que la verificación pase.
    needs: verificar
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-tracer.')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear release y adjuntar artefactos
      packages: write   # publicar el paquete npm en GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar que el tag coincide con VERSION
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "El tag ($tag) no coincide con VERSION ($version)"; exit 1
          fi

      - name: Identidad de git para etiquetar
        # El runner no trae user.name/user.email, y `git tag -a` aborta con
        # "Committer identity unknown" (exit 128) ANTES de publicar nada. La
        # identidad es la del bot de Actions: este pipeline no commitea código,
        # sólo etiqueta el commit ya publicado.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generar artefactos (misma ejecución que publica)
        run: make generate

      - name: Confirmar codegen reproducible
        run: make check-reproducible

      - name: Verificar el árbol YA etiquetado (evidencia del freeze)
        # A diferencia del paso equivalente en `verificar`, aquí se comprueba el
        # commit etiquetado, que es lo que los consumidores van a resolver. Un tag
        # sin los clientes generados es exactamente como se retiró tracer.1.
        run: ./scripts/check-tags.sh "${GITHUB_SHA}"

      - name: Consistencia del registro de eventos
        # El grueso de los contract tests (registro <-> .proto <-> INVENTARIO) no
        # depende del tag, así que corre aquí y falla antes de publicar nada. El
        # consumidor limpio necesita el tag prefijado, que se crea más abajo.
        run: make check-registro

      - name: Escribir manifiesto (tag, SHA, checksums)
        run: make manifest

      - name: Verificar el manifiesto contra el árbol etiquetado
        # Escribir el manifiesto es sólo la mitad de la garantía: hay que
        # comprobar que los bytes que promete son los del commit etiquetado, y
        # que no deja ningún artefacto fuera. Es lo que convierte el manifiesto
        # en evidencia del freeze y no en un documento decorativo.
        run: make verificar-manifiesto

      - name: Publicar el módulo Go (tag prefijado por subdirectorio)
        # El módulo Go vive en packages/api-client-go/, un subdirectorio. Go exige
        # que la versión de un módulo anidado se etiquete con el prefijo de su
        # ruta: `packages/api-client-go/vX.Y.Z`. El tag de release `vX.Y.Z` que
        # dispara este job resuelve el módulo RAÍZ (que no existe), no el anidado.
        # Se crea aquí el tag prefijado, apuntando al mismo commit del release,
        # para que `go get .../packages/api-client-go@vX.Y.Z` resuelva.
        run: |
          version="${GITHUB_REF_NAME}"
          gotag="packages/api-client-go/${version}"
          # La idempotencia se consulta al ORIGEN, no a los refs locales: el
          # checkout de un push de tag no trae los demás tags, así que un reintento
          # del job intentaría recrear un tag ya publicado.
          if git ls-remote --exit-code --tags origin "refs/tags/${gotag}" >/dev/null 2>&1; then
            echo "El tag ${gotag} ya existe en el origen; no se recrea (prerelease inmutable)."
          else
            git tag -a "${gotag}" "${GITHUB_SHA}" -m "Módulo Go de ${version}"
            git push origin "${gotag}"
            echo "Publicado el módulo Go como ${gotag}."
          fi

      - name: Contract tests — consumidor limpio del módulo publicado
        # Invariante 7 de ADR 25: los contract tests pasan antes de publicar el
        # resto de los artefactos. Se ejecutan contra el tag ya empujado, en un
        # módulo Go NUEVO, sin go.work ni replace: la resolución tiene que ocurrir
        # por versión publicada o el test no prueba nada (ADR 17).
        #
        # Esto es lo que no se hizo en tracer.1 y por eso se retiró: el tag
        # resolvía, pero no traía nada importable.
        #
        # AI27-Tech/* es privado (decisión de owner): GOPRIVATE cubre el prefijo
        # para el checksum DB y el proxy, y el token llega por el secreto del repo
        # a una config de git efímera (URL rewriting), nunca hardcodeado. El
        # runner no trae credenciales para el clon del caché de módulos.
        run: make contract-tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar paquete npm (@ai27-tech/contracts)
        working-directory: packages/api-client-ts
        run: |
          npm install --no-audit --no-fund
          version="$(node -p "require('./package.json').version")"
          # npm exige un dist-tag explícito para prereleases (versiones con
          # sufijo -algo), para no mover `latest` a una prerelease. Se deriva el
          # dist-tag del sufijo: 0.1.0-tracer.1 -> `tracer`. Una versión estable
          # (sin sufijo) se publica bajo `latest`.
          if [[ "$version" == *-* ]]; then
            disttag="$(printf '%s' "${version#*-}" | sed 's/[.].*$//')"
            echo "Prerelease detectada ($version); publicando bajo dist-tag '$disttag'."
            npm publish --tag "$disttag"
          else
            echo "Versión estable ($version); publicando bajo 'latest'."
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # El módulo Go se publica por su tag prefijado `packages/api-client-go/vX.Y.Z`
      # (paso anterior); go get lo resuelve por tag/SHA. No hay registry adicional.
      - name: Crear GitHub Release con fuentes y manifiesto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            manifiesto/tracer.manifest.json
            VERSION
