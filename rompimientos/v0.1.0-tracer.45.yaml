# =============================================================================
# rompimientos/v0.1.0-tracer.45.yaml
# -----------------------------------------------------------------------------
# ALLOWLIST DE RUPTURAS INTENCIONALES de `v0.1.0-tracer.45`.
#
# El gate de compatibilidad falla ante CUALQUIER cambio incompatible. Esta
# allowlist es la ÚNICA forma de que una ruptura pase, y sólo mientras `VERSION`
# sea exactamente `v0.1.0-tracer.45`. Una ruptura no declarada aquí DEBE seguir
# fallando. Ver la cabecera de v0.1.0-tracer.4.yaml para el contrato completo.
# =============================================================================
version: v0.1.0-tracer.45

# --- Rupturas de OpenAPI (oasdiff). `match` es una subcadena de la línea
#     `in API <método ruta>` que imprime oasdiff; `servicio` acota el spec. ---
#
# La solicitud sale del viaje (ADR 38, DEC-148 #4, #13, #14). El enum
# `EstadoViaje` de `operacion` pierde `SOLICITADO`, `RECHAZADO_POR_AI27` y
# `RECHAZADO_POR_CLIENTE`, y `CANCELADO` pasa a `CANCELADO_POR_CLIENTE`. Oasdiff
# lo reporta como valores de enum retirados de la REQUEST en dos operaciones: el
# filtro `estado` de `listarViajes` y el `a_estado` de `transicionarViaje`.
#
# Ruptura intencional y segura en el cable: V2 no tiene datos de producción de
# V1, así que ninguna fila ni ningún cliente en producción usa esos valores
# (DEC-148 #7). Los consumidores que los nombran en código dejan de compilar al
# subir el pin y lo corrigen en su propio PR (git-workflow §8). La respuesta
# (`EstadoViaje` en `Viaje.estado`) también pierde valores, pero oasdiff la
# clasifica como advertencia y no como ruptura.
#
# El matcher es por subcadena: `GET /api/v1/viajes` también cubriría rutas que
# empiezan igual, así que esta entrada es más amplia de lo ideal. Es el límite
# del mecanismo (ver la cabecera de v0.1.0-tracer.4.yaml); el diff completo de la
# ola está en el CHANGELOG para que la revisión humana lo contraste.
openapi:
  - servicio: operacion
    match: "GET /api/v1/viajes"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el filtro `estado` de `listarViajes` pierde SOLICITADO, RECHAZADO_POR_AI27, RECHAZADO_POR_CLIENTE y CANCELADO (ahora CANCELADO_POR_CLIENTE); sin datos de producción de V1
  - servicio: operacion
    match: "POST /api/v1/viajes/{id}/transiciones"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el `a_estado` de `transicionarViaje` pierde SOLICITADO, RECHAZADO_POR_AI27, RECHAZADO_POR_CLIENTE y CANCELADO (ahora CANCELADO_POR_CLIENTE); sin datos de producción de V1
