# =============================================================================
# rompimientos/v0.1.0-tracer.45.yaml
# -----------------------------------------------------------------------------
# ALLOWLIST DE RUPTURAS INTENCIONALES de `v0.1.0-tracer.45`.
#
# El gate de compatibilidad falla ante CUALQUIER cambio incompatible. Esta
# allowlist es la ÚNICA forma de que una ruptura pase, y sólo mientras `VERSION`
# sea exactamente `v0.1.0-tracer.45`. Una ruptura no declarada aquí DEBE seguir
# fallando. Ver la cabecera de v0.1.0-tracer.4.yaml para el contrato completo.
# =============================================================================
version: v0.1.0-tracer.45

# --- Rupturas de OpenAPI (oasdiff). `match` es una subcadena de la línea
#     `in API <método ruta>` que imprime oasdiff; `servicio` acota el spec. ---
#
# La solicitud sale del viaje (ADR 38, DEC-148 #4, #13, #14). El enum
# `EstadoViaje` de `operacion` pierde `SOLICITADO`, `RECHAZADO_POR_AI27` y
# `RECHAZADO_POR_CLIENTE`, y `CANCELADO` pasa a `CANCELADO_POR_CLIENTE`. Oasdiff
# lo reporta como valores de enum retirados de la REQUEST en dos operaciones: el
# filtro `estado` de `listarViajes` y el `a_estado` de `transicionarViaje`.
#
# Ruptura intencional y segura en el cable: V2 no tiene datos de producción de
# V1, así que ninguna fila ni ningún cliente en producción usa esos valores
# (DEC-148 #7). Los consumidores que los nombran en código dejan de compilar al
# subir el pin y lo corrigen en su propio PR (git-workflow §8). La respuesta
# (`EstadoViaje` en `Viaje.estado`) también pierde valores, pero oasdiff la
# clasifica como advertencia y no como ruptura.
#
# El matcher compara por subcadena contra `<método ruta> | <detalle>` (el gate
# une la línea `in API` con la línea de detalle de oasdiff), así que cada entrada
# acota la ruptura a UN valor de enum retirado en UNA operación. Una ruptura
# distinta en la misma ruta (por ejemplo un parámetro nuevo obligatorio en
# `GET /api/v1/viajes/{id}`) NO queda autorizada y sigue fallando.
openapi:
  - servicio: operacion
    match: "GET /api/v1/viajes | removed the enum value 'SOLICITADO' from the 'query' request parameter 'estado'"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el filtro `estado` de `listarViajes` pierde SOLICITADO; sin datos de producción de V1
  - servicio: operacion
    match: "GET /api/v1/viajes | removed the enum value 'RECHAZADO_POR_AI27' from the 'query' request parameter 'estado'"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el filtro `estado` de `listarViajes` pierde RECHAZADO_POR_AI27; sin datos de producción de V1
  - servicio: operacion
    match: "GET /api/v1/viajes | removed the enum value 'RECHAZADO_POR_CLIENTE' from the 'query' request parameter 'estado'"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el filtro `estado` de `listarViajes` pierde RECHAZADO_POR_CLIENTE; sin datos de producción de V1
  - servicio: operacion
    match: "GET /api/v1/viajes | removed the enum value 'CANCELADO' from the 'query' request parameter 'estado'"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el filtro `estado` de `listarViajes` pierde CANCELADO; sin datos de producción de V1
  - servicio: operacion
    match: "POST /api/v1/viajes/{id}/transiciones | removed the enum value 'SOLICITADO' of the request property 'a_estado/allOf[#/components/schemas/EstadoViaje]/'"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el `a_estado` de `transicionarViaje` pierde SOLICITADO; sin datos de producción de V1
  - servicio: operacion
    match: "POST /api/v1/viajes/{id}/transiciones | removed the enum value 'RECHAZADO_POR_AI27' of the request property 'a_estado/allOf[#/components/schemas/EstadoViaje]/'"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el `a_estado` de `transicionarViaje` pierde RECHAZADO_POR_AI27; sin datos de producción de V1
  - servicio: operacion
    match: "POST /api/v1/viajes/{id}/transiciones | removed the enum value 'RECHAZADO_POR_CLIENTE' of the request property 'a_estado/allOf[#/components/schemas/EstadoViaje]/'"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el `a_estado` de `transicionarViaje` pierde RECHAZADO_POR_CLIENTE; sin datos de producción de V1
  - servicio: operacion
    match: "POST /api/v1/viajes/{id}/transiciones | removed the enum value 'CANCELADO' of the request property 'a_estado/allOf[#/components/schemas/EstadoViaje]/'"
    fuente: ADR 38 / DEC-148 #4, #13, #14 — el `a_estado` de `transicionarViaje` pierde CANCELADO; sin datos de producción de V1

# --- Rupturas de eventos (buf breaking). `match` es una subcadena del mensaje
#     que imprime buf. ---
#
# `solicitud.estado_cambiado` perdió `marca_penalizacion` (campo 5) y
# `cambiado_en` pasó del campo 6 al 5 (revisión de tracer.45, PR #153): la marca
# de penalización revelaba por la superficie amplia que el cliente pagó y
# canceló, y ningún consumidor la necesitaba.
#
# Ruptura segura: `tracer.45` NO está publicado (sin tag; `pf-contracts-m` solo
# trae la versión previa a la corrección, que ningún consumidor pudo fijar
# porque los consumidores fijan por tag). Se declara porque, con el chequeo de
# eventos comparando de verdad contra `pf-contracts-m` (antes `FETCH_HEAD` se
# resolvía a HEAD y el chequeo no comparaba nada), la promoción de la corrección
# a `-m` lo detecta. Una vez publicado `tracer.45`, esta ruptura deja de existir:
# la línea base ya trae el campo corregido.
eventos:
  - match: 'Previously present field "6" with name "cambiado_en" on message "SolicitudEstadoCambiado" was deleted.'
    fuente: PR #153 (revisión de tracer.45) — `cambiado_en` pasa del campo 6 al 5; tracer.45 sin publicar
  - match: 'Field "5" with name "cambiado_en" on message "SolicitudEstadoCambiado" changed cardinality'
    fuente: PR #153 — el campo 5 pasa de `marca_penalizacion` (bool) a `cambiado_en` (Timestamp); tracer.45 sin publicar
  - match: 'Field "5" with name "cambiado_en" on message "SolicitudEstadoCambiado" changed option "json_name" from "marcaPenalizacion" to "cambiadoEn"'
    fuente: PR #153 — el campo 5 pasa de `marca_penalizacion` a `cambiado_en`; tracer.45 sin publicar
  - match: 'Field "5" with name "cambiado_en" on message "SolicitudEstadoCambiado" changed type from "bool" to "message"'
    fuente: PR #153 — el campo 5 pasa de bool a Timestamp; tracer.45 sin publicar
  - match: 'Field "5" on message "SolicitudEstadoCambiado" changed name from "marca_penalizacion" to "cambiado_en"'
    fuente: PR #153 — se retira `marca_penalizacion` de la superficie amplia; tracer.45 sin publicar
