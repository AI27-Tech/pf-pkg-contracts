// Eventos de ciclo de vida y RBAC del sujeto, publicados por `identidad`
// (identidad.md (g)). Ola contractual 2, `tracer.7`. Superficie AMPLIA:
// identificadores y rol, sin datos personales. Orden por agregado = sujeto_id.
//
// Su consumidor principal es `mensajeria`, que recalcula la membresía efectiva
// de pool y publica `membresia.cambiada` si cambia (mensajeria.md (g)).
//
// Desde `tracer.41` también viaja aquí `alcance.cambiado`: los clientes
// efectivos de monitoreo del sujeto (DEC-053 #3, DEC-149 #18 y #20).
syntax = "proto3";

package ai27.eventos.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/AI27-Tech/pf-pkg-contracts/packages/api-client-go/eventos/ai27/eventos/v1;eventosv1";

// sujeto.creado — al comprometer el alta de un sujeto con su rol inicial.
// Lo publica solo AltaSujeto (gobierno). Acompaña a `rol.asignado` en la misma
// transacción. Consumido por `catalogos`, `mensajeria` y `reportes`.
message SujetoCreado {
  string sujeto_id = 1;
  string tenant_id = 2;
  // Rol inicial (enum `Rol` de _comunes.yaml, DEC-053).
  string rol = 3;
  google.protobuf.Timestamp creado_en = 4;
}

// sujeto.desactivado — al comprometer la desactivación del sujeto.
message SujetoDesactivado {
  string sujeto_id = 1;
  string tenant_id = 2;
  google.protobuf.Timestamp desactivado_en = 3;
}

// sujeto.reactivado — al comprometer la reactivación del sujeto. Hecho propio,
// no reusa `sujeto.creado` (identidad gobierno C5).
message SujetoReactivado {
  string sujeto_id = 1;
  string tenant_id = 2;
  google.protobuf.Timestamp reactivado_en = 3;
}

// rol.asignado — al comprometer la asignación de un rol a un sujeto.
message RolAsignado {
  string sujeto_id = 1;
  string tenant_id = 2;
  // Identificador canónico del rol (enum `Rol` de _comunes.yaml, DEC-053).
  string rol = 3;
  google.protobuf.Timestamp asignado_en = 4;
}

// rol.revocado — al comprometer la revocación de un rol de un sujeto.
message RolRevocado {
  string sujeto_id = 1;
  string tenant_id = 2;
  string rol = 3;
  google.protobuf.Timestamp revocado_en = 4;
}

// alcance.cambiado — al comprometer un cambio en los clientes efectivos de
// monitoreo de un sujeto (`tracer.41`, DEC-149 #18 y #20). Lo publica
// `identidad`, dueño de "mis clientes" y de la jerarquía, en la misma
// transacción que el cambio. Se emite para CADA sujeto cuyo conjunto efectivo
// cambie: el Monitorista al fijar "mis clientes", y su Supervisor y su
// Coordinador cuando cambian los clientes de un subordinado o la jerarquía
// (DEC-140 #2). Al cambiar de rol y retirarse el alcance (DEC-140 #3) se emite
// con el conjunto vacío.
//
// SNAPSHOT, no delta: lleva el conjunto completo, así que aplicarlo dos veces
// deja el mismo estado (idempotente). Lo proyectan `operacion`, `reportes` y
// `mensajeria` para filtrar los viajes por su `cliente_id`, sin cruce con
// unidades. La proyección se reconstruye con `identidad.listarAlcances`
// (patrón ADR 26).
message AlcanceCambiado {
  string sujeto_id = 1;
  // Clientes efectivos del sujeto, sin repetidos: los suyos ("mis clientes") y
  // los de sus subordinados por la jerarquía
  // (`AlcanceSujeto.clientes_efectivos_ids`). Ids de `catalogos`. Vacío = el
  // sujeto no ve ningún viaje por alcance de monitoreo.
  repeated string clientes_efectivos_ids = 2;
  google.protobuf.Timestamp cambiado_en = 3;
}
