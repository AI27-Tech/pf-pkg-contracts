// Sobre común de eventos de dominio de AI27 (capa de dominio).
//
// Todo evento de dominio se publica con este sobre. La entrega es al menos una
// vez; cada consumidor durable deduplica por `evento_id` en su inbox
// (E0-T10, ADR 29). El orden se preserva por agregado mediante `MessageGroupId`
// derivado de la identidad canónica del agregado (ver INVENTARIO.md); no existe
// una clave global.
//
// Convención de idioma (ADR 22 / DEC-024): sustantivos de dominio en español.
syntax = "proto3";

package ai27.eventos.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/AI27-Tech/pf-pkg-contracts/packages/api-client-go/eventos/ai27/eventos/v1;eventosv1";

// Sobre es la envoltura de dominio de cada evento. La capa de transporte
// (stream_id, epoch, seq de `realtime`) NO vive aquí: se añade fuera, en la
// superficie SSE (ADR 28), y nunca ordena mensajes de dominio.
message Sobre {
  // Identificador único del evento. Clave de idempotencia del consumidor.
  string evento_id = 1;

  // Tipo del evento, p. ej. "viaje.estado_cambiado". Debe estar en el registro
  // versionado de tipos permitidos; un tipo no registrado no entra al fanout.
  string tipo = 2;

  // Versión del contrato del payload de este tipo. Agregar es aditivo; quitar
  // requiere un release de gracia (expand/contract).
  uint32 version = 3;

  // Identidad canónica del agregado del que deriva el orden (p. ej. el viaje_id
  // para la familia viaje.*). De aquí se deriva el MessageGroupId.
  string agregado_id = 4;

  // Momento en que el hecho ocurrió (tiempo de dominio), en UTC.
  google.protobuf.Timestamp ocurrido_en = 5;

  // Superficie de sensibilidad: amplia (metadatos no sensibles) o restringida
  // (contenido sensible). El tracer sólo usa la superficie amplia.
  Sensibilidad sensibilidad = 6;
}

// Sensibilidad clasifica el evento en la superficie amplia o restringida
// (E0-T10). Conversación, bandeja y emergencia usan RESTRINGIDA; los eventos de
// viaje del tracer usan AMPLIA.
enum Sensibilidad {
  SENSIBILIDAD_UNSPECIFIED = 0;
  SENSIBILIDAD_AMPLIA = 1;
  SENSIBILIDAD_RESTRINGIDA = 2;
}
