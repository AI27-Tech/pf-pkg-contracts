# =============================================================================
# contracts/events/registro.tipos.yaml
# -----------------------------------------------------------------------------
# REGISTRO CONTRACTUAL DE TIPOS DE EVENTO — legible por máquina (C5 del handoff
# tracer.2). Antes de tracer.2 el registro sólo existía como prosa en
# INVENTARIO.md, que ninguna herramienta podía leer: el fanout no tenía forma de
# validar un tipo contra una fuente.
#
# Este archivo es esa fuente. Contiene EXCLUSIVAMENTE las familias ya aprobadas
# en INVENTARIO.md: ninguna familia nueva entra por aquí. INVENTARIO.md sigue
# siendo la prosa que explica las reglas (orden por agregado, superficie amplia,
# idempotencia); este archivo es el dato que las tools leen.
#
# Las columnas son las mismas que fija INVENTARIO.md:
#   tipo                  Nombre canónico del evento (sustantivo de dominio en
#                         español, ADR 22 / DEC-024). Es el valor del campo
#                         `tipo` del Sobre.
#   version               Versión del contrato del payload. Agregar es aditivo;
#                         quitar o renumerar requiere release de gracia.
#   productor              Servicio que publica el evento.
#   consumidores_durables Servicios que conservan una proyección durable.
#   agregado              Identidad canónica del agregado; de aquí se deriva el
#                         MessageGroupId que preserva el orden (ADR 29).
#   sensibilidad          `amplia` (metadatos no sensibles) o `restringida`.
#                         El tracer sólo publica superficie amplia.
#
# tools/gen-registro genera Go y TS desde este archivo; tools/check-registro
# verifica que el registro, los .proto y INVENTARIO.md digan lo mismo.
# =============================================================================
version: 1

# Familias del tracer, en el mismo orden que INVENTARIO.md.
tipos:
  - tipo: viaje.creado
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria, reportes]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.estado_cambiado
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria, reportes]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.asignado
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria, reportes]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.reasignado
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria, reportes]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.condicion_abierta
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria, reportes]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.condicion_cerrada
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria, reportes]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.mensajeria_habilitada
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.cliente_actualizado
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.cerrado
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria, reportes]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: viaje.acceso_revocado
    version: 1
    productor: operacion
    consumidores_durables: [mensajeria, realtime]
    agregado: viaje_id
    sensibilidad: amplia

  - tipo: sesion.revocada
    version: 1
    productor: identidad
    consumidores_durables: [bff, operacion, catalogos, reportes, mensajeria, realtime]
    agregado: sesion_id
    sensibilidad: amplia

  - tipo: catalogo.actualizado
    version: 1
    productor: catalogos
    consumidores_durables: [operacion, mensajeria]
    # El agregado es la entrada de catálogo (`entidad` + `entidad_id`), no el
    # viaje: el orden de `catalogo.*` es por entrada, no por viaje.
    agregado: entidad + entidad_id
    sensibilidad: amplia

  # --- Ola contractual 2 (`tracer.7`): sujeto y RBAC de `identidad` ---------
  # Fuente de la proyección de pool de `mensajeria` (identidad.md (g)).
  - tipo: sujeto.desactivado
    version: 1
    productor: identidad
    consumidores_durables: [catalogos, mensajeria, reportes]
    agregado: sujeto_id
    sensibilidad: amplia

  - tipo: rol.asignado
    version: 1
    productor: identidad
    consumidores_durables: [mensajeria, reportes]
    agregado: sujeto_id
    sensibilidad: amplia

  - tipo: rol.revocado
    version: 1
    productor: identidad
    consumidores_durables: [mensajeria, reportes]
    agregado: sujeto_id
    sensibilidad: amplia

  # --- Ola contractual 2 (`tracer.7`): conversación de `mensajeria` ---------
  # Superficie RESTRINGIDA: viajan envueltos en `SobreVivo` por el tema
  # restringido (ADR 28; mensajeria.md (g)).
  - tipo: conversacion.abierta
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime, reportes]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: conversacion.enrutada
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime, reportes]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: conversacion.reclamada
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: conversacion.liberada
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: conversacion.transferida
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime, reportes]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: conversacion.atendida
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime, reportes]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: conversacion.cerrada
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime, reportes]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: mensaje.creado
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime, reportes]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: recibo.entregado
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: recibo.leido
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime]
    agregado: conversacion_id
    sensibilidad: restringida

  - tipo: membresia.cambiada
    version: 1
    productor: mensajeria
    consumidores_durables: [realtime]
    agregado: bandeja_id
    sensibilidad: restringida

# Familias DECLARADAS FUERA del tracer. No entran al fanout de ninguna cola,
# tema ni clave de orden de V1 (ADR 20). Se declaran para que una versión futura
# las agregue explícitamente, no por omisión.
fuera_del_tracer:
  # Superficie restringida pendiente: bandeja (revisión de colección) y
  # emergencia (E7) entran en `tracer.8`.
  - [bandeja, emergencia]
  # Telemetría/tracking: V2, fuera de todo tema, cola y clave de orden de V1.
  - [sin_senal, telemetria, push]