# =============================================================================
# contracts/openapi/operacion.yaml
# -----------------------------------------------------------------------------
# Superficie HTTP interna de `operacion` para el tracer. Dueño del progreso del
# viaje, su máquina de estados, su asignación, su bitácora y su auditoría, en
# una sola frontera transaccional.
#
# INVARIANTE CLAVE: no existe escritura directa de `estado`. La única forma de
# mover un viaje es una transición validada contra `contracts/estados/`
# (operacion.md (f)). El comando de asignación es una escritura atómica.
#
# El enum `EstadoViaje` de este spec DEBE coincidir con
# contracts/estados/viaje.estados.yaml. CI verifica la equivalencia
# (make check-estados-openapi); la fuente canónica es el archivo de estados.
# =============================================================================
openapi: 3.0.3
info:
  title: AI27 — operacion
  version: 0.1.0-tracer.1
  description: >-
    Progreso del viaje: creación, transiciones, asignación, bitácora,
    incidencias y auditoría. Consumido por `bff`, nunca por el frontend directo.
  x-ai27-servicio: operacion
  x-ai27-capa: dominio
  x-ai27-tracer: true

servers:
- url: /
  description: Ruta base montada por el despliegue.

security:
- bearerCognito: []

tags:
- name: viajes
- name: asignacion
- name: bitacora
- name: incidencias
- name: auditoria

paths:
  /api/v1/viajes:
    post:
      operationId: crearViaje
      tags: [viajes]
      summary: Crear un viaje.
      description: >-
        El cliente crea en `SOLICITADO`. Operación crea en `APROBADO` en el mismo
        acto y puede asignar atómicamente `unidad`+`custodios` para dejarlo
        `ASIGNADO` (DEC-026). El estado inicial lo determina el rol del token,
        no un campo de la petición.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrearViajeEntrada"}
      responses:
        "201":
          description: Viaje creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}
    get:
      operationId: listarViajes
      tags: [viajes]
      summary: Listar viajes por alcance.
      description: >-
        Para audiencia interna, alcance de flota; para cliente, alcance de
        tenant (P9, P10). El alcance se deriva del token.
      parameters:
      - name: estado
        in: query
        required: false
        description: Filtro por estado de progreso.
        schema: {$ref: "#/components/schemas/EstadoViaje"}
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de viajes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaViajes"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/viajes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerViaje
      tags: [viajes]
      summary: Detalle del viaje.
      description: >-
        Estado de progreso MÁS condiciones activas como dato separado (§C.2):
        un viaje puede estar `EN_TRANSITO` y con `INCIDENCIA` abierta a la vez.
      responses:
        "200":
          description: Viaje con condiciones activas.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeDetalle"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/transiciones:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: transicionarViaje
      tags: [viajes]
      summary: Transición de estado validada, con causa.
      description: >-
        Único mecanismo para mover un viaje. Se valida contra
        `contracts/estados/`; una transición no permitida devuelve 409. No
        existe escritura directa de `estado`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransicionEntrada"}
      responses:
        "200":
          description: Transición aplicada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Transición no permitida por la máquina de estados. `codigo` de
            máquina `transicion_no_permitida`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/asignacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: asignarRecursos
      tags: [asignacion]
      summary: Asignar unidad + custodios (escritura atómica).
      description: >-
        Reserva `unidad` y `custodios` con disponibilidad verificada en una sola
        transacción (ADR 24). Si algún recurso no es apto o no está disponible,
        no se reserva parcialmente nada (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AsignacionEntrada"}
      responses:
        "200":
          description: Asignación confirmada; el viaje queda `ASIGNADO`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asignacion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Recurso no apto o no disponible en la ventana; sin reserva parcial.
            `codigo` `recurso_no_disponible` o `recurso_no_apto`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}
    patch:
      operationId: reasignarRecursos
      tags: [asignacion]
      summary: Reasignar con motivo (auditado).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasignacionEntrada"}
      responses:
        "200":
          description: Reasignación confirmada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asignacion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/viajes/{id}/bitacora:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarBitacora
      tags: [bitacora]
      summary: Listar entradas de bitácora (ordenadas por tiempo).
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de entradas.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaBitacora"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: registrarEntradaBitacora
      tags: [bitacora]
      summary: Registrar una entrada de bitácora (append-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EntradaBitacoraEntrada"}
      responses:
        "201":
          description: Entrada registrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntradaBitacora"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/viajes/{id}/incidencias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: abrirIncidencia
      tags: [incidencias]
      summary: Abrir una incidencia (abre la condición ortogonal INCIDENCIA).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IncidenciaEntrada"}
      responses:
        "201":
          description: Incidencia abierta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incidencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Ya existe una condición `INCIDENCIA` abierta para este viaje
            (índice único parcial). `codigo` `condicion_ya_abierta`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/incidencias/{iid}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: iid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: resolverIncidencia
      tags: [incidencias]
      summary: Resolver una incidencia (cierra la condición).
      description: >-
        Al resolverse, el viaje regresa a su curso normal; el progreso nunca se
        perdió (§C.2).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolucionIncidenciaEntrada"}
      responses:
        "200":
          description: Incidencia resuelta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incidencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/auditoria:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: consultarAuditoria
      tags: [auditoria]
      summary: Consulta probatoria de la auditoría del viaje (administrator).
      description: >-
        Consulta/exportación probatoria. Sólo administrator (DEC-036); cada
        acceso queda a su vez auditado.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de registros de auditoría.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaAuditoria"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

components:
  schemas:
    # --- Enum espejo de contracts/estados/viaje.estados.yaml. CI verifica la
    #     equivalencia; la fuente canónica es el archivo de estados. ---
    EstadoViaje:
      type: string
      description: >-
        Estado de progreso del viaje. Espejo del enum canónico de
        `contracts/estados/` (ADR 19). Incluye estados V2 declarados e
        inalcanzables en V1 (PATRULLA_EN_CAMINO).
      enum:
      - SOLICITADO
      - APROBADO
      - RECHAZADO_POR_AI27
      - RECHAZADO_POR_CLIENTE
      - ASIGNADO
      - APTO_PARA_SALIDA
      - EN_EMBARQUE
      - PATRULLA_EN_CAMINO
      - EN_TRANSITO
      - EN_DESTINO
      - EN_DESCARGA
      - CERRADO
      - CANCELADO

    CondicionViaje:
      type: string
      description: Condición ortogonal al progreso (§C.2). Nunca es un estado.
      enum: [INCIDENCIA, SIN_SENAL]

    Destino:
      type: object
      additionalProperties: false
      required: [nombre]
      properties:
        nombre:
          type: string
          description: Destino en texto libre (DEC-010 #1).
        numero_envio: {type: string}
        fecha_cita:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
    CrearViajeEntrada:
      type: object
      additionalProperties: false
      required: [origen, destinos]
      properties:
        origen:
          type: string
          description: Origen en texto libre (DEC-010 #1).
        destinos:
          type: array
          minItems: 1
          description: Uno o más destinos (multi-parada, DEC-013/DEC-020).
          items: {$ref: "#/components/schemas/Destino"}
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio: {type: string}
        # asignacion es opcional: sólo Operación puede asignar en el mismo acto
        # (DEC-026). Ausente = sin asignación (equivale a null en 3.0.x).
        asignacion:
          $ref: "#/components/schemas/AsignacionEntrada"
    Viaje:
      type: object
      additionalProperties: false
      required: [id, estado, origen, destinos, creado_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado: {$ref: "#/components/schemas/EstadoViaje"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        origen: {type: string}
        destinos:
          type: array
          items: {$ref: "#/components/schemas/Destino"}
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        # eta_cliente es opcional: ETA A→B capturado manualmente por el operador
        # (DEC-007, A1). Ausente = sin ETA aún (equivale a null en 3.0.x).
        eta_cliente:
          $ref: "#/components/schemas/Eta"
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    ViajeDetalle:
      type: object
      additionalProperties: false
      required: [viaje, condiciones_activas]
      properties:
        viaje: {$ref: "#/components/schemas/Viaje"}
        condiciones_activas:
          type: array
          description: Condiciones ortogonales abiertas (dato separado del estado).
          items: {$ref: "#/components/schemas/CondicionAbierta"}

    CondicionAbierta:
      type: object
      additionalProperties: false
      required: [tipo, abierta_en]
      properties:
        tipo: {$ref: "#/components/schemas/CondicionViaje"}
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    Eta:
      type: object
      additionalProperties: false
      required: [valor, obsoleto]
      properties:
        valor: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        obsoleto:
          type: boolean
          description: >-
            true cuando el ETA venció y no se ha re-confirmado (marca `stale`,
            DEC-021 #2). El ETA no se recalcula solo.

    PaginaViajes:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Viaje"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    TransicionEntrada:
      type: object
      additionalProperties: false
      required: [a_estado]
      properties:
        a_estado:
          allOf: [$ref: "#/components/schemas/EstadoViaje"]
          description: Estado destino. Se valida contra la máquina de estados.
        causa:
          type: string
          description: >-
            Causa de la transición. Obligatoria cuando el destino la requiere
            (p. ej. motivo de rechazo, DEC-020 #2). La validación fina vive en
            el servicio.

    AsignacionEntrada:
      type: object
      additionalProperties: false
      required: [unidad_id, custodios_ids]
      properties:
        unidad_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        custodios_ids:
          type: array
          minItems: 1
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    ReasignacionEntrada:
      type: object
      additionalProperties: false
      required: [motivo]
      properties:
        unidad_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.
        custodios_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        motivo:
          type: string
          description: Motivo de la reasignación (auditado).

    Asignacion:
      type: object
      additionalProperties: false
      required: [viaje_id, unidad_id, custodios_ids]
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        unidad_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        custodios_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    EntradaBitacoraEntrada:
      type: object
      additionalProperties: false
      required: [texto]
      properties:
        texto: {type: string}

    EntradaBitacora:
      type: object
      additionalProperties: false
      required: [id, viaje_id, texto, autor, ts]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        texto: {type: string}
        autor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaBitacora:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EntradaBitacora"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    IncidenciaEntrada:
      type: object
      additionalProperties: false
      required: [tipo_interno]
      properties:
        tipo_interno:
          type: string
          description: >-
            Tipo interno de incidencia (catálogo operativo). La vista curada
            para el cliente la compone `bff` (DEC-006), no este contrato.
        descripcion: {type: string}

    Incidencia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, tipo_interno, estado, abierta_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo_interno: {type: string}
        estado:
          type: string
          enum: [en_atencion, resuelta]
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        resuelta_en:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
    ResolucionIncidenciaEntrada:
      type: object
      additionalProperties: false
      required: [resolucion]
      properties:
        resolucion: {type: string}

    RegistroAuditoria:
      type: object
      additionalProperties: false
      required: [entidad, entidad_id, actor, ts]
      properties:
        entidad: {type: string}
        entidad_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        de: {type: string}
        a: {type: string}
        actor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaAuditoria:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RegistroAuditoria"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
