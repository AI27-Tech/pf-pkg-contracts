# =============================================================================
# contracts/openapi/operacion.yaml
# -----------------------------------------------------------------------------
# Superficie HTTP interna de `operacion` para el tracer. Dueño del progreso del
# viaje, su máquina de estados, su asignación, su bitácora y su auditoría, en
# una sola frontera transaccional.
#
# INVARIANTE CLAVE: no existe escritura directa de `estado`. La única forma de
# mover un viaje es una transición validada contra `contracts/estados/`
# (operacion.md (f)). El comando de asignación es una escritura atómica.
#
# El enum `EstadoViaje` de este spec DEBE coincidir con
# contracts/estados/viaje.estados.yaml. CI verifica la equivalencia
# (make check-estados-openapi); la fuente canónica es el archivo de estados.
# =============================================================================
openapi: 3.0.3
info:
  title: AI27 — operacion
  version: 0.1.0-tracer.42
  description: >-
    Progreso del viaje: creación, transiciones, asignación, bitácora,
    incidencias y auditoría. Consumido por `bff`, nunca por el frontend directo.


    Alcance sobre los viajes (DEC-149). Audiencia Cliente: los viajes de su
    tenant (sin cambio). `jefe_operativo` y `administrador`: todos.
    `monitorista`, `supervisor` y `coordinador`: los viajes cuyo `cliente_id`
    está entre los clientes efectivos del sujeto según `identidad` ("mis
    clientes" y, por la jerarquía, los de sus subordinados; DEC-149 #18),
    que `operacion` mantiene como proyección local de `alcance.cambiado`
    (reconstruible con `identidad.listarAlcances`, DEC-149 #20, ADR 26); solo
    desde `APROBADO`; el viaje nace en `APROBADO` (ADR 38), así que ya no
    existen viajes en `SOLICITADO` ni en `RECHAZADO_POR_AI27`. No hay cruce con
    unidades: el `cliente_id` y el estado `activa` de las unidades no
    intervienen. El monitoreo sigue al cliente del viaje, no al de la unidad
    prestada (DEC-149 #5). `ejecutivo` no lista ni lee viajes (`403`, DEC-149 #16);
    `reaccion` recibe `403` en `listarViajes` (ver `obtenerViaje`).

    Fuera de alcance, el viaje no aparece en `listarViajes` y toda operación
    sobre él (`/api/v1/viajes/{id}` y sus subrecursos) responde `404`, igual que
    si no existiera. `403` es para la acción que el rol no tiene (tabla rol ×
    acción, DEC-149 #8).
  x-ai27-servicio: operacion
  x-ai27-capa: dominio
  x-ai27-tracer: true

servers:
- url: /
  description: Ruta base montada por el despliegue.

security:
- bearerCognito: []

tags:
- name: viajes
- name: solicitudes
  description: >-
    Solicitud previa al viaje: cotización, pago y aprobación (V2, ADR 38 y 39,
    DEC-148). Al aprobarse nace el viaje con el mismo id.
- name: asignacion
- name: roster
  description: Roster de unidades (paquetes vehículo + custodios) administrado por el jefe_operativo (ADR 31/33).
- name: bitacora
- name: incidencias
- name: estadias
  description: >-
    Estadías del viaje (paradas durante EN_TRANSITO). Condición con datos
    propios, NO un valor de condicion_viaje ni un estado (DEC-013/DEC-038).
- name: auditoria
- name: adjuntos
  description: >-
    Adjuntos/evidencia del viaje (E6-T4). Metadatos en `bitacora`; bytes en el
    almacenamiento de objetos (ADR 32), nunca por el servicio. Acceso auditado.

paths:
  /api/v1/viajes:
    post:
      operationId: crearViaje
      tags: [viajes]
      summary: Crear un viaje (Operación).
      description: >-
        Solo Operación (`jefe_operativo` y `administrador`). Crea en `APROBADO`
        en el mismo acto y puede asignar atómicamente `unidad`+`custodios` para
        dejarlo `ASIGNADO` (DEC-026). El cliente ya no crea viajes: crea una
        solicitud (`crearSolicitud`, ADR 38) y el viaje nace al aprobarse, con el
        mismo id. Un Cliente que llame aquí recibe `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrearViajeEntrada"}
      responses:
        "201":
          description: Viaje creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}
    get:
      operationId: listarViajes
      tags: [viajes]
      summary: Listar viajes por alcance.
      description: >-
        Solo los viajes del alcance del llamante (ver la descripción del spec,
        DEC-149): Cliente, su tenant; `jefe_operativo` y `administrador`,
        todos; `monitorista`, `supervisor` y `coordinador`, los de sus
        clientes efectivos ("mis clientes", DEC-149 #18) desde `APROBADO`. Un
        viaje fuera de alcance no aparece. `ejecutivo` y `reaccion` reciben
        `403` (DEC-149 #16). El rol se deriva del token; el alcance se resuelve
        en servidor (DEC-053).
      parameters:
      - name: estado
        in: query
        required: false
        description: Filtro por estado de progreso.
        schema: {$ref: "#/components/schemas/EstadoViaje"}
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de viajes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaViajes"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/viajes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerViaje
      tags: [viajes]
      summary: Detalle del viaje.
      description: >-
        Estado de progreso MÁS condiciones activas como dato separado (§C.2):
        un viaje puede estar `EN_TRANSITO` y con `INCIDENCIA` abierta a la vez.
        Fuera del alcance del llamante (DEC-149) responde `404`. `ejecutivo`
        recibe `403` (DEC-149 #16). `reaccion` lo lee sin filtro por cliente
        porque el `bff` compone con su token el detalle de su caso
        (`obtenerEmergencia`, DEC-121 #2); el `403` de Reacción en el detalle
        interno lo aplica el `bff` en `obtenerViajeInterno`.
      responses:
        "200":
          description: Viaje con condiciones activas.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeDetalle"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Ficha técnica del viaje (E8-T12 / DEC-104). El monitorista la captura y edita
  # incrementalmente. Es EDITABLE y admite datos faltantes (DEC-043 #3): el PATCH
  # no exige ningún campo; en V1 NINGÚN campo de ficha es guarda de transición de
  # estado (DEC-104 #3). La escolta NO vive aquí: se deriva de la asignación
  # (DEC-044). `tipo_servicio`, `origen` y `destinos` son del viaje, no de la
  # ficha: se leen de `obtenerViaje`. La ficha serializa lo que la solicitud y la
  # asignación no cubren: tracto del cliente, contenedores y la referencia de GPS.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/ficha:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerFicha
      tags: [bitacora]
      summary: Leer la ficha técnica del viaje.
      responses:
        "200":
          description: Ficha técnica del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FichaTecnica"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: guardarFicha
      tags: [bitacora]
      summary: Guardar parcialmente la ficha técnica (edición incremental).
      description: >-
        Edición incremental (DEC-043 #3): ningún campo es obligatorio. Las
        propiedades presentes forman el nuevo valor; las ausentes no se tocan.
        Las colecciones (`contenedores`, `gps_ids`) se REEMPLAZAN por completo
        con el arreglo recibido; un arreglo vacío borra la lista. Un contenedor
        sin ningún dato se descarta. No cambia `estado`: la ficha no gatea
        transiciones en V1 (DEC-104 #3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FichaTecnicaEntrada"}
      responses:
        "200":
          description: Ficha actualizada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FichaTecnica"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/transiciones:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: transicionarViaje
      tags: [viajes]
      summary: Transición de estado validada, con causa.
      description: >-
        Único mecanismo para mover un viaje. Se valida contra
        `contracts/estados/`; una transición no permitida devuelve 409. No
        existe escritura directa de `estado`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransicionEntrada"}
      responses:
        "200":
          description: Transición aplicada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            Transición no permitida. `codigo` de máquina en el cuerpo:
            `transicion_no_permitida` (la arista no existe, p. ej. el viaje ya es
            terminal o hay carrera); `cierre_anticipado_solo_por_incidencia` (se
            pidió cerrar desde `EN_TRANSITO` con un motivo distinto de
            `por_incidencia`); `cierre_anticipado_requiere_incidencia` (cierre
            anticipado sin una condición `INCIDENCIA` abierta). DEC-020 #6 / DEC-113.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/asignacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerAsignacion
      tags: [asignacion]
      summary: Escolta vigente del viaje, con cada unidad del roster.
      description: >-
        Devuelve las unidades de la asignación vigente del viaje, cada una con
        su `tipo`, `vehiculo_id` y `custodios_ids` (referencias a `catalogos`).
        Sin asignación vigente (viaje aún no asignado o ya liberado), `unidades`
        va vacío con 200; no responde 404 por eso. Solo audiencia Interno: el
        Cliente recibe `404` (DEC-132). La consume el `bff` para componer la
        escolta del detalle de Reacción (`obtenerEmergencia`, DEC-121 #2); el
        nombre y teléfono de los custodios y las placas del vehículo los
        resuelve el `bff` en `catalogos` (E8-T18).
      responses:
        "200":
          description: Escolta vigente; `unidades` vacío si no hay asignación.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EscoltaVigente"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: asignarRecursos
      tags: [asignacion]
      summary: Asignar la escolta (una o más unidades) en una escritura atómica.
      description: >-
        Reserva la `escolta` —una o más `unidades` (paquetes vehículo + custodios)
        del roster— con disponibilidad verificada en una sola transacción (ADR 31).
        La reserva es por `unidad` completa, no por vehículo y custodio por
        separado. Si alguna unidad no está disponible en la ventana, no se reserva
        parcialmente nada (409). La aptitud es informativa y NO condiciona la
        asignación en V1 (DEC-055).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AsignacionEntrada"}
      responses:
        "200":
          description: Asignación confirmada; el viaje queda `ASIGNADO`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asignacion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            Alguna unidad no está disponible en la ventana del viaje; sin reserva
            parcial. Único código de rechazo: `recurso_no_disponible` (la reserva
            falló, el "no hay gente" de DEC-043). La aptitud nunca rechaza en V1
            (DEC-055): no existe `recurso_no_apto`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}
    patch:
      operationId: reasignarRecursos
      tags: [asignacion]
      summary: Reasignar la escolta completa, con motivo (auditado).
      description: >-
        La reasignación manda la escolta completa en `unidades_ids` (una o más
        unidades del roster). Cambiar un custodio es edición de roster, NO
        reasignación (D2): por eso no se reciben custodios aquí.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasignacionEntrada"}
      responses:
        "200":
          description: Reasignación confirmada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asignacion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/viajes/{id}/eta:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: fijarEta
      tags: [viajes]
      summary: Fijar el ETA estimado del viaje (captura manual del operador).
      description: >-
        En V1 el ETA es un dato capturado a mano, no un cálculo (ADR 20 /
        DEC-007). NO valida contra el grafo de transiciones —no es un cambio de
        estado—; sólo exige que el viaje no esté en un estado terminal.
        `operacion` guarda y devuelve el valor crudo; la obsolescencia (`stale`)
        la calcula el `bff` al leer, no este servicio (ADR 20).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EtaEntrada"}
      responses:
        "200":
          description: ETA actualizado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            El viaje está en un estado terminal y no admite fijar ETA. `codigo`
            de máquina `viaje_en_estado_terminal`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/fecha-hora:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: completarFechaHora
      tags: [viajes]
      summary: Completar o editar la fecha/hora del servicio del viaje.
      description: >-
        Escribe `fecha_hora_servicio` sobre un viaje ya creado. En V2 la fecha
        la exige la aprobación de la solicitud (`aprobarSolicitud`, DEC-010 #2) y
        el viaje nace con ella; este endpoint la corrige después. NO valida contra el
        grafo de transiciones —no es un cambio de estado—; sólo exige que el
        viaje no esté en un estado terminal, igual que `fijarEta`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FechaHoraEntrada"}
      responses:
        "200":
          description: Fecha/hora del servicio actualizada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            El viaje está en un estado terminal y no admite editar la fecha/hora
            del servicio. `codigo` de máquina `viaje_en_estado_terminal`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  # ===========================================================================
  # SOLICITUDES (V2, ADR 38 y 39, DEC-148). Previas al viaje: el cliente crea la
  # solicitud, `cotizacion` la cotiza y confirma el pago, y el Jefe Operativo la
  # aprueba. Al aprobarse nace el viaje con el MISMO id, en la misma transacción
  # (ADR 39). Una acción por endpoint porque cada una lleva datos propios. El
  # estado solo cambia por una acción validada contra
  # `contracts/estados/solicitud.estados.yaml`; no existe escritura directa.
  #
  # Rol × acción (DEC-148 #1, #12, #20, #22, #28). `cotizacion` y
  # `administrador` ven todas las solicitudes en cualquier estado; el
  # `administrador` hereda las facultades de `cotizacion` y del Jefe Operativo.
  # `jefe_operativo` ve solo las que están en `PAGADO`. El Cliente, las de su
  # tenant. Cualquier otro rol recibe `403`. Una solicitud fuera de alcance
  # responde `404`, igual que si no existiera.
  # ===========================================================================
  /api/v1/solicitudes:
    post:
      operationId: crearSolicitud
      tags: [solicitudes]
      summary: Crear una solicitud (cliente).
      description: >-
        Solo el Cliente. Nace en `SOLICITADO`. La fecha y hora del servicio es
        opcional (DEC-148 #38); si falta, `cotizacion` la fija al cotizar (#39).
        La organización de la solicitud es la del token; no se acepta en el
        cuerpo. Operación no crea solicitudes: sus viajes nacen en `APROBADO`
        (`crearViaje`, DEC-026). El id de la solicitud es el que heredará el
        viaje al aprobarse. Publica `solicitud.creada`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrearSolicitudEntrada"}
      responses:
        "201":
          description: Solicitud creada en `SOLICITADO`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    get:
      operationId: listarSolicitudes
      tags: [solicitudes]
      summary: Listar solicitudes por alcance.
      description: >-
        Cliente: las de su tenant. `cotizacion` y `administrador`: todas, en
        cualquier estado. `jefe_operativo`: solo las que están en `PAGADO` (su
        bandeja, DEC-148 #22). Cualquier otro rol recibe `403`. Cada fila lleva
        las marcas de aviso que le tocan al llamante (`avisos`, DEC-148 #53 a
        #57).
      parameters:
      - name: estado
        in: query
        required: false
        description: Filtro por estado de la solicitud.
        schema: {$ref: "#/components/schemas/EstadoSolicitud"}
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de solicitudes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaSolicitudes"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/solicitudes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerSolicitud
      tags: [solicitudes]
      summary: Obtener una solicitud con su cotización vigente.
      description: >-
        Devuelve la solicitud con la cotización vigente. Las versiones anteriores
        de la cotización no se exponen aquí: están en `listarHistoricoSolicitud`
        para el personal interno (DEC-148 #42). Fuera de alcance responde `404`.
      responses:
        "200":
          description: La solicitud.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/solicitudes/{id}/historico:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarHistoricoSolicitud
      tags: [solicitudes]
      summary: Histórico de la solicitud (audiencia interna).
      description: >-
        Cada transición y cada acción sin cambio de estado (recotizar,
        reprogramar), en orden cronológico, con actor, motivo y marca de tiempo.
        Las entradas de cotización llevan la versión completa (DEC-148 #42).
        Solo `cotizacion`, `jefe_operativo` (en `PAGADO`) y `administrador`; el
        Cliente recibe `403`.
      responses:
        "200":
          description: Histórico de la solicitud.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HistoricoSolicitud"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/solicitudes/{id}/cotizacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    put:
      operationId: cotizarSolicitud
      tags: [solicitudes]
      summary: Cotizar o recotizar la solicitud.
      description: >-
        Solo `cotizacion` y `administrador`. En `SOLICITADO` envía la primera
        cotización y la solicitud pasa a `COTIZADO`; en `COTIZADO` recotiza sin
        cambiar de estado. Cada llamada crea una versión nueva y conserva las
        anteriores (DEC-148 #42). Exige monto, moneda y fecha y hora del servicio
        (DEC-148 #39, #41); la fecha puede diferir de la que pidió el cliente.
        La vigencia es de 15 días desde esta entrega, contados en
        `America/Mexico_City` (DEC-148 #15, #50). No valida disponibilidad de
        unidades (DEC-148 #23). El cambio de fecha no requiere aceptación del
        cliente en el sistema (DEC-148 #40).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CotizacionEntrada"}
      responses:
        "200":
          description: Cotización registrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/SolicitudTransicionNoPermitida"}

  /api/v1/solicitudes/{id}/fecha-hora:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    put:
      operationId: reprogramarSolicitud
      tags: [solicitudes]
      summary: Reprogramar la fecha y hora de una solicitud pagada.
      description: >-
        Solo `cotizacion` y `administrador`, con la solicitud en `PAGADO`. El
        motivo es obligatorio. No hay pago nuevo ni cambio de estado; el cambio
        queda en el histórico con actor, motivo y marca de tiempo. Se hace
        después de acordarlo con el cliente en la conversación de la solicitud
        (DEC-148 #24, #40).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReprogramacionEntrada"}
      responses:
        "200":
          description: Fecha y hora actualizada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/SolicitudTransicionNoPermitida"}

  /api/v1/solicitudes/{id}/rechazo-cotizacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: rechazarCotizacion
      tags: [solicitudes]
      summary: Rechazar la cotización (cliente).
      description: >-
        Solo el Cliente dueño de la solicitud, en `COTIZADO`. "No acepto este
        precio o estas condiciones": la solicitud termina en
        `RECHAZADO_POR_CLIENTE`, sin marca de penalización y sin crear viaje
        (DEC-148 #9, #18). Distinta de `cancelarSolicitud`.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccionClienteEntrada"}
      responses:
        "200":
          description: Cotización rechazada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/SolicitudTransicionNoPermitida"}

  /api/v1/solicitudes/{id}/cancelacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: cancelarSolicitud
      tags: [solicitudes]
      summary: Cancelar la solicitud (cliente).
      description: >-
        Solo el Cliente dueño de la solicitud, en `SOLICITADO`, `COTIZADO` o
        `PAGADO`. "Ya no necesito el servicio": termina en
        `CANCELADO_POR_CLIENTE`. Lleva marca de penalización solo si estaba en
        `PAGADO`; sin ella en los otros dos casos (DEC-148 #6, #17). Argos solo
        marca; no calcula ni guarda monto. No se crea viaje. La respuesta
        confirma la marca (`marca_penalizacion`).
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccionClienteEntrada"}
      responses:
        "200":
          description: Solicitud cancelada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/SolicitudTransicionNoPermitida"}

  /api/v1/solicitudes/{id}/pago:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    put:
      operationId: confirmarPago
      tags: [solicitudes]
      summary: Confirmar el pago de la solicitud.
      description: >-
        Solo `cotizacion` y `administrador`. El pago ocurre fuera de Argos; esto
        registra su confirmación. Exige la fecha del pago, que debe caer dentro
        de la vigencia de la última cotización: gana la fecha del pago, no la de
        la confirmación (DEC-148 #34, #43). Desde `COTIZADO` pasa a `PAGADO`.
        Desde `VENCIDA` también pasa a `PAGADO`, solo si la fecha del pago cae
        dentro de la vigencia, y queda registrado como excepción (DEC-148 #35).
        No genera aviso al cliente (#56).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PagoEntrada"}
      responses:
        "200":
          description: Pago confirmado; la solicitud queda en `PAGADO`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            No se puede confirmar. `codigo` de máquina:
            `transicion_no_permitida` (estado de origen inválido) o
            `fecha_pago_fuera_de_vigencia` (la fecha del pago no cae dentro de
            la vigencia de la última cotización).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/solicitudes/{id}/reversa-pago:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: revertirPago
      tags: [solicitudes]
      summary: Revertir una confirmación de pago hecha por error.
      description: >-
        Solo `administrador`, con motivo obligatorio y mientras la solicitud siga
        en `PAGADO`. Regresa a `COTIZADO` y queda en el histórico (DEC-148 #37).
        Si la vigencia ya terminó al revertir, el resultado está pendiente de
        decisión (ADR 38).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MotivoEntrada"}
      responses:
        "200":
          description: Pago revertido; la solicitud regresa a `COTIZADO`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/SolicitudTransicionNoPermitida"}

  /api/v1/solicitudes/{id}/aprobacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: aprobarSolicitud
      tags: [solicitudes]
      summary: Aprobar la solicitud pagada y crear el viaje.
      description: >-
        Solo `jefe_operativo` y `administrador`, con la solicitud en `PAGADO`. La
        aprobación es explícita, nunca automática. Exige la fecha y hora del
        servicio (DEC-010 #2). En la misma transacción la solicitud pasa a
        `APROBADO` y nace el viaje en `APROBADO` con el MISMO id de la solicitud
        (DEC-148 #3, #52; ADR 39): no existe una solicitud aprobada sin su viaje.
        El viaje se consulta después con `obtenerViaje` usando ese id. La respuesta
        es la última vista de la solicitud para el `jefe_operativo`: como solo ve
        las que están en `PAGADO`, `obtenerSolicitud` le responde `404` desde que
        la resuelve. Por la misma razón, una segunda aprobación tras una carrera
        le da `404`; el `409 transicion_no_permitida` lo ve el `administrador`.
      responses:
        "200":
          description: Solicitud aprobada; el viaje ya existe con el mismo id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            No se puede aprobar. `codigo` de máquina: `transicion_no_permitida`
            (no está en `PAGADO`) o `fecha_hora_servicio_requerida` (falta la
            fecha y hora del servicio).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/solicitudes/{id}/rechazo:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: rechazarSolicitud
      tags: [solicitudes]
      summary: Rechazar la solicitud pagada (AI27).
      description: >-
        Solo `jefe_operativo` y `administrador`, con la solicitud en `PAGADO`.
        Motivo obligatorio (DEC-020 #2). Termina en `RECHAZADO_POR_AI27`, sin
        marca de reembolso (el reembolso se maneja fuera de Argos, DEC-148 #19) y
        sin crear viaje. El cliente ve el motivo. Igual que en `aprobarSolicitud`,
        el `jefe_operativo` ya no ve la solicitud después de resolverla (`404`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MotivoEntrada"}
      responses:
        "200":
          description: Solicitud rechazada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Solicitud"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/SolicitudTransicionNoPermitida"}

  /api/v1/unidades:
    get:
      operationId: listarUnidades
      tags: [roster]
      summary: Listar unidades del roster (administración del jefe_operativo).
      description: >-
        El roster de `unidades` vive en `operacion` (ADR 31 §5 / ADR 33), no en
        `catalogos`. Una `unidad` es un paquete pre-armado: un vehículo (de
        `catalogos`) con uno o dos custodios (de `catalogos`), referidos por
        identificador. En V1 la lectura del roster NO expone aptitud (queda para
        después).
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de unidades del roster.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaUnidades"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    post:
      operationId: crearUnidad
      tags: [roster]
      summary: Crear una unidad del roster (jefe_operativo).
      description: >-
        Arma una `unidad` emparejando un vehículo con uno o dos custodios
        (coche: uno o dos; moto: uno — ADR 31). El `tipo` NO se envía: se deriva
        del vehículo en el servidor. Crean `jefe_operativo` y `administrador`
        (DEC-142 #3). El vehículo y los custodios no pueden estar en otra unidad
        activa (DEC-142 #4). `cliente_id` es opcional: el cliente al que sirve
        la unidad, dato del roster que no define el alcance (DEC-149 #2, #13 y
        #18).
        Responde 400 si el vehículo, algún custodio o el cliente no existe o
        está inactivo en `catalogos`, si hay custodios repetidos o si la cantidad
        de custodios no corresponde al tipo (patrulla: 1 o 2; moto: 1, ADR 31).
        Otro rol responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnidadEntrada"}
      responses:
        "201":
          description: Unidad creada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Exclusividad del roster (DEC-142 #4). `codigo` de máquina
            `vehiculo_en_otra_unidad` si el vehículo ya está en otra unidad
            activa, o `custodio_en_otra_unidad` si algún custodio lo está.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/unidades/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerUnidad
      tags: [roster]
      summary: Detalle de una unidad del roster.
      description: Leen `jefe_operativo` y `administrador` (DEC-142 #3); otro rol responde 403.
      responses:
        "200":
          description: Unidad.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: modificarUnidad
      tags: [roster]
      summary: Modificar una unidad del roster, incluido activar/desactivar.
      description: >-
        Cambia el vehículo, los custodios, el cliente al que sirve
        (`cliente_id`, DEC-149 #2) o el estado `activa` de la unidad.
        Activar/desactivar es un cambio de `activa` por esta misma ruta.
        Ninguno de los dos cambia el alcance del monitoreo (DEC-149 #18). El
        `tipo` nunca se escribe: se deriva del vehículo. Modifican
        `jefe_operativo` y `administrador` (DEC-142 #3). La exclusividad
        (DEC-142 #4) se revisa sobre el resultado del cambio, también al
        reactivar. Una unidad con reserva en un viaje no terminal no se edita
        ni se desactiva: primero se reasigna la escolta de ese viaje
        (`PATCH /api/v1/viajes/{id}/asignacion`, DEC-142 #5); la regla no
        distingue el campo, así que también aplica a `cliente_id`.
        Responde 400 si el vehículo, algún custodio o el cliente no existe o
        está inactivo en `catalogos`, si hay custodios repetidos o si la cantidad
        de custodios no corresponde al tipo (patrulla: 1 o 2; moto: 1, ADR 31).
        Otro rol responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnidadModificacion"}
      responses:
        "200":
          description: Unidad modificada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            El cambio choca con el roster (DEC-142 #4 y #5). `codigo` de
            máquina: `vehiculo_en_otra_unidad` o `custodio_en_otra_unidad` si el
            vehículo o algún custodio ya está en otra unidad activa (también al
            reactivar); `unidad_con_reserva_vigente` si la unidad tiene una
            reserva en un viaje no terminal.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/bitacora:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarBitacora
      tags: [bitacora]
      summary: Listar entradas de bitácora (ordenadas por tiempo).
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de entradas.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaBitacora"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: registrarEntradaBitacora
      tags: [bitacora]
      summary: Registrar una entrada de bitácora (append-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EntradaBitacoraEntrada"}
      responses:
        "201":
          description: Entrada registrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntradaBitacora"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/incidencias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarIncidencias
      tags: [incidencias]
      summary: Listar incidencias del viaje (ordenadas por apertura).
      description: >-
        Devuelve el histórico de incidencias del viaje, append-only: cada
        incidencia conserva su apertura y, si se resolvió, su cierre. Incluye
        tanto las `en_atencion` como las `resuelta`. `tipo_interno` es el
        catálogo operativo interno (DEC-006): la vista curada para el cliente la
        compone `bff`, no este contrato.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de incidencias.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaIncidencias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: abrirIncidencia
      tags: [incidencias]
      summary: Abrir una incidencia (abre la condición ortogonal INCIDENCIA).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IncidenciaEntrada"}
      responses:
        "201":
          description: Incidencia abierta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incidencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            Ya existe una condición `INCIDENCIA` abierta para este viaje
            (índice único parcial). `codigo` `condicion_ya_abierta`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/incidencias/{iid}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: iid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: resolverIncidencia
      tags: [incidencias]
      summary: Resolver una incidencia (cierra la condición).
      description: >-
        Al resolverse, el viaje regresa a su curso normal; el progreso nunca se
        perdió (§C.2).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolucionIncidenciaEntrada"}
      responses:
        "200":
          description: Incidencia resuelta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incidencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Estadías (E1-T6). Una estadía es una parada durante EN_TRANSITO (combustible,
  # descanso, retén…). NO es un estado del viaje ni un valor de `condicion_viaje`:
  # tiene datos propios (motivo, eje de autorización) y por eso se modela como
  # sub-recurso del viaje, no como la condición ortogonal INCIDENCIA/SIN_SENAL.
  # Registra INICIO y CIERRE; la duración se DERIVA de ambos en la lectura, no se
  # persiste ni se rotula. En V1 NO hay clasificación `prolongada` ni umbral de
  # tiempo (DEC-038): un campo así sería un umbral no aprobado implementado. El
  # "reinicio de viaje" (DEC-013) cierra la estadía activa; no es una transición
  # de `viaje.estado`.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/estadias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarEstadias
      tags: [estadias]
      summary: Listar estadías del viaje (ordenadas por inicio).
      description: >-
        Devuelve las estadías del viaje. La duración de cada una es DERIVABLE de
        `inicio` y `cierre`; el contrato no la expone como campo persistido.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de estadías.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaEstadias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: abrirEstadia
      tags: [estadias]
      summary: Abrir una estadía (parada durante el recorrido).
      description: >-
        Abre una estadía con su motivo y eje de autorización. Registra `inicio`.
        No cambia `viaje.estado` (el viaje sigue EN_TRANSITO). Varias estadías
        del viaje son válidas a lo largo del tiempo; su coexistencia con una
        condición INCIDENCIA también lo es (dimensiones distintas).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EstadiaEntrada"}
      responses:
        "201":
          description: Estadía abierta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Estadia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/estadias/{eid}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: eid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: cerrarEstadia
      tags: [estadias]
      summary: Cerrar una estadía (registra el cierre).
      description: >-
        Registra `cierre` sobre una estadía abierta. La duración queda DERIVABLE
        de `inicio` y `cierre`; no se captura a mano ni se rotula. No cambia
        `viaje.estado`. El "reinicio de viaje" (DEC-013) cierra la estadía activa
        por esta misma ruta.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CierreEstadiaEntrada"}
      responses:
        "200":
          description: Estadía cerrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Estadia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            La estadía ya está cerrada. `codigo` de máquina `estadia_ya_cerrada`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/auditoria:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: consultarAuditoria
      tags: [auditoria]
      summary: Consulta probatoria de la auditoría del viaje (administrador).
      description: >-
        Consulta/exportación probatoria. Sólo el rol `administrador` (DEC-036);
        cada acceso queda a su vez auditado.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de registros de auditoría.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaAuditoria"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  # ---------------------------------------------------------------------------
  # Adjuntos / evidencia del viaje (E6-T4 / E6-HU-027). Metadatos en el esquema
  # `bitacora` de `operacion`; los BYTES viven en el almacenamiento de objetos
  # (propuesta ADR 32: MinIO) y NUNCA pasan por el servicio: la subida y la
  # descarga usan una URL de vida corta. La clave del objeto queda alcanzada por
  # tenant/viaje (mismo patrón que `mensajeria`, MSG-REC §7). No existe catálogo
  # de tipos obligatorios en V1 (DEC-040): un viaje con cero adjuntos cierra. Todo
  # acceso a un adjunto —subida y descarga— queda auditado (E1-T7).
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/adjuntos:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarAdjuntos
      tags: [adjuntos]
      summary: Listar los adjuntos de un viaje con sus metadatos.
      description: >-
        Lista los metadatos de los adjuntos del viaje. No devuelve bytes: la
        descarga se pide por separado con autorización de vida corta. Un viaje
        fuera del alcance del llamante responde 404 antes de listar nada
        (DEC-149).
      responses:
        "200":
          description: Adjuntos del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaAdjuntos"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/adjuntos/intenciones-subida:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: crearIntencionSubidaAdjunto
      tags: [adjuntos]
      summary: Intención de subida de un adjunto con autorización de vida corta.
      description: >-
        Los bytes NO pasan por el servicio: el cliente los sube al almacenamiento
        de objetos con la URL devuelta. La clave del objeto queda alcanzada por
        tenant/viaje. Un viaje fuera del alcance del llamante responde 404 antes
        de emitir la intención (DEC-149).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntencionSubidaAdjuntoEntrada"}
      responses:
        "201":
          description: Intención creada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntencionSubidaAdjunto"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/adjuntos/{aid}/descarga:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: aid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: descargarAdjunto
      tags: [adjuntos]
      summary: Autorización de vida corta para descargar un adjunto.
      description: >-
        Devuelve una URL de descarga de vida corta del almacenamiento de objetos
        tras reverificar tenant y alcance del viaje. Los bytes NO pasan por el
        servicio. Cada descarga queda auditada (actor, adjunto, momento; E1-T7).
        Un viaje fuera del alcance del llamante responde 404 antes de autorizar
        nada (DEC-149).
      responses:
        "200":
          description: Autorización de descarga.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DescargaAdjunto"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Registro de descarga del expediente del viaje (E6-T3 / AI27-80). `bff`
  # compone el expediente leyendo de `operacion` (ficha + bitácora + auditoría)
  # y luego invoca esta operación, que deja EL rastro de auditoría de la
  # descarga (actor, viaje, momento; E1-T7) en su propia transacción, vía el
  # interceptor con el rol dueño `op_auditoria`. No se otorga GRANT a `op_viajes`
  # ni se requiere ADR: el dueño del esquema `auditoria` ya tiene INSERT por
  # diseño (ADR 33 gobierna la única excepción de GRANT cruzado, la de
  # `op_asignacion`, que aquí no se toca). Es POST porque deja un efecto
  # persistente; `bff` mantiene su GET público `descargarViaje` sin ensuciarlo
  # con una escritura oculta.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/descargas:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: registrarDescargaViaje
      tags: [auditoria]
      summary: Registrar una descarga del expediente del viaje (deja auditoría).
      description: >-
        Registra que el expediente del viaje se descargó, dejando su rastro de
        auditoría en la misma transacción (interceptor, `op_auditoria`; E1-T7).
        La invoca `bff` al servir `descargarViaje`; la composición del expediente
        la arma `bff` con las lecturas existentes. Un viaje fuera del alcance
        del llamante responde 404 antes de registrar nada (DEC-149).
      responses:
        "200":
          description: Descarga registrada; datos base del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

components:
  responses:
    SolicitudTransicionNoPermitida:
      description: >-
        La acción no es válida para el estado actual de la solicitud. `codigo`
        de máquina `transicion_no_permitida` (la arista no existe: la solicitud
        ya es terminal, `VENCIDA` no se recotiza, o hay una carrera).
      content:
        application/json:
          schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  schemas:
    # --- Enum espejo de contracts/estados/viaje.estados.yaml. CI verifica la
    #     equivalencia; la fuente canónica es el archivo de estados. ---
    EstadoViaje:
      type: string
      description: >-
        Estado de progreso del viaje. Espejo del enum canónico de
        `contracts/estados/` (ADR 19, enmendado por ADR 38). El viaje nace en
        `APROBADO`: las etapas previas son de la solicitud (`EstadoSolicitud`).
        Incluye estados V2 declarados e inalcanzables en V1 (PATRULLA_EN_CAMINO).
      enum:
      - APROBADO
      - ASIGNADO
      - APTO_PARA_SALIDA
      - EN_EMBARQUE
      - PATRULLA_EN_CAMINO
      - EN_TRANSITO
      - EN_DESTINO
      - EN_DESCARGA
      - CERRADO
      - CANCELADO_POR_CLIENTE

    CondicionViaje:
      type: string
      description: Condición ortogonal al progreso (§C.2). Nunca es un estado.
      enum: [INCIDENCIA, SIN_SENAL]

    Destino:
      type: object
      additionalProperties: false
      required: [nombre]
      properties:
        nombre:
          type: string
          description: Destino en texto libre (DEC-010 #1).
        numero_envio: {type: string}
        fecha_cita:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        arribo:
          type: boolean
          description: Si la unidad arribó a este destino (DEC-012). Captura del operador, no derivado del estado.
    CrearViajeEntrada:
      type: object
      additionalProperties: false
      required: [origen, destinos]
      properties:
        origen:
          type: string
          description: Origen en texto libre (DEC-010 #1).
        destinos:
          type: array
          minItems: 1
          description: Uno o más destinos (multi-parada, DEC-013/DEC-020).
          items: {$ref: "#/components/schemas/Destino"}
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio: {type: string}
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
          description: >-
            Tracto del cliente (unidad escoltada). Opcional: el cliente puede
            capturarlo en la solicitud y el operador completarlo luego en la
            ficha (DEC-104 #1 / DEC-010 #4).
        # asignacion es opcional: sólo Operación puede asignar en el mismo acto
        # (DEC-026). Ausente = sin asignación (equivale a null en 3.0.x).
        asignacion:
          $ref: "#/components/schemas/AsignacionEntrada"
    Viaje:
      type: object
      additionalProperties: false
      required: [id, estado, origen, destinos, creado_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado: {$ref: "#/components/schemas/EstadoViaje"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        origen: {type: string}
        destinos:
          type: array
          items: {$ref: "#/components/schemas/Destino"}
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio:
          type: string
          nullable: true
          description: >-
            Tipo de servicio/monitoreo que el cliente eligió en la solicitud
            (DEC-010 #3). SOLO LECTURA en E8-T12: el monitorista lo visualiza, no
            lo edita. `string` (no enum) porque los valores de catálogo siguen
            pendientes (DEC-104 #4); estrechar a enum después es breaking.
        # eta_estimado es nullable: ETA A->B capturado manualmente por el operador
        # (ADR 20 / DEC-007). null = sin ETA aún. `operacion` guarda y devuelve el
        # valor crudo; la obsolescencia (`stale`) la deriva el `bff` al leer.
        eta_estimado:
          type: string
          format: date-time
          nullable: true
          description: >-
            ETA estimado del viaje, capturado a mano (ADR 20). Mismo formato que
            `MarcaTiempo`. null si no se ha fijado. `operacion` no calcula ni
            expone `stale`: eso lo hace el `bff`.
        cancelacion_con_penalizacion:
          type: boolean
          description: >-
            `true` si cancelar este viaje lleva marca de penalización, o ya la
            lleva por haberse cancelado: el viaje nació de una solicitud pagada
            (DEC-148 #14). `false` si lo creó Operación (DEC-148 #27). El cliente
            lo usa para mostrar el aviso del 50% antes de cancelar (DEC-042) y su
            confirmación después. Argos solo marca; no calcula ni guarda el monto
            (DEC-148 #6). Ausente se lee como `false`.
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    ViajeDetalle:
      type: object
      additionalProperties: false
      required: [viaje, condiciones_activas]
      properties:
        viaje: {$ref: "#/components/schemas/Viaje"}
        condiciones_activas:
          type: array
          description: Condiciones ortogonales abiertas (dato separado del estado).
          items: {$ref: "#/components/schemas/CondicionAbierta"}
        incidencias_activas:
          type: array
          description: >-
            Incidencias abiertas del viaje con su `tipo_interno` (AI27-59). Es
            CONSUMO INTERNO de `bff`: la vista curada para el cliente la compone
            `bff` mapeando el tipo a una categoría (DEC-006), nunca este
            contrato. Opcional y aditivo: `condiciones_activas` se conserva sin
            cambios. Cada entrada corresponde a una condición `INCIDENCIA`
            abierta; `CondicionAbierta` no lleva el tipo porque es el dato crudo
            de la máquina de condiciones, sin el catálogo operativo.
          items: {$ref: "#/components/schemas/IncidenciaActiva"}

    CondicionAbierta:
      type: object
      additionalProperties: false
      required: [tipo, abierta_en]
      properties:
        tipo: {$ref: "#/components/schemas/CondicionViaje"}
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    IncidenciaActiva:
      type: object
      additionalProperties: false
      required: [id, tipo_interno, estado, abierta_en]
      description: >-
        Incidencia abierta embebida en la lectura del viaje (AI27-59). Vista
        reducida de `Incidencia` para consumo de `bff`: sin `viaje_id` (implícito
        en el viaje leído) ni `resuelta_en` (si está en la lista, está abierta).
        `tipo_interno` es interno; el curado para el cliente lo hace `bff`
        (DEC-006).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo_interno: {type: string}
        estado:
          type: string
          enum: [en_atencion, resuelta]
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}


    EtaEntrada:
      type: object
      additionalProperties: false
      required: [eta_estimado]
      properties:
        eta_estimado:
          allOf: [$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"]
          description: >-
            ETA estimado a fijar (captura manual, ADR 20). Reemplaza el valor
            previo; `operacion` no lo recalcula ni lo marca obsoleto.

    FechaHoraEntrada:
      type: object
      additionalProperties: false
      required: [fecha_hora_servicio]
      properties:
        fecha_hora_servicio:
          allOf: [$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"]
          description: >-
            Fecha/hora del servicio a completar o editar sobre un viaje ya
            creado (E1-HU-003, DEC-010 #2). Reemplaza el valor previo.

    PaginaViajes:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Viaje"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    MotivoCierre:
      type: string
      description: >-
        Motivo del cierre del viaje (DEC-113). Catálogo cerrado de V1: `normal`
        (cierre tras la última parada) o `por_incidencia` (habilita el cierre
        anticipado, DEC-020 #6). Se retiró `bitacora` (era una cita a DEC-013 sin
        respaldo, DEC-113). La ventana de escritura de la conversación la decide
        `mensajeria` por el motivo (3 días / 6 meses, DEC-030/DEC-041).
      enum: [normal, por_incidencia]

    TransicionEntrada:
      type: object
      additionalProperties: false
      required: [a_estado]
      properties:
        a_estado:
          allOf: [$ref: "#/components/schemas/EstadoViaje"]
          description: Estado destino. Se valida contra la máquina de estados.
        causa:
          type: string
          description: >-
            Causa de la transición. Obligatoria cuando el destino la requiere
            (p. ej. el motivo de la cancelación del cliente, DEC-111). El motivo
            del rechazo de AI27 (DEC-020 #2) ya no es del viaje: lo lleva
            `rechazarSolicitud`. La validación fina vive en el servicio.
        motivo_cierre:
          allOf: [$ref: "#/components/schemas/MotivoCierre"]
          description: >-
            Obligatorio al transicionar a `CERRADO` (E8-T14, DEC-113); ignorado
            en cualquier otra arista. Sustituye el puente previo que leía el
            motivo de `causa`.

    AsignacionEntrada:
      type: object
      additionalProperties: false
      required: [unidades_ids]
      description: >-
        Escolta a reservar: una o más `unidades` del roster (D2). Reemplaza el
        par `unidad_id` + `custodios_ids`: la reserva es por unidad completa
        (paquete vehículo + custodios), no por recursos sueltos (ADR 31).
      properties:
        unidades_ids:
          type: array
          minItems: 1
          description: Identificadores de las unidades del roster que forman la escolta.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    ReasignacionEntrada:
      type: object
      additionalProperties: false
      required: [unidades_ids, motivo]
      description: >-
        La reasignación manda la escolta completa (D2). Ambos campos son
        obligatorios. No recibe custodios: cambiar un custodio es edición de
        roster, no reasignación.
      properties:
        unidades_ids:
          type: array
          minItems: 1
          description: "Escolta resultante: una o más unidades del roster."
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        motivo:
          type: string
          description: Motivo de la reasignación (auditado).

    # --- Aptitud informativa por átomo en la RESPUESTA de la asignación (D1 /
    #     DEC-055). NO hay aptitud agregada por unidad: sería regla nueva. El
    #     estado `desconocido` lo calcula `operacion` cuando `catalogos` no
    #     responde o el dato está obsoleto; `catalogos` nunca lo devuelve. ---
    AptitudRecurso:
      type: object
      additionalProperties: false
      required: [recurso, recurso_id, estado]
      properties:
        recurso:
          type: string
          enum: [vehiculo, custodio]
          description: Átomo evaluado dentro de la unidad.
        recurso_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          enum: [apto, no_apto, desconocido]
          description: >-
            Afirmación informativa (DEC-055). `desconocido` lo calcula
            `operacion`, no `catalogos`. Nunca bloquea la asignación en V1.
        motivos:
          type: array
          description: Motivos, cuando el estado es `no_apto`.
          items: {type: string}

    UnidadAsignada:
      type: object
      additionalProperties: false
      required: [unidad_id, aptitud]
      properties:
        unidad_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        aptitud:
          type: array
          description: Aptitud informativa por átomo (vehículo y custodios de la unidad).
          items: {$ref: "#/components/schemas/AptitudRecurso"}

    Asignacion:
      type: object
      additionalProperties: false
      required: [viaje_id, estado, unidades]
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          allOf: [{$ref: "#/components/schemas/EstadoViaje"}]
          description: >-
            Estado del viaje tras la reserva. En V1 la asignación exitosa deja
            `ASIGNADO` (APROBADO → ASIGNADO, DEC-026). Se afirma en el dato para
            que el consumidor no lo infiera del éxito de la operación.
        unidades:
          type: array
          description: >-
            Unidades de la escolta reservada, cada una con su aptitud informativa
            por átomo (D1). La reserva ya ocurrió: la aptitud es sólo dato.
          items: {$ref: "#/components/schemas/UnidadAsignada"}

    EscoltaVigente:
      type: object
      additionalProperties: false
      required: [viaje_id, unidades]
      description: Escolta de la asignación vigente del viaje (`obtenerAsignacion`).
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        unidades:
          type: array
          description: Unidades reservadas, ordenadas por `id`. Vacío sin asignación vigente.
          items: {$ref: "#/components/schemas/Unidad"}

    # --- Roster de unidades (D6a / ADR 31 §5 / ADR 33). La `unidad` es un
    #     paquete pre-armado: un vehículo (átomo de `catalogos`) con uno o dos
    #     custodios (átomos de `catalogos`), referidos POR IDENTIFICADOR, nunca
    #     por FK cruzada de esquema. El roster lo administra el `jefe_operativo`.
    #
    #     EXCLUSIVIDAD (DEC-142 #4): un vehículo y un custodio pertenecen a una
    #     sola `unidad` ACTIVA a la vez. Si están en una unidad desactivada,
    #     pueden usarse en otra. `crearUnidad` y `modificarUnidad` (también al
    #     reactivar) responden 409 `vehiculo_en_otra_unidad` o
    #     `custodio_en_otra_unidad`. Una unidad con reserva en un viaje no
    #     terminal no se edita ni se desactiva: 409 `unidad_con_reserva_vigente`
    #     (DEC-142 #5).
    #
    #     El `tipo` (patrulla|moto) es SOLO LECTURA: se deriva del vehículo
    #     (coche -> patrulla, moto -> moto, ADR 31). No es columna de entrada. ---
    Unidad:
      type: object
      additionalProperties: false
      required: [id, vehiculo_id, custodios_ids, tipo, activa]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        vehiculo_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Identificador del vehículo en `catalogos`. Referencia, no FK.
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          description: >-
            Custodios de la unidad, por identificador de `catalogos`. Un coche
            lleva uno o dos; una moto, uno (ADR 31).
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo:
          type: string
          enum: [patrulla, moto]
          readOnly: true
          description: >-
            Tipo de unidad, SOLO LECTURA, derivado del vehículo en el servidor
            (coche -> patrulla, moto -> moto, ADR 31). Nunca se envía en una
            petición.
        activa:
          type: boolean
          description: Si la unidad está activa (disponible para asignarse).
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Cliente al que sirve la unidad (DEC-149 #2), id de `catalogos`.
            Referencia, no FK. Dato del roster para asignar la escolta y
            reconocer el préstamo; no define el alcance del monitoreo (DEC-149
            #18). null o ausente = sin cliente (DEC-149 #13).

    UnidadEntrada:
      type: object
      additionalProperties: false
      required: [vehiculo_id, custodios_ids]
      description: >-
        Alta de unidad. El `tipo` NO se envía: se deriva del vehículo. `activa`
        es opcional al crear (el servidor decide el valor por defecto).
      properties:
        vehiculo_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        activa:
          type: boolean
          description: Opcional al crear. Si se omite, el servidor fija el valor por defecto.
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Opcional; mismo formato que `Id`. Cliente al que sirve la unidad
            (DEC-149 #2), dato del roster que no define el alcance (DEC-149
            #18). null o ausente = sin cliente (DEC-149 #13).

    UnidadModificacion:
      type: object
      additionalProperties: false
      description: >-
        Modificación de unidad. Todos los campos son opcionales; activar o
        desactivar es cambiar `activa`. El `tipo` nunca se envía (derivado).
        Propiedad ausente = no se toca.
      properties:
        vehiculo_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        activa:
          type: boolean
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Id de `catalogos` para fijar o cambiar el cliente al que sirve la
            unidad; `null` para quitarlo (DEC-149 #2 y #13). Dato del roster:
            no cambia el alcance del monitoreo (DEC-149 #18).

    PaginaUnidades:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Unidad"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Ficha técnica del viaje (E8-T12 / DEC-104). Tracto, contenedores y
    #     referencia de GPS. Todo opcional (edición incremental, DEC-043 #3). ---
    Tracto:
      type: object
      additionalProperties: false
      description: >-
        Tracto del cliente (unidad escoltada). Texto libre: no es recurso de AI27
        ni viene de catálogo. `placas`/`economico` separados para permitir
        búsqueda (DEC-104 #1, supera el "texto libre" de DEC-011 #2). Todos los
        campos opcionales. Mismo shape en lectura y en entrada.
      properties:
        placas:    {type: string}
        economico: {type: string}
        marca:     {type: string}
        modelo:    {type: string}
        color:     {type: string}

    Contenedor:
      type: object
      additionalProperties: false
      description: >-
        Contenedor del viaje (0..N, DEC-012). Campos del sistema actual (DEC-104
        #2), todos texto libre y opcionales. Un contenedor sin ningún dato se
        descarta al guardar.
      properties:
        economico: {type: string}
        placas:    {type: string}
        sello:     {type: string}
        color:     {type: string}

    FichaTecnica:
      type: object
      additionalProperties: false
      required: [viaje_id]
      description: >-
        Ficha técnica del viaje (lectura). La escolta NO va aquí (se deriva de la
        asignación, DEC-044); `tipo_servicio`, `origen` y `destinos` son del
        viaje (`obtenerViaje`), no de la ficha.
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
          description: Tracto del cliente, o null si no se ha capturado.
        contenedores:
          type: array
          description: Contenedores del viaje (0..N).
          items: {$ref: "#/components/schemas/Contenedor"}
        gps_ids:
          type: array
          description: >-
            Referencias a dispositivos del catálogo de GPS (DEC-012/047). Solo
            referencia, sin posición en vivo.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    FichaTecnicaEntrada:
      type: object
      additionalProperties: false
      description: >-
        Guardado parcial de la ficha (PATCH). NINGÚN campo obligatorio (DEC-043
        #3). Propiedad ausente = no se toca; colección presente = reemplaza la
        lista completa; `[]` borra la lista; contenedor vacío se descarta.
      properties:
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
          description: Objeto para fijarlo; `null` para borrarlo.
        contenedores:
          type: array
          items: {$ref: "#/components/schemas/Contenedor"}
        gps_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    EntradaBitacoraEntrada:
      type: object
      additionalProperties: false
      required: [texto]
      properties:
        texto: {type: string}

    EntradaBitacora:
      type: object
      additionalProperties: false
      required: [id, viaje_id, texto, autor, ts]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        texto: {type: string}
        autor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaBitacora:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EntradaBitacora"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    IncidenciaEntrada:
      type: object
      additionalProperties: false
      required: [tipo_interno]
      properties:
        tipo_interno:
          type: string
          description: >-
            Tipo interno de incidencia (catálogo operativo). La vista curada
            para el cliente la compone `bff` (DEC-006), no este contrato.
        descripcion: {type: string}

    Incidencia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, tipo_interno, estado, abierta_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo_interno: {type: string}
        estado:
          type: string
          enum: [en_atencion, resuelta]
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        resuelta_en:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
    PaginaIncidencias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Incidencia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    ResolucionIncidenciaEntrada:
      type: object
      additionalProperties: false
      required: [resolucion]
      properties:
        resolucion: {type: string}

    # --- Estadías (E1-T6 / DEC-038). Inicio + cierre; la duración se DERIVA, no
    #     se persiste. Sin clasificación `prolongada` ni umbral en V1. ---
    MotivoEstadia:
      type: string
      description: >-
        Motivo de la estadía (parada). Lista cerrada de V1; se amplía por ola
        aditiva si el negocio lo decide.
      enum:
        - combustible
        - descanso
        - alimentos
        - sanitario
        - reten
        - revision_autoridades
        - gastos
        - espera_entrega

    EjeAutorizacionEstadia:
      type: string
      description: Eje de autorización de la estadía (E1-HU-008).
      enum:
        - autorizada
        - no_autorizada
        - antes_200km

    Estadia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, motivo, eje_autorizacion, inicio]
      description: >-
        Estadía del viaje. La DURACIÓN NO es un campo: se deriva de `inicio` y
        `cierre` en la lectura (DEC-038). No existe `prolongada` ni umbral en V1.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        motivo: {$ref: "#/components/schemas/MotivoEstadia"}
        eje_autorizacion: {$ref: "#/components/schemas/EjeAutorizacionEstadia"}
        inicio: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        cierre:
          type: string
          format: date-time
          nullable: true
          description: >-
            Cierre de la estadía, o null si sigue abierta. Mismo formato que
            `MarcaTiempo`. La duración se deriva de `inicio` y este valor.

    EstadiaEntrada:
      type: object
      additionalProperties: false
      required: [motivo, eje_autorizacion]
      description: >-
        Cuerpo de apertura de una estadía (POST). El servicio asigna id y fija
        `inicio` al momento del registro.
      properties:
        motivo: {$ref: "#/components/schemas/MotivoEstadia"}
        eje_autorizacion: {$ref: "#/components/schemas/EjeAutorizacionEstadia"}

    CierreEstadiaEntrada:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de cierre de una estadía (PATCH). Sin campos obligatorios: el
        servidor fija `cierre` al momento del registro. Cuerpo vacío válido.
      properties: {}

    PaginaEstadias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Estadia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    RegistroAuditoria:
      type: object
      additionalProperties: false
      required: [entidad, entidad_id, actor, ts]
      properties:
        entidad: {type: string}
        entidad_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        de: {type: string}
        a: {type: string}
        actor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaAuditoria:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RegistroAuditoria"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Adjuntos / evidencia (E6-T4). Metadatos del adjunto; los bytes viven
    #     en el almacenamiento de objetos, alcanzados por tenant/viaje. ---
    Adjunto:
      type: object
      additionalProperties: false
      required: [id, viaje_id, nombre, tipo_medio, tamano_bytes, estado_escaneo, creado_en]
      description: Metadatos de un adjunto del viaje. No incluye los bytes.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        nombre:
          type: string
          minLength: 1
          description: >-
            Nombre de archivo declarado en la subida, para identificar el
            adjunto en la lista de evidencia (E6-HU-027). No es el actor que lo
            subió: el autor queda fuera de V1 (DT-11).
        tipo_medio:
          type: string
          description: Tipo MIME declarado del adjunto.
        tamano_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{64}$"
          description: Checksum declarado en la subida; null si no se declaró.
        estado_escaneo:
          type: string
          enum: [pendiente, limpio, infectado]
          description: >-
            Estado del escaneo antivirus del objeto. `pendiente` tras crear la
            intención; `limpio`/`infectado` cuando el escaneo concluye. Un
            adjunto no `limpio` no autoriza descarga.
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaAdjuntos:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Adjunto"}

    IntencionSubidaAdjuntoEntrada:
      type: object
      additionalProperties: false
      required: [nombre, tipo_medio, tamano_bytes, checksum_sha256]
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre de archivo declarado, mostrado luego en la lista (E6-HU-027).
        tipo_medio:
          type: string
          description: Tipo MIME declarado.
        tamano_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"

    IntencionSubidaAdjunto:
      type: object
      additionalProperties: false
      required: [adjunto_id, url_subida, expira_en]
      properties:
        adjunto_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        url_subida:
          type: string
          format: uri
          description: URL de vida corta del almacenamiento de objetos.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    DescargaAdjunto:
      type: object
      additionalProperties: false
      required: [url_descarga, expira_en]
      properties:
        url_descarga:
          type: string
          format: uri
          description: URL de vida corta del almacenamiento de objetos.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    # =========================================================================
    # SOLICITUDES (V2, ADR 38, DEC-148)
    # =========================================================================
    EstadoSolicitud:
      type: string
      description: >-
        Estado de la solicitud. Espejo del enum canónico de
        `contracts/estados/solicitud.estados.yaml` (ADR 38). CI verifica la
        equivalencia; la fuente canónica es el archivo de estados.
      enum:
      - SOLICITADO
      - COTIZADO
      - PAGADO
      - APROBADO
      - RECHAZADO_POR_AI27
      - RECHAZADO_POR_CLIENTE
      - CANCELADO_POR_CLIENTE
      - VENCIDA
      # Nombres propios de las constantes Go. Sin ellos, el generador ve valores
      # compartidos con `EstadoViaje` (APROBADO, ...) y prefija TODAS las
      # constantes de ambos enums, lo que renombraría las del viaje en cada
      # consumidor sin que cambie nada en el cable (git-workflow §8).
      x-enum-varnames:
      - SolicitudSolicitado
      - SolicitudCotizado
      - SolicitudPagado
      - SolicitudAprobado
      - SolicitudRechazadoPorAi27
      - SolicitudRechazadoPorCliente
      - SolicitudCanceladoPorCliente
      - SolicitudVencida

    Monto:
      type: string
      pattern: "^[0-9]+(\\.[0-9]+)?$"
      description: >-
        Importe como decimal en texto, sin signo ni separador de miles (evita
        errores de punto flotante). Los límites (cero, decimales máximos) siguen
        pendientes de decisión (DEC-148).

    CrearSolicitudEntrada:
      type: object
      additionalProperties: false
      required: [origen, destinos]
      description: >-
        Solicitud mínima del cliente (E1-HU-001). La organización la fija el
        token, no el cuerpo.
      properties:
        origen:
          type: string
          description: Origen en texto libre (DEC-010 #1).
        destinos:
          type: array
          minItems: 1
          description: Uno o más destinos (multi-parada, DEC-013).
          items: {$ref: "#/components/schemas/Destino"}
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: >-
            Fecha y hora deseada del servicio. Opcional para el cliente
            (DEC-148 #38); si falta, `cotizacion` la fija al cotizar.
        tipo_servicio: {type: string}
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
          description: Tracto del cliente. Opcional (DEC-104 #1).

    CotizacionEntrada:
      type: object
      additionalProperties: false
      required: [monto, moneda, fecha_hora_servicio]
      properties:
        monto: {$ref: "#/components/schemas/Monto"}
        moneda:
          type: string
          minLength: 1
          description: >-
            Código de moneda. `string` y no enum porque el catálogo de monedas
            sigue pendiente (DEC-148); estrechar a enum después es incompatible.
        fecha_hora_servicio:
          type: string
          format: date-time
          description: >-
            Fecha y hora del servicio que ofrece la cotización. Obligatoria
            (DEC-148 #39); puede diferir de la que pidió el cliente.
        notas:
          type: string
          nullable: true
          description: Texto libre. Sin desglose estructurado en V2 (DEC-148 #41).

    Cotizacion:
      type: object
      additionalProperties: false
      required: [version, monto, moneda, fecha_hora_servicio, entregada_en, vigente_hasta]
      properties:
        version:
          type: integer
          minimum: 1
          description: Número de versión; la recotización incrementa.
        monto: {$ref: "#/components/schemas/Monto"}
        moneda: {type: string}
        fecha_hora_servicio: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        notas:
          type: string
          nullable: true
        entregada_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        vigente_hasta:
          type: string
          format: date
          description: >-
            Último día de vigencia: 15 días calendario desde la entrega, en
            `America/Mexico_City` (DEC-148 #15, #50). La solicitud pasa a
            `VENCIDA` un día después.

    ReprogramacionEntrada:
      type: object
      additionalProperties: false
      required: [fecha_hora_servicio, motivo]
      properties:
        fecha_hora_servicio:
          type: string
          format: date-time
        motivo:
          type: string
          minLength: 1
          description: Obligatorio (DEC-148 #24).

    PagoEntrada:
      type: object
      additionalProperties: false
      required: [fecha_pago]
      properties:
        fecha_pago:
          type: string
          format: date
          description: >-
            Cuándo pagó el cliente (día calendario en `America/Mexico_City`).
            Debe caer dentro de la vigencia de la última cotización: desde su
            entrega hasta su último día, ambos incluidos (DEC-148 #34, #43).
            Una fecha anterior a la entrega o posterior al último día se rechaza.
        referencia:
          type: string
          nullable: true
          description: Folio o nota en texto. Opcional; sin archivo adjunto (DEC-148 #43).

    Pago:
      type: object
      additionalProperties: false
      required: [fecha_pago, confirmado_en]
      properties:
        fecha_pago: {type: string, format: date}
        referencia: {type: string, nullable: true}
        confirmado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    MotivoEntrada:
      type: object
      additionalProperties: false
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 1
          description: Obligatorio en esta acción.

    AccionClienteEntrada:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo opcional de las acciones del cliente. El `motivo` es opcional:
        DEC-148 no lo exige para la solicitud (a diferencia de DEC-111 para el
        viaje); queda pendiente de confirmación.
      properties:
        motivo: {type: string, nullable: true}

    Solicitud:
      type: object
      additionalProperties: false
      required: [id, estado, origen, destinos, marca_penalizacion, avisos, creado_en]
      properties:
        id:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/Id"}]
          description: >-
            Id de la solicitud. Es también el id del viaje que nace al aprobarse
            (DEC-148 #3).
        estado: {$ref: "#/components/schemas/EstadoSolicitud"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        origen: {type: string}
        destinos:
          type: array
          items: {$ref: "#/components/schemas/Destino"}
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: >-
            Fecha y hora vigente del servicio: la del cliente, la de la última
            cotización o la de la última reprogramación.
        tipo_servicio:
          type: string
          nullable: true
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
        cotizacion:
          allOf: [{$ref: "#/components/schemas/Cotizacion"}]
          nullable: true
          description: Cotización vigente; null mientras no se ha cotizado.
        pago:
          allOf: [{$ref: "#/components/schemas/Pago"}]
          nullable: true
          description: Pago confirmado; null mientras no lo hay.
        marca_penalizacion:
          type: boolean
          description: >-
            `true` si el cliente canceló estando en `PAGADO` (DEC-148 #6). Argos
            solo marca; no calcula ni guarda el monto.
        motivo_rechazo:
          type: string
          nullable: true
          description: >-
            Motivo del rechazo de AI27. Lo ve el cliente (DEC-148 #55). null en
            cualquier otro estado.
        avisos:
          type: array
          description: >-
            Marcas de aviso dentro de Argos que le tocan al llamante (DEC-148 #53
            a #57). Se derivan del estado y la hora; no se almacenan. Valores:
            `nueva` (para `cotizacion`: está en `SOLICITADO`),
            `cotizacion_nueva` (para el cliente: se entregó o recotizó),
            `por_vencer` (para ambos: faltan 3 días o menos para el último día
            de vigencia), `cancelacion_con_penalizacion` (para `cotizacion`) y
            `rechazo_de_ai27` (para el cliente). `string` y no enum para poder
            ampliar la lista sin ruptura. Cuándo se apaga cada aviso sigue
            pendiente (salvo el de mensaje sin respuesta, que produce
            `mensajeria`).
          items: {type: string}
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaSolicitudes:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Solicitud"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    HistoricoSolicitudItem:
      type: object
      additionalProperties: false
      required: [accion, en]
      properties:
        accion:
          type: string
          description: >-
            Qué ocurrió: `creada`, `cotizada`, `recotizada`, `reprogramada`,
            `pago_confirmado`, `pago_confirmado_tardio` (excepción
            `VENCIDA → PAGADO`), `pago_revertido`, `cotizacion_rechazada`,
            `cancelada`, `vencida`, `aprobada`, `rechazada`. `string` y no enum
            para poder ampliar sin ruptura.
        de_estado:
          allOf: [{$ref: "#/components/schemas/EstadoSolicitud"}]
          nullable: true
          description: Estado de origen; null en `creada` y en las acciones sin cambio de estado.
        a_estado:
          allOf: [{$ref: "#/components/schemas/EstadoSolicitud"}]
          nullable: true
          description: Estado de destino; null en las acciones sin cambio de estado (recotizar, reprogramar).
        actor_id:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/Id"}]
          nullable: true
          description: null cuando lo hizo el sistema (el vencimiento).
        motivo: {type: string, nullable: true}
        cotizacion:
          allOf: [{$ref: "#/components/schemas/Cotizacion"}]
          nullable: true
          description: Versión completa, solo en `cotizada` y `recotizada` (DEC-148 #42).
        marca_penalizacion:
          type: boolean
          nullable: true
          description: Solo en `cancelada`.
        en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    HistoricoSolicitud:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: En orden cronológico.
          items: {$ref: "#/components/schemas/HistoricoSolicitudItem"}
