# =============================================================================
# contracts/openapi/operacion.yaml
# -----------------------------------------------------------------------------
# Superficie HTTP interna de `operacion` para el tracer. Dueño del progreso del
# viaje, su máquina de estados, su asignación, su bitácora y su auditoría, en
# una sola frontera transaccional.
#
# INVARIANTE CLAVE: no existe escritura directa de `estado`. La única forma de
# mover un viaje es una transición validada contra `contracts/estados/`
# (operacion.md (f)). El comando de asignación es una escritura atómica.
#
# El enum `EstadoViaje` de este spec DEBE coincidir con
# contracts/estados/viaje.estados.yaml. CI verifica la equivalencia
# (make check-estados-openapi); la fuente canónica es el archivo de estados.
# =============================================================================
openapi: 3.0.3
info:
  title: AI27 — operacion
  version: 0.1.0-tracer.28
  description: >-
    Progreso del viaje: creación, transiciones, asignación, bitácora,
    incidencias y auditoría. Consumido por `bff`, nunca por el frontend directo.
  x-ai27-servicio: operacion
  x-ai27-capa: dominio
  x-ai27-tracer: true

servers:
- url: /
  description: Ruta base montada por el despliegue.

security:
- bearerCognito: []

tags:
- name: viajes
- name: asignacion
- name: roster
  description: Roster de unidades (paquetes vehículo + custodios) administrado por el jefe_operativo (ADR 31/33).
- name: bitacora
- name: incidencias
- name: estadias
  description: >-
    Estadías del viaje (paradas durante EN_TRANSITO). Condición con datos
    propios, NO un valor de condicion_viaje ni un estado (DEC-013/DEC-038).
- name: auditoria
- name: adjuntos
  description: >-
    Adjuntos/evidencia del viaje (E6-T4). Metadatos en `bitacora`; bytes en el
    almacenamiento de objetos (ADR 32), nunca por el servicio. Acceso auditado.

paths:
  /api/v1/viajes:
    post:
      operationId: crearViaje
      tags: [viajes]
      summary: Crear un viaje.
      description: >-
        El cliente crea en `SOLICITADO`. Operación crea en `APROBADO` en el mismo
        acto y puede asignar atómicamente `unidad`+`custodios` para dejarlo
        `ASIGNADO` (DEC-026). El estado inicial lo determina el rol del token,
        no un campo de la petición.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrearViajeEntrada"}
      responses:
        "201":
          description: Viaje creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}
    get:
      operationId: listarViajes
      tags: [viajes]
      summary: Listar viajes por alcance.
      description: >-
        Para audiencia interna, alcance de flota; para cliente, alcance de
        tenant (P9, P10). El alcance se deriva del token.
      parameters:
      - name: estado
        in: query
        required: false
        description: Filtro por estado de progreso.
        schema: {$ref: "#/components/schemas/EstadoViaje"}
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de viajes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaViajes"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/viajes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerViaje
      tags: [viajes]
      summary: Detalle del viaje.
      description: >-
        Estado de progreso MÁS condiciones activas como dato separado (§C.2):
        un viaje puede estar `EN_TRANSITO` y con `INCIDENCIA` abierta a la vez.
      responses:
        "200":
          description: Viaje con condiciones activas.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeDetalle"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Ficha técnica del viaje (E8-T12 / DEC-104). El monitorista la captura y edita
  # incrementalmente. Es EDITABLE y admite datos faltantes (DEC-043 #3): el PATCH
  # no exige ningún campo; en V1 NINGÚN campo de ficha es guarda de transición de
  # estado (DEC-104 #3). La escolta NO vive aquí: se deriva de la asignación
  # (DEC-044). `tipo_servicio`, `origen` y `destinos` son del viaje, no de la
  # ficha: se leen de `obtenerViaje`. La ficha serializa lo que la solicitud y la
  # asignación no cubren: tracto del cliente, contenedores y la referencia de GPS.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/ficha:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerFicha
      tags: [bitacora]
      summary: Leer la ficha técnica del viaje.
      responses:
        "200":
          description: Ficha técnica del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FichaTecnica"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: guardarFicha
      tags: [bitacora]
      summary: Guardar parcialmente la ficha técnica (edición incremental).
      description: >-
        Edición incremental (DEC-043 #3): ningún campo es obligatorio. Las
        propiedades presentes forman el nuevo valor; las ausentes no se tocan.
        Las colecciones (`contenedores`, `gps_ids`) se REEMPLAZAN por completo
        con el arreglo recibido; un arreglo vacío borra la lista. Un contenedor
        sin ningún dato se descarta. No cambia `estado`: la ficha no gatea
        transiciones en V1 (DEC-104 #3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FichaTecnicaEntrada"}
      responses:
        "200":
          description: Ficha actualizada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FichaTecnica"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/transiciones:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: transicionarViaje
      tags: [viajes]
      summary: Transición de estado validada, con causa.
      description: >-
        Único mecanismo para mover un viaje. Se valida contra
        `contracts/estados/`; una transición no permitida devuelve 409. No
        existe escritura directa de `estado`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransicionEntrada"}
      responses:
        "200":
          description: Transición aplicada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Transición no permitida. `codigo` de máquina en el cuerpo:
            `transicion_no_permitida` (la arista no existe, p. ej. el viaje ya es
            terminal o hay carrera); `cierre_anticipado_solo_por_incidencia` (se
            pidió cerrar desde `EN_TRANSITO` con un motivo distinto de
            `por_incidencia`); `cierre_anticipado_requiere_incidencia` (cierre
            anticipado sin una condición `INCIDENCIA` abierta). DEC-020 #6 / DEC-113.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/asignacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: asignarRecursos
      tags: [asignacion]
      summary: Asignar la escolta (una o más unidades) en una escritura atómica.
      description: >-
        Reserva la `escolta` —una o más `unidades` (paquetes vehículo + custodios)
        del roster— con disponibilidad verificada en una sola transacción (ADR 31).
        La reserva es por `unidad` completa, no por vehículo y custodio por
        separado. Si alguna unidad no está disponible en la ventana, no se reserva
        parcialmente nada (409). La aptitud es informativa y NO condiciona la
        asignación en V1 (DEC-055).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AsignacionEntrada"}
      responses:
        "200":
          description: Asignación confirmada; el viaje queda `ASIGNADO`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asignacion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Alguna unidad no está disponible en la ventana del viaje; sin reserva
            parcial. Único código de rechazo: `recurso_no_disponible` (la reserva
            falló, el "no hay gente" de DEC-043). La aptitud nunca rechaza en V1
            (DEC-055): no existe `recurso_no_apto`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}
    patch:
      operationId: reasignarRecursos
      tags: [asignacion]
      summary: Reasignar la escolta completa, con motivo (auditado).
      description: >-
        La reasignación manda la escolta completa en `unidades_ids` (una o más
        unidades del roster). Cambiar un custodio es edición de roster, NO
        reasignación (D2): por eso no se reciben custodios aquí.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasignacionEntrada"}
      responses:
        "200":
          description: Reasignación confirmada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asignacion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/viajes/{id}/eta:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: fijarEta
      tags: [viajes]
      summary: Fijar el ETA estimado del viaje (captura manual del operador).
      description: >-
        En V1 el ETA es un dato capturado a mano, no un cálculo (ADR 20 /
        DEC-007). NO valida contra el grafo de transiciones —no es un cambio de
        estado—; sólo exige que el viaje no esté en un estado terminal.
        `operacion` guarda y devuelve el valor crudo; la obsolescencia (`stale`)
        la calcula el `bff` al leer, no este servicio (ADR 20).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EtaEntrada"}
      responses:
        "200":
          description: ETA actualizado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            El viaje está en un estado terminal y no admite fijar ETA. `codigo`
            de máquina `viaje_en_estado_terminal`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/fecha-hora:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: completarFechaHora
      tags: [viajes]
      summary: Completar o editar la fecha/hora del servicio del viaje.
      description: >-
        Escribe `fecha_hora_servicio` sobre un viaje ya creado. La aprobación
        exige este dato (guarda `fecha_hora_servicio_definida` de
        `SOLICITADO → APROBADO`, DEC-010 #2); si el cliente no lo puso al crear,
        el operador lo completa antes de aprobar (E1-HU-003). NO valida contra el
        grafo de transiciones —no es un cambio de estado—; sólo exige que el
        viaje no esté en un estado terminal, igual que `fijarEta`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FechaHoraEntrada"}
      responses:
        "200":
          description: Fecha/hora del servicio actualizada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            El viaje está en un estado terminal y no admite editar la fecha/hora
            del servicio. `codigo` de máquina `viaje_en_estado_terminal`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/unidades:
    get:
      operationId: listarUnidades
      tags: [roster]
      summary: Listar unidades del roster (administración del jefe_operativo).
      description: >-
        El roster de `unidades` vive en `operacion` (ADR 31 §5 / ADR 33), no en
        `catalogos`. Una `unidad` es un paquete pre-armado: un vehículo (de
        `catalogos`) con uno o dos custodios (de `catalogos`), referidos por
        identificador. En V1 la lectura del roster NO expone aptitud (queda para
        después).
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de unidades del roster.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaUnidades"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    post:
      operationId: crearUnidad
      tags: [roster]
      summary: Crear una unidad del roster (jefe_operativo).
      description: >-
        Arma una `unidad` emparejando un vehículo con uno o dos custodios
        (coche: uno o dos; moto: uno — ADR 31). El `tipo` NO se envía: se deriva
        del vehículo en el servidor.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnidadEntrada"}
      responses:
        "201":
          description: Unidad creada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/unidades/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerUnidad
      tags: [roster]
      summary: Detalle de una unidad del roster.
      responses:
        "200":
          description: Unidad.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: modificarUnidad
      tags: [roster]
      summary: Modificar una unidad del roster, incluido activar/desactivar.
      description: >-
        Cambia el vehículo, los custodios o el estado `activa` de la unidad.
        Activar/desactivar es un cambio de `activa` por esta misma ruta. El
        `tipo` nunca se escribe: se deriva del vehículo.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnidadModificacion"}
      responses:
        "200":
          description: Unidad modificada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/bitacora:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarBitacora
      tags: [bitacora]
      summary: Listar entradas de bitácora (ordenadas por tiempo).
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de entradas.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaBitacora"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: registrarEntradaBitacora
      tags: [bitacora]
      summary: Registrar una entrada de bitácora (append-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EntradaBitacoraEntrada"}
      responses:
        "201":
          description: Entrada registrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntradaBitacora"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/viajes/{id}/incidencias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarIncidencias
      tags: [incidencias]
      summary: Listar incidencias del viaje (ordenadas por apertura).
      description: >-
        Devuelve el histórico de incidencias del viaje, append-only: cada
        incidencia conserva su apertura y, si se resolvió, su cierre. Incluye
        tanto las `en_atencion` como las `resuelta`. `tipo_interno` es el
        catálogo operativo interno (DEC-006): la vista curada para el cliente la
        compone `bff`, no este contrato.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de incidencias.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaIncidencias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: abrirIncidencia
      tags: [incidencias]
      summary: Abrir una incidencia (abre la condición ortogonal INCIDENCIA).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IncidenciaEntrada"}
      responses:
        "201":
          description: Incidencia abierta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incidencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Ya existe una condición `INCIDENCIA` abierta para este viaje
            (índice único parcial). `codigo` `condicion_ya_abierta`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/incidencias/{iid}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: iid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: resolverIncidencia
      tags: [incidencias]
      summary: Resolver una incidencia (cierra la condición).
      description: >-
        Al resolverse, el viaje regresa a su curso normal; el progreso nunca se
        perdió (§C.2).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolucionIncidenciaEntrada"}
      responses:
        "200":
          description: Incidencia resuelta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incidencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Estadías (E1-T6). Una estadía es una parada durante EN_TRANSITO (combustible,
  # descanso, retén…). NO es un estado del viaje ni un valor de `condicion_viaje`:
  # tiene datos propios (motivo, eje de autorización) y por eso se modela como
  # sub-recurso del viaje, no como la condición ortogonal INCIDENCIA/SIN_SENAL.
  # Registra INICIO y CIERRE; la duración se DERIVA de ambos en la lectura, no se
  # persiste ni se rotula. En V1 NO hay clasificación `prolongada` ni umbral de
  # tiempo (DEC-038): un campo así sería un umbral no aprobado implementado. El
  # "reinicio de viaje" (DEC-013) cierra la estadía activa; no es una transición
  # de `viaje.estado`.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/estadias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarEstadias
      tags: [estadias]
      summary: Listar estadías del viaje (ordenadas por inicio).
      description: >-
        Devuelve las estadías del viaje. La duración de cada una es DERIVABLE de
        `inicio` y `cierre`; el contrato no la expone como campo persistido.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de estadías.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaEstadias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: abrirEstadia
      tags: [estadias]
      summary: Abrir una estadía (parada durante el recorrido).
      description: >-
        Abre una estadía con su motivo y eje de autorización. Registra `inicio`.
        No cambia `viaje.estado` (el viaje sigue EN_TRANSITO). Varias estadías
        del viaje son válidas a lo largo del tiempo; su coexistencia con una
        condición INCIDENCIA también lo es (dimensiones distintas).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EstadiaEntrada"}
      responses:
        "201":
          description: Estadía abierta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Estadia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/viajes/{id}/estadias/{eid}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: eid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: cerrarEstadia
      tags: [estadias]
      summary: Cerrar una estadía (registra el cierre).
      description: >-
        Registra `cierre` sobre una estadía abierta. La duración queda DERIVABLE
        de `inicio` y `cierre`; no se captura a mano ni se rotula. No cambia
        `viaje.estado`. El "reinicio de viaje" (DEC-013) cierra la estadía activa
        por esta misma ruta.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CierreEstadiaEntrada"}
      responses:
        "200":
          description: Estadía cerrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Estadia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            La estadía ya está cerrada. `codigo` de máquina `estadia_ya_cerrada`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/auditoria:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: consultarAuditoria
      tags: [auditoria]
      summary: Consulta probatoria de la auditoría del viaje (administrador).
      description: >-
        Consulta/exportación probatoria. Sólo el rol `administrador` (DEC-036);
        cada acceso queda a su vez auditado.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de registros de auditoría.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaAuditoria"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  # ---------------------------------------------------------------------------
  # Adjuntos / evidencia del viaje (E6-T4 / E6-HU-027). Metadatos en el esquema
  # `bitacora` de `operacion`; los BYTES viven en el almacenamiento de objetos
  # (propuesta ADR 32: MinIO) y NUNCA pasan por el servicio: la subida y la
  # descarga usan una URL de vida corta. La clave del objeto queda alcanzada por
  # tenant/viaje (mismo patrón que `mensajeria`, MSG-REC §7). No existe catálogo
  # de tipos obligatorios en V1 (DEC-040): un viaje con cero adjuntos cierra. Todo
  # acceso a un adjunto —subida y descarga— queda auditado (E1-T7).
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/adjuntos:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarAdjuntos
      tags: [adjuntos]
      summary: Listar los adjuntos de un viaje con sus metadatos.
      description: >-
        Lista los metadatos de los adjuntos del viaje. No devuelve bytes: la
        descarga se pide por separado con autorización de vida corta. Un usuario
        fuera del alcance del viaje recibe 403 antes de listar nada.
      responses:
        "200":
          description: Adjuntos del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaAdjuntos"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/adjuntos/intenciones-subida:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: crearIntencionSubidaAdjunto
      tags: [adjuntos]
      summary: Intención de subida de un adjunto con autorización de vida corta.
      description: >-
        Los bytes NO pasan por el servicio: el cliente los sube al almacenamiento
        de objetos con la URL devuelta. La clave del objeto queda alcanzada por
        tenant/viaje. Un usuario fuera del alcance del viaje recibe 403 antes de
        emitir la intención.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntencionSubidaAdjuntoEntrada"}
      responses:
        "201":
          description: Intención creada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntencionSubidaAdjunto"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/adjuntos/{aid}/descarga:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: aid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: descargarAdjunto
      tags: [adjuntos]
      summary: Autorización de vida corta para descargar un adjunto.
      description: >-
        Devuelve una URL de descarga de vida corta del almacenamiento de objetos
        tras reverificar tenant y alcance del viaje. Los bytes NO pasan por el
        servicio. Cada descarga queda auditada (actor, adjunto, momento; E1-T7).
        Un usuario fuera del alcance recibe 403 antes de autorizar nada.
      responses:
        "200":
          description: Autorización de descarga.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DescargaAdjunto"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Registro de descarga del expediente del viaje (E6-T3 / AI27-80). `bff`
  # compone el expediente leyendo de `operacion` (ficha + bitácora + auditoría)
  # y luego invoca esta operación, que deja EL rastro de auditoría de la
  # descarga (actor, viaje, momento; E1-T7) en su propia transacción, vía el
  # interceptor con el rol dueño `op_auditoria`. No se otorga GRANT a `op_viajes`
  # ni se requiere ADR: el dueño del esquema `auditoria` ya tiene INSERT por
  # diseño (ADR 33 gobierna la única excepción de GRANT cruzado, la de
  # `op_asignacion`, que aquí no se toca). Es POST porque deja un efecto
  # persistente; `bff` mantiene su GET público `descargarViaje` sin ensuciarlo
  # con una escritura oculta.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/descargas:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: registrarDescargaViaje
      tags: [auditoria]
      summary: Registrar una descarga del expediente del viaje (deja auditoría).
      description: >-
        Registra que el expediente del viaje se descargó, dejando su rastro de
        auditoría en la misma transacción (interceptor, `op_auditoria`; E1-T7).
        La invoca `bff` al servir `descargarViaje`; la composición del expediente
        la arma `bff` con las lecturas existentes. Un usuario fuera del alcance
        del viaje recibe 403 antes de registrar nada.
      responses:
        "200":
          description: Descarga registrada; datos base del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Viaje"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

components:
  schemas:
    # --- Enum espejo de contracts/estados/viaje.estados.yaml. CI verifica la
    #     equivalencia; la fuente canónica es el archivo de estados. ---
    EstadoViaje:
      type: string
      description: >-
        Estado de progreso del viaje. Espejo del enum canónico de
        `contracts/estados/` (ADR 19). Incluye estados V2 declarados e
        inalcanzables en V1 (PATRULLA_EN_CAMINO).
      enum:
      - SOLICITADO
      - APROBADO
      - RECHAZADO_POR_AI27
      - RECHAZADO_POR_CLIENTE
      - ASIGNADO
      - APTO_PARA_SALIDA
      - EN_EMBARQUE
      - PATRULLA_EN_CAMINO
      - EN_TRANSITO
      - EN_DESTINO
      - EN_DESCARGA
      - CERRADO
      - CANCELADO

    CondicionViaje:
      type: string
      description: Condición ortogonal al progreso (§C.2). Nunca es un estado.
      enum: [INCIDENCIA, SIN_SENAL]

    Destino:
      type: object
      additionalProperties: false
      required: [nombre]
      properties:
        nombre:
          type: string
          description: Destino en texto libre (DEC-010 #1).
        numero_envio: {type: string}
        fecha_cita:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        arribo:
          type: boolean
          description: Si la unidad arribó a este destino (DEC-012). Captura del operador, no derivado del estado.
    CrearViajeEntrada:
      type: object
      additionalProperties: false
      required: [origen, destinos]
      properties:
        origen:
          type: string
          description: Origen en texto libre (DEC-010 #1).
        destinos:
          type: array
          minItems: 1
          description: Uno o más destinos (multi-parada, DEC-013/DEC-020).
          items: {$ref: "#/components/schemas/Destino"}
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio: {type: string}
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
          description: >-
            Tracto del cliente (unidad escoltada). Opcional: el cliente puede
            capturarlo en la solicitud y el operador completarlo luego en la
            ficha (DEC-104 #1 / DEC-010 #4).
        # asignacion es opcional: sólo Operación puede asignar en el mismo acto
        # (DEC-026). Ausente = sin asignación (equivale a null en 3.0.x).
        asignacion:
          $ref: "#/components/schemas/AsignacionEntrada"
    Viaje:
      type: object
      additionalProperties: false
      required: [id, estado, origen, destinos, creado_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado: {$ref: "#/components/schemas/EstadoViaje"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        origen: {type: string}
        destinos:
          type: array
          items: {$ref: "#/components/schemas/Destino"}
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio:
          type: string
          nullable: true
          description: >-
            Tipo de servicio/monitoreo que el cliente eligió en la solicitud
            (DEC-010 #3). SOLO LECTURA en E8-T12: el monitorista lo visualiza, no
            lo edita. `string` (no enum) porque los valores de catálogo siguen
            pendientes (DEC-104 #4); estrechar a enum después es breaking.
        # eta_estimado es nullable: ETA A->B capturado manualmente por el operador
        # (ADR 20 / DEC-007). null = sin ETA aún. `operacion` guarda y devuelve el
        # valor crudo; la obsolescencia (`stale`) la deriva el `bff` al leer.
        eta_estimado:
          type: string
          format: date-time
          nullable: true
          description: >-
            ETA estimado del viaje, capturado a mano (ADR 20). Mismo formato que
            `MarcaTiempo`. null si no se ha fijado. `operacion` no calcula ni
            expone `stale`: eso lo hace el `bff`.
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    ViajeDetalle:
      type: object
      additionalProperties: false
      required: [viaje, condiciones_activas]
      properties:
        viaje: {$ref: "#/components/schemas/Viaje"}
        condiciones_activas:
          type: array
          description: Condiciones ortogonales abiertas (dato separado del estado).
          items: {$ref: "#/components/schemas/CondicionAbierta"}
        incidencias_activas:
          type: array
          description: >-
            Incidencias abiertas del viaje con su `tipo_interno` (AI27-59). Es
            CONSUMO INTERNO de `bff`: la vista curada para el cliente la compone
            `bff` mapeando el tipo a una categoría (DEC-006), nunca este
            contrato. Opcional y aditivo: `condiciones_activas` se conserva sin
            cambios. Cada entrada corresponde a una condición `INCIDENCIA`
            abierta; `CondicionAbierta` no lleva el tipo porque es el dato crudo
            de la máquina de condiciones, sin el catálogo operativo.
          items: {$ref: "#/components/schemas/IncidenciaActiva"}

    CondicionAbierta:
      type: object
      additionalProperties: false
      required: [tipo, abierta_en]
      properties:
        tipo: {$ref: "#/components/schemas/CondicionViaje"}
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    IncidenciaActiva:
      type: object
      additionalProperties: false
      required: [id, tipo_interno, estado, abierta_en]
      description: >-
        Incidencia abierta embebida en la lectura del viaje (AI27-59). Vista
        reducida de `Incidencia` para consumo de `bff`: sin `viaje_id` (implícito
        en el viaje leído) ni `resuelta_en` (si está en la lista, está abierta).
        `tipo_interno` es interno; el curado para el cliente lo hace `bff`
        (DEC-006).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo_interno: {type: string}
        estado:
          type: string
          enum: [en_atencion, resuelta]
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}


    EtaEntrada:
      type: object
      additionalProperties: false
      required: [eta_estimado]
      properties:
        eta_estimado:
          allOf: [$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"]
          description: >-
            ETA estimado a fijar (captura manual, ADR 20). Reemplaza el valor
            previo; `operacion` no lo recalcula ni lo marca obsoleto.

    FechaHoraEntrada:
      type: object
      additionalProperties: false
      required: [fecha_hora_servicio]
      properties:
        fecha_hora_servicio:
          allOf: [$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"]
          description: >-
            Fecha/hora del servicio a completar o editar sobre un viaje ya
            creado (E1-HU-003, DEC-010 #2). Reemplaza el valor previo.

    PaginaViajes:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Viaje"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    MotivoCierre:
      type: string
      description: >-
        Motivo del cierre del viaje (DEC-113). Catálogo cerrado de V1: `normal`
        (cierre tras la última parada) o `por_incidencia` (habilita el cierre
        anticipado, DEC-020 #6). Se retiró `bitacora` (era una cita a DEC-013 sin
        respaldo, DEC-113). La ventana de escritura de la conversación la decide
        `mensajeria` por el motivo (3 días / 6 meses, DEC-030/DEC-041).
      enum: [normal, por_incidencia]

    TransicionEntrada:
      type: object
      additionalProperties: false
      required: [a_estado]
      properties:
        a_estado:
          allOf: [$ref: "#/components/schemas/EstadoViaje"]
          description: Estado destino. Se valida contra la máquina de estados.
        causa:
          type: string
          description: >-
            Causa de la transición. Obligatoria cuando el destino la requiere
            (p. ej. motivo de rechazo, DEC-020 #2). La validación fina vive en
            el servicio.
        motivo_cierre:
          allOf: [$ref: "#/components/schemas/MotivoCierre"]
          description: >-
            Obligatorio al transicionar a `CERRADO` (E8-T14, DEC-113); ignorado
            en cualquier otra arista. Sustituye el puente previo que leía el
            motivo de `causa`.

    AsignacionEntrada:
      type: object
      additionalProperties: false
      required: [unidades_ids]
      description: >-
        Escolta a reservar: una o más `unidades` del roster (D2). Reemplaza el
        par `unidad_id` + `custodios_ids`: la reserva es por unidad completa
        (paquete vehículo + custodios), no por recursos sueltos (ADR 31).
      properties:
        unidades_ids:
          type: array
          minItems: 1
          description: Identificadores de las unidades del roster que forman la escolta.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    ReasignacionEntrada:
      type: object
      additionalProperties: false
      required: [unidades_ids, motivo]
      description: >-
        La reasignación manda la escolta completa (D2). Ambos campos son
        obligatorios. No recibe custodios: cambiar un custodio es edición de
        roster, no reasignación.
      properties:
        unidades_ids:
          type: array
          minItems: 1
          description: "Escolta resultante: una o más unidades del roster."
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        motivo:
          type: string
          description: Motivo de la reasignación (auditado).

    # --- Aptitud informativa por átomo en la RESPUESTA de la asignación (D1 /
    #     DEC-055). NO hay aptitud agregada por unidad: sería regla nueva. El
    #     estado `desconocido` lo calcula `operacion` cuando `catalogos` no
    #     responde o el dato está obsoleto; `catalogos` nunca lo devuelve. ---
    AptitudRecurso:
      type: object
      additionalProperties: false
      required: [recurso, recurso_id, estado]
      properties:
        recurso:
          type: string
          enum: [vehiculo, custodio]
          description: Átomo evaluado dentro de la unidad.
        recurso_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          enum: [apto, no_apto, desconocido]
          description: >-
            Afirmación informativa (DEC-055). `desconocido` lo calcula
            `operacion`, no `catalogos`. Nunca bloquea la asignación en V1.
        motivos:
          type: array
          description: Motivos, cuando el estado es `no_apto`.
          items: {type: string}

    UnidadAsignada:
      type: object
      additionalProperties: false
      required: [unidad_id, aptitud]
      properties:
        unidad_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        aptitud:
          type: array
          description: Aptitud informativa por átomo (vehículo y custodios de la unidad).
          items: {$ref: "#/components/schemas/AptitudRecurso"}

    Asignacion:
      type: object
      additionalProperties: false
      required: [viaje_id, estado, unidades]
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          allOf: [{$ref: "#/components/schemas/EstadoViaje"}]
          description: >-
            Estado del viaje tras la reserva. En V1 la asignación exitosa deja
            `ASIGNADO` (APROBADO → ASIGNADO, DEC-026). Se afirma en el dato para
            que el consumidor no lo infiera del éxito de la operación.
        unidades:
          type: array
          description: >-
            Unidades de la escolta reservada, cada una con su aptitud informativa
            por átomo (D1). La reserva ya ocurrió: la aptitud es sólo dato.
          items: {$ref: "#/components/schemas/UnidadAsignada"}

    # --- Roster de unidades (D6a / ADR 31 §5 / ADR 33). La `unidad` es un
    #     paquete pre-armado: un vehículo (átomo de `catalogos`) con uno o dos
    #     custodios (átomos de `catalogos`), referidos POR IDENTIFICADOR, nunca
    #     por FK cruzada de esquema. El roster lo administra el `jefe_operativo`.
    #
    #     PREGUNTA ABIERTA (Operación): si un mismo custodio puede estar en más
    #     de una `unidad` (exclusividad) NO está decidido. El contrato NO impone
    #     esa restricción; se resolverá cuando Operación lo defina.
    #
    #     El `tipo` (patrulla|moto) es SOLO LECTURA: se deriva del vehículo
    #     (coche -> patrulla, moto -> moto, ADR 31). No es columna de entrada. ---
    Unidad:
      type: object
      additionalProperties: false
      required: [id, vehiculo_id, custodios_ids, tipo, activa]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        vehiculo_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Identificador del vehículo en `catalogos`. Referencia, no FK.
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          description: >-
            Custodios de la unidad, por identificador de `catalogos`. Un coche
            lleva uno o dos; una moto, uno (ADR 31).
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo:
          type: string
          enum: [patrulla, moto]
          readOnly: true
          description: >-
            Tipo de unidad, SOLO LECTURA, derivado del vehículo en el servidor
            (coche -> patrulla, moto -> moto, ADR 31). Nunca se envía en una
            petición.
        activa:
          type: boolean
          description: Si la unidad está activa (disponible para asignarse).

    UnidadEntrada:
      type: object
      additionalProperties: false
      required: [vehiculo_id, custodios_ids]
      description: >-
        Alta de unidad. El `tipo` NO se envía: se deriva del vehículo. `activa`
        es opcional al crear (el servidor decide el valor por defecto).
      properties:
        vehiculo_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        activa:
          type: boolean
          description: Opcional al crear. Si se omite, el servidor fija el valor por defecto.

    UnidadModificacion:
      type: object
      additionalProperties: false
      description: >-
        Modificación de unidad. Todos los campos son opcionales; activar o
        desactivar es cambiar `activa`. El `tipo` nunca se envía (derivado).
      properties:
        vehiculo_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        activa:
          type: boolean

    PaginaUnidades:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Unidad"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Ficha técnica del viaje (E8-T12 / DEC-104). Tracto, contenedores y
    #     referencia de GPS. Todo opcional (edición incremental, DEC-043 #3). ---
    Tracto:
      type: object
      additionalProperties: false
      description: >-
        Tracto del cliente (unidad escoltada). Texto libre: no es recurso de AI27
        ni viene de catálogo. `placas`/`economico` separados para permitir
        búsqueda (DEC-104 #1, supera el "texto libre" de DEC-011 #2). Todos los
        campos opcionales. Mismo shape en lectura y en entrada.
      properties:
        placas:    {type: string}
        economico: {type: string}
        marca:     {type: string}
        modelo:    {type: string}
        color:     {type: string}

    Contenedor:
      type: object
      additionalProperties: false
      description: >-
        Contenedor del viaje (0..N, DEC-012). Campos del sistema actual (DEC-104
        #2), todos texto libre y opcionales. Un contenedor sin ningún dato se
        descarta al guardar.
      properties:
        economico: {type: string}
        placas:    {type: string}
        sello:     {type: string}
        color:     {type: string}

    FichaTecnica:
      type: object
      additionalProperties: false
      required: [viaje_id]
      description: >-
        Ficha técnica del viaje (lectura). La escolta NO va aquí (se deriva de la
        asignación, DEC-044); `tipo_servicio`, `origen` y `destinos` son del
        viaje (`obtenerViaje`), no de la ficha.
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
          description: Tracto del cliente, o null si no se ha capturado.
        contenedores:
          type: array
          description: Contenedores del viaje (0..N).
          items: {$ref: "#/components/schemas/Contenedor"}
        gps_ids:
          type: array
          description: >-
            Referencias a dispositivos del catálogo de GPS (DEC-012/047). Solo
            referencia, sin posición en vivo.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    FichaTecnicaEntrada:
      type: object
      additionalProperties: false
      description: >-
        Guardado parcial de la ficha (PATCH). NINGÚN campo obligatorio (DEC-043
        #3). Propiedad ausente = no se toca; colección presente = reemplaza la
        lista completa; `[]` borra la lista; contenedor vacío se descarta.
      properties:
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
          description: Objeto para fijarlo; `null` para borrarlo.
        contenedores:
          type: array
          items: {$ref: "#/components/schemas/Contenedor"}
        gps_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    EntradaBitacoraEntrada:
      type: object
      additionalProperties: false
      required: [texto]
      properties:
        texto: {type: string}

    EntradaBitacora:
      type: object
      additionalProperties: false
      required: [id, viaje_id, texto, autor, ts]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        texto: {type: string}
        autor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaBitacora:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EntradaBitacora"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    IncidenciaEntrada:
      type: object
      additionalProperties: false
      required: [tipo_interno]
      properties:
        tipo_interno:
          type: string
          description: >-
            Tipo interno de incidencia (catálogo operativo). La vista curada
            para el cliente la compone `bff` (DEC-006), no este contrato.
        descripcion: {type: string}

    Incidencia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, tipo_interno, estado, abierta_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo_interno: {type: string}
        estado:
          type: string
          enum: [en_atencion, resuelta]
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        resuelta_en:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
    PaginaIncidencias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Incidencia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    ResolucionIncidenciaEntrada:
      type: object
      additionalProperties: false
      required: [resolucion]
      properties:
        resolucion: {type: string}

    # --- Estadías (E1-T6 / DEC-038). Inicio + cierre; la duración se DERIVA, no
    #     se persiste. Sin clasificación `prolongada` ni umbral en V1. ---
    MotivoEstadia:
      type: string
      description: >-
        Motivo de la estadía (parada). Lista cerrada de V1; se amplía por ola
        aditiva si el negocio lo decide.
      enum:
        - combustible
        - descanso
        - alimentos
        - sanitario
        - reten
        - revision_autoridades
        - gastos
        - espera_entrega

    EjeAutorizacionEstadia:
      type: string
      description: Eje de autorización de la estadía (E1-HU-008).
      enum:
        - autorizada
        - no_autorizada
        - antes_200km

    Estadia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, motivo, eje_autorizacion, inicio]
      description: >-
        Estadía del viaje. La DURACIÓN NO es un campo: se deriva de `inicio` y
        `cierre` en la lectura (DEC-038). No existe `prolongada` ni umbral en V1.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        motivo: {$ref: "#/components/schemas/MotivoEstadia"}
        eje_autorizacion: {$ref: "#/components/schemas/EjeAutorizacionEstadia"}
        inicio: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        cierre:
          type: string
          format: date-time
          nullable: true
          description: >-
            Cierre de la estadía, o null si sigue abierta. Mismo formato que
            `MarcaTiempo`. La duración se deriva de `inicio` y este valor.

    EstadiaEntrada:
      type: object
      additionalProperties: false
      required: [motivo, eje_autorizacion]
      description: >-
        Cuerpo de apertura de una estadía (POST). El servicio asigna id y fija
        `inicio` al momento del registro.
      properties:
        motivo: {$ref: "#/components/schemas/MotivoEstadia"}
        eje_autorizacion: {$ref: "#/components/schemas/EjeAutorizacionEstadia"}

    CierreEstadiaEntrada:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de cierre de una estadía (PATCH). Sin campos obligatorios: el
        servidor fija `cierre` al momento del registro. Cuerpo vacío válido.
      properties: {}

    PaginaEstadias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Estadia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    RegistroAuditoria:
      type: object
      additionalProperties: false
      required: [entidad, entidad_id, actor, ts]
      properties:
        entidad: {type: string}
        entidad_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        de: {type: string}
        a: {type: string}
        actor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaAuditoria:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RegistroAuditoria"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Adjuntos / evidencia (E6-T4). Metadatos del adjunto; los bytes viven
    #     en el almacenamiento de objetos, alcanzados por tenant/viaje. ---
    Adjunto:
      type: object
      additionalProperties: false
      required: [id, viaje_id, tipo_medio, tamano_bytes, estado_escaneo, creado_en]
      description: Metadatos de un adjunto del viaje. No incluye los bytes.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo_medio:
          type: string
          description: Tipo MIME declarado del adjunto.
        tamano_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{64}$"
          description: Checksum declarado en la subida; null si no se declaró.
        estado_escaneo:
          type: string
          enum: [pendiente, limpio, infectado]
          description: >-
            Estado del escaneo antivirus del objeto. `pendiente` tras crear la
            intención; `limpio`/`infectado` cuando el escaneo concluye. Un
            adjunto no `limpio` no autoriza descarga.
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaAdjuntos:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Adjunto"}

    IntencionSubidaAdjuntoEntrada:
      type: object
      additionalProperties: false
      required: [tipo_medio, tamano_bytes, checksum_sha256]
      properties:
        tipo_medio:
          type: string
          description: Tipo MIME declarado.
        tamano_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"

    IntencionSubidaAdjunto:
      type: object
      additionalProperties: false
      required: [adjunto_id, url_subida, expira_en]
      properties:
        adjunto_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        url_subida:
          type: string
          format: uri
          description: URL de vida corta del almacenamiento de objetos.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    DescargaAdjunto:
      type: object
      additionalProperties: false
      required: [url_descarga, expira_en]
      properties:
        url_descarga:
          type: string
          format: uri
          description: URL de vida corta del almacenamiento de objetos.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
