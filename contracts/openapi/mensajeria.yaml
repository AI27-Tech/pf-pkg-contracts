# =============================================================================
# contracts/openapi/mensajeria.yaml
# -----------------------------------------------------------------------------
# Superficie HTTP interna de `mensajeria` (ola contractual 2, `tracer.7`).
# Fuente: docs/arquitectura/services/mensajeria.md (f) y el Addendum de
# conversación de negocio y bandeja compartida (§4–§8). Lo consume `bff`, nunca
# el navegador directo.
#
# La conversación es entre el cliente y una BANDEJA COMPARTIDA de AI27 atendida
# por un pool, no entre el cliente y un operador nombrado. Solo el responsable
# con reclamo activo responde normalmente (Addendum §4).
#
# DESDE tracer.17: la familia de emergencia (ADR 21, DEC-034, DEC-099, DEC-100)
# entra aquí como superficie NUEVA junto a la conversación: rutas
# `/api/v1/viajes/{id}/emergencias`, esquemas `CasoEmergencia`/`NotaEmergencia`
# y ciclo del caso `abierta → en_atencion → resuelta → cerrada`. No generaliza
# ni toca los esquemas de conversación (DEC-100 punto 2). DESDE tracer.34 se
# añaden, sin tocar lo anterior, la bandeja de Reacción sin `{id}` y las
# acciones del caso por su propio id (`/api/v1/emergencias/{eid}...`, DEC-028).
# El catch-up de la COLECCIÓN de bandeja SÍ entra desde tracer.14:
# `listarTrabajoBandeja` expone la `revision` de la colección y acepta
# `desde_revision` para el catch-up incremental, con `409 stream_resync_required`
# fuera de ventana (ADR 28 §3, §5), el mismo patrón que la conversación ya tenía.
# Plantillas de notificación no se publican: V1 no notifica al cliente (DEC-023).
#
# Cursores (ADR 28): la recuperación durable de una conversación es
# `listarMensajes?despues_de=<secuencia>`, y el estado inicial lleva
# `ultima_secuencia`. La secuencia de mensaje es por conversación; no existe
# secuencia global de `mensajeria` ni se confunde con el `seq` de transporte.
# =============================================================================
openapi: 3.0.3
info:
  title: AI27 — mensajeria
  version: 0.1.0-tracer.34
  description: >-
    Conversación de negocio entre el cliente y la bandeja compartida de AI27:
    enrutamiento, reclamo versionado, orden canónico de mensajes, recibos,
    atención, adjuntos y auditoría. Consumido por `bff`.
  x-ai27-servicio: mensajeria
  x-ai27-capa: soporte
  x-ai27-tracer: false

servers:
- url: /
  description: Ruta base montada por el despliegue; los paths incluyen /api/v1.

security:
- bearerCognito: []

tags:
- name: bandejas
- name: conversaciones
- name: mensajes
- name: reclamos
- name: emergencias
- name: adjuntos
- name: auditoria

paths:
  # Bandeja del pool del sujeto, SIN {id} (E8-T15, DEC-103: cola única e
  # implícita). Resuelve la bandeja de chat del sujeto por su membresía efectiva
  # del token; el llamante no nombra bandeja. Es la ruta que consume el `bff`
  # (que expone `/api/v1/bandeja/trabajo` sin `{id}`): el frontend interno no
  # codifica un identificador de bandeja. La ruta con `{id}` de abajo coexiste
  # para usos administrativos (listar una bandeja nombrada).
  /api/v1/bandeja/trabajo:
    get:
      operationId: listarTrabajoMiBandeja
      tags: [bandejas]
      summary: Listar el trabajo de la bandeja del sujeto (bootstrap y catch-up).
      description: >-
        Igual que `listarTrabajoBandeja` pero SIN `{id}`: `mensajeria` resuelve
        la bandeja de chat del sujeto desde su MEMBRESÍA EFECTIVA del pool
        (cola única e implícita, DEC-103). Si el sujeto no pertenece a ningún
        pool de chat, responde `404` (no tiene bandeja), igual que una bandeja
        inexistente. El rol `ejecutivo` por sí solo no basta: la autoridad es la
        membresía (Addendum §7). `desde_revision` y `cursor` funcionan igual que
        en la ruta con `{id}`; el `409 stream_resync_required` también.
      parameters:
      - {$ref: "#/components/parameters/CursorPagina"}
      - name: desde_revision
        in: query
        required: false
        description: >-
          Catch-up: devuelve los cambios de la colección con revisión mayor a
          este valor. Es la `revision` de una respuesta previa, no el cursor de
          paginación.
        schema: {$ref: "#/components/schemas/RevisionBandeja"}
      responses:
        "200":
          description: Trabajo de la bandeja del sujeto con la revisión de la colección.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrabajoBandeja"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ResyncRequerido"}

  /api/v1/bandejas/{id}/trabajo:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    get:
      operationId: listarTrabajoBandeja
      tags: [bandejas]
      summary: Listar el trabajo de una bandeja (bootstrap y catch-up).
      description: >-
        Requiere MEMBRESÍA EFECTIVA en el pool de la bandeja; el rol
        `ejecutivo` por sí solo no concede acceso a todas las bandejas
        (Addendum §7).

        Sin `desde_revision` es el BOOTSTRAP: devuelve el trabajo actual y la
        `revision` de la colección (ADR 28 §2, §3). Con `desde_revision` es el
        CATCH-UP: devuelve los cambios de la colección posteriores a esa
        revisión. Si la revisión pedida quedó fuera de la ventana retenida,
        responde `409 stream_resync_required` y el cliente repite el bootstrap
        (ADR 28 §5). `desde_revision` y `cursor` de paginación son ortogonales.
      parameters:
      - {$ref: "#/components/parameters/CursorPagina"}
      - name: desde_revision
        in: query
        required: false
        description: >-
          Catch-up: devuelve los cambios de la colección con revisión mayor a
          este valor. Es la `revision` de una respuesta previa, no el cursor de
          paginación.
        schema: {$ref: "#/components/schemas/RevisionBandeja"}
      responses:
        "200":
          description: Trabajo de la bandeja con la revisión de la colección.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrabajoBandeja"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ResyncRequerido"}

  /api/v1/conversaciones:
    get:
      operationId: listarConversaciones
      tags: [conversaciones]
      summary: Listar conversaciones por alcance del llamante.
      description: >-
        Para el cliente, las de su tenant con acceso efectivo; para audiencia
        interna, las de su alcance por `cliente` (DEC-045 #8).
      parameters:
      - {$ref: "#/components/parameters/CursorPagina"}
      responses:
        "200":
          description: Página de conversaciones.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaConversaciones"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/conversaciones/{id}:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    get:
      operationId: obtenerConversacion
      tags: [conversaciones]
      summary: Detalle de una conversación (estado inicial para bootstrap).
      description: >-
        Poseer el UUID no autoriza (Addendum §7): sin acceso efectivo responde
        404, igual que si no existiera. `ultima_secuencia` es el cursor de
        dominio del bootstrap (ADR 28 §2).
      responses:
        "200":
          description: Conversación.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversacion"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # Resolución de la conversación por viaje (E9-T8, tracer.33). La conversación
  # se crea por evento y su `id` es propio de `mensajeria`, distinto del
  # `viaje_id`; el `bff` sólo conoce el viaje. Con esta operación obtiene el
  # `id` y sigue con las operaciones por `{id}` (mensajes, envío).
  /api/v1/viajes/{id}/conversacion:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    get:
      operationId: obtenerConversacionDeViaje
      tags: [conversaciones]
      summary: Conversación de un viaje, resuelta por el id del viaje.
      description: >-
        `{id}` es el `viaje_id`, no el id de la conversación. Devuelve la
        conversación del viaje con la misma forma que `obtenerConversacion`; el
        `id` de la respuesta es el que usan `listarMensajes`, `enviarMensaje` y
        demás operaciones por conversación. Si el viaje tiene una conversación
        no cerrada (a lo más una por tenant y viaje, Addendum §6) se devuelve
        ésa; si sólo tiene conversaciones cerradas, la más reciente.

        Audiencia: el Cliente del tenant dueño del viaje y los miembros
        internos del pool, con la misma autorización que `obtenerConversacion`.
        Poseer el `viaje_id` no autoriza (Addendum §7): sin acceso efectivo
        responde 404, igual que si el viaje todavía no tuviera conversación.
      responses:
        "200":
          description: Conversación del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversacion"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/conversaciones/{id}/mensajes:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    get:
      operationId: listarMensajes
      tags: [mensajes]
      summary: Historia de mensajes por secuencia canónica.
      description: >-
        `antes_de` pagina la historia hacia atrás; `despues_de` es la
        recuperación tras reconexión y cierra huecos (Addendum §9). Son
        mutuamente excluyentes; sin ninguno, devuelve los más recientes. El
        orden es siempre por `secuencia`, nunca por `creado_en`.
      parameters:
      - name: antes_de
        in: query
        required: false
        description: Devuelve mensajes con secuencia menor a este valor.
        schema: {$ref: "#/components/schemas/SecuenciaMensaje"}
      - name: despues_de
        in: query
        required: false
        description: Devuelve mensajes con secuencia mayor a este valor.
        schema: {$ref: "#/components/schemas/SecuenciaMensaje"}
      - name: limite
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Mensajes en orden ascendente de secuencia.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaMensajes"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: enviarMensaje
      tags: [mensajes]
      summary: Enviar un mensaje (idempotente por client_message_id).
      description: >-
        El cliente puede enviar mientras la conversación admita escritura. Un
        interno requiere RECLAMO ACTIVO y `version_reclamo_esperada`, salvo
        override explícito de supervisor con `motivo_override` (Addendum §7).
        Reintentar el mismo `client_message_id` devuelve el mensaje original
        con 200 y nunca crea un segundo mensaje.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnviarMensajeEntrada"}
      responses:
        "201":
          description: Mensaje creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Mensaje"}
        "200":
          description: Reintento idempotente; mensaje original.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Mensaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            `codigo` de máquina `conflicto_version_reclamo` (otro reclamo ganó
            o la versión cambió) o `conversacion_solo_lectura` (venció
            `escritura_hasta`, DEC-030/DEC-041).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/conversaciones/{id}/reclamos:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    post:
      operationId: reclamarConversacion
      tags: [reclamos]
      summary: Reclamar la conversación con versión esperada.
      description: >-
        Dos reclamos concurrentes producen un ganador; el perdedor recibe 409
        `conflicto_version_reclamo` (Addendum §4 punto 5).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionEsperadaEntrada"}
      responses:
        "201":
          description: Reclamo abierto.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/conversaciones/{id}/reclamos/{rid}:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    - name: rid
      in: path
      required: true
      description: Identificador del reclamo.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    delete:
      operationId: liberarReclamo
      tags: [reclamos]
      summary: Liberar el reclamo y devolver el trabajo al pool.
      description: Lo hace el responsable o un supervisor dentro de su alcance.
      parameters:
      - name: version_esperada
        in: query
        required: true
        schema: {$ref: "#/components/schemas/VersionReclamo"}
      responses:
        "204": {description: Reclamo liberado.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/conversaciones/{id}/transferencias:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    post:
      operationId: transferirConversacion
      tags: [reclamos]
      summary: Transferir la responsabilidad a otro miembro del pool.
      description: >-
        Cierra el reclamo anterior y abre el siguiente en UNA transacción: no
        hay ventana sin responsable ni con dos (Addendum §6).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransferenciaEntrada"}
      responses:
        "201":
          description: Reclamo nuevo del responsable destino.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/conversaciones/{id}/recibos/entregado:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    post:
      operationId: registrarReciboEntregado
      tags: [mensajes]
      summary: Avanzar el cursor de entrega del llamante.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReciboEntrada"}
      responses:
        "204": {description: Cursor avanzado (o sin cambio si ya estaba más adelante).}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/conversaciones/{id}/recibos/leido:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    post:
      operationId: registrarReciboLeido
      tags: [mensajes]
      summary: Avanzar el cursor de lectura del llamante.
      description: >-
        Una vista incidental de un miembro no responsable no genera un "leído"
        visible al cliente (Addendum §8).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReciboEntrada"}
      responses:
        "204": {description: Cursor avanzado (o sin cambio si ya estaba más adelante).}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/conversaciones/{id}/atendida:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    post:
      operationId: marcarAtendida
      tags: [reclamos]
      summary: Marcar la conversación como atendida por el responsable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionEsperadaEntrada"}
      responses:
        "204": {description: Conversación atendida.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/conversaciones/{id}/adjuntos/intenciones-subida:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    post:
      operationId: crearIntencionSubida
      tags: [adjuntos]
      summary: Intención de subida de un adjunto con autorización de vida corta.
      description: >-
        Los bytes no pasan por el servicio: van al almacenamiento de objetos
        con la URL devuelta. La clave del objeto queda alcanzada por tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntencionSubidaEntrada"}
      responses:
        "201":
          description: Intención creada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntencionSubida"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/emergencias:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    get:
      operationId: listarEmergencias
      tags: [emergencias]
      summary: Listar los casos de emergencia de un viaje por audiencia.
      description: >-
        Para el cliente, la VISTA MÍNIMA (ADR 21 §6): solo casos en `abierta`,
        `en_atencion` o `resuelta`, identificados por fecha/hora, sin cuerpos de
        nota, contactos, recursos ni personal de Reacción. Para audiencia
        Interno dentro del alcance del viaje, el caso completo. Un miembro
        efectivo del pool Reacción ve los casos que puede reclamar (DEC-028).
      responses:
        "200":
          description: Casos de emergencia del viaje, proyectados por audiencia.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaEmergencias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: activarEmergencia
      tags: [emergencias]
      summary: Activar una emergencia sobre el viaje (idempotente por activacion_id).
      description: >-
        Cliente dentro de su organización, o usuario de monitoreo
        (Monitorista/Supervisor/Coordinador) dentro de su alcance, activan el
        caso (ADR 21 §1, DEC-045 #9). Habilitada desde `SOLICITADO` en estados
        no terminales; denegada en `CERRADO`, `CANCELADO`, `RECHAZADO_POR_AI27`
        y `RECHAZADO_POR_CLIENTE` con 409 `viaje_en_estado_terminal`.

        Idempotente por `activacion_id` del llamante (ADR 21 §2, mismo patrón
        que `enviarMensaje`): reentregar la misma activación devuelve el MISMO
        caso con 200 y no crea un duplicado; una pulsación nueva con otro
        `activacion_id` crea OTRO caso con 201, aunque ya exista uno abierto.
        No crea incidencia ni condición.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivarEmergenciaEntrada"}
      responses:
        "201":
          description: Caso creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CasoEmergencia"}
        "200":
          description: Reentrega idempotente; caso original.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CasoEmergencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            `codigo` de máquina `viaje_en_estado_terminal`: el viaje no admite
            activar una emergencia en su estado actual.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/emergencias/{eid}/notas:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: agregarNotaEmergencia
      tags: [emergencias]
      summary: Agregar una nota al caso (append-only, unidireccional a Reacción).
      description: >-
        Cliente u Operator dentro del alcance agregan notas mientras el caso
        esté en `abierta`, `en_atencion` o `resuelta`; denegado en `cerrada`
        con 409 `emergencia_cerrada` (ADR 21 §4). Texto de hasta 1000
        caracteres; se recortan espacios de inicio y fin; una nota vacía tras el
        recorte no se guarda (400). Sin adjuntos en V1. La nota se copia con
        contenido completo al histórico interno del viaje (evento
        `emergencia.nota_agregada`, DEC-100).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotaEmergenciaEntrada"}
      responses:
        "201":
          description: Nota agregada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotaEmergencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: "`codigo` de máquina `emergencia_cerrada`: el caso no admite notas."
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/emergencias/{eid}/reclamos:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: reclamarEmergencia
      tags: [emergencias]
      summary: Reclamar el caso (abierta -> en_atencion) con versión esperada.
      description: >-
        Solo un miembro efectivo del pool Reacción (DEC-028). El reclamo ejecuta
        la transición `abierta -> en_atencion` (ADR 21 §5). Dos reclamos
        concurrentes producen un ganador; el perdedor recibe 409
        `conflicto_version_reclamo`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionEsperadaEntrada"}
      responses:
        "201":
          description: Reclamo abierto; caso en atención.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/viajes/{id}/emergencias/{eid}/reclamos/{rid}:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    - name: rid
      in: path
      required: true
      description: Identificador del reclamo.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    delete:
      operationId: liberarReclamoEmergencia
      tags: [emergencias]
      summary: Liberar el reclamo y devolver el caso al pool de Reacción.
      description: >-
        Lo hace el responsable o un supervisor con mando sobre Reacción dentro
        de su alcance (DEC-099). El caso vuelve a `abierta`.
      parameters:
      - name: version_esperada
        in: query
        required: true
        schema: {$ref: "#/components/schemas/VersionReclamo"}
      responses:
        "204": {description: Reclamo liberado.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/viajes/{id}/emergencias/{eid}/transferencias:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: transferirEmergencia
      tags: [emergencias]
      summary: Transferir la responsabilidad del caso a otro miembro de Reacción.
      description: >-
        Cierra el reclamo anterior y abre el siguiente en UNA transacción; no
        hay ventana sin responsable ni con dos. La transferencia conserva el
        estado del caso (ADR 21 §5).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransferenciaEntrada"}
      responses:
        "201":
          description: Reclamo nuevo del responsable destino.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/viajes/{id}/emergencias/{eid}/resolucion:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: resolverEmergencia
      tags: [emergencias]
      summary: Resolver el caso (en_atencion -> resuelta) con nota obligatoria.
      description: >-
        Solo el responsable vigente de Reacción (ADR 21 §5). Exige una nota de
        resolución de 1 a 1000 caracteres, con las mismas validaciones de las
        demás notas. `resuelta` es irreversible.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolucionEmergenciaEntrada"}
      responses:
        "200":
          description: Caso resuelto.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CasoEmergencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/viajes/{id}/emergencias/{eid}/cierre:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: cerrarEmergencia
      tags: [emergencias]
      summary: Cerrar administrativamente el caso (resuelta -> cerrada).
      description: >-
        Solo Monitorista/Supervisor/Coordinador dentro del alcance del viaje, o
        Administrator global (ADR 21 §5). No exige texto. Reacción no cierra y
        el Cliente no resuelve ni cierra. `cerrada` es irreversible.
      responses:
        "200":
          description: Caso cerrado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CasoEmergencia"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  # ===========================================================================
  # BANDEJA DE REACCIÓN y caso POR SU PROPIO ID (tracer.34, DEC-028).
  # Reacción no tiene acceso al viaje, la bitácora, las incidencias ni la
  # conversación del cliente: su interfaz es la bandeja y el caso (DEC-028,
  # E8-T18). Por eso estas rutas no llevan `{id}` de viaje: la bandeja se
  # resuelve por la membresía del sujeto (mismo patrón que
  # `listarTrabajoMiBandeja`, DEC-103) y cada acción se nombra por el `id` del
  # caso (`mensajeria.emergencia.id`). Son ADITIVAS: la familia
  # `/api/v1/viajes/{id}/emergencias...` no cambia y monitoreo la sigue usando.
  # Las acciones calcan entrada, salida y errores de su gemela por viaje; solo
  # cambian los parámetros de ruta, salvo `resolverEmergenciaPorId`, que la
  # ejecuta Reacción y devuelve la vista `EmergenciaReaccion` (sin viaje ni
  # cliente) en lugar de `CasoEmergencia`. Reacción LEE las notas del caso
  # (`listarNotasEmergenciaPorId`) y no las escribe (DEC-034, DEC-121 #4).
  #
  # Mando sobre Reacción (DEC-099, Opción B; lectura en DEC-121 #5):
  # `supervisor` y `coordinador` ven la bandeja y el caso de sus integrantes de
  # Reacción y liberan o transfieren su reclamo; no reclaman, no resuelven y no
  # cierran por ese eje. La relación de mando no existe todavía (DT-06). Atajo
  # V1 para liberar y transferir (DEC-126): lo hace el responsable o CUALQUIER
  # `supervisor`/`coordinador`, sin verificar mando.
  # ===========================================================================
  /api/v1/bandeja/emergencias:
    get:
      operationId: listarBandejaEmergencias
      tags: [emergencias]
      summary: Listar los casos de la bandeja de Reacción del sujeto.
      description: >-
        Sin `{id}` de viaje ni de bandeja: `mensajeria` resuelve la bandeja de
        tipo `emergencias` desde la MEMBRESÍA EFECTIVA del sujeto en el pool de
        Reacción (DEC-028 #1), igual que `listarTrabajoMiBandeja` resuelve la de
        chat (DEC-103). `supervisor`/`coordinador` ven además los casos de sus
        integrantes de Reacción (DEC-099, DEC-121 #5); la relación de mando no
        existe todavía (DT-06), así que el alcance de esa lectura en V1 está
        PENDIENTE. Sin membresía ni mando responde `404` (no tiene bandeja). El
        rol por sí solo no concede acceso.

        Cada fila es `EmergenciaReaccion`: el caso sin datos del viaje ni del
        cliente y sin notas (DEC-121 #2). La bandeja EXCLUYE los casos en
        `cerrada` y los ordena del más antiguo al más reciente por
        `activada_en` (DEC-121 #3); a igual `activada_en` desempata por `id`,
        para que la paginación sea estable. Sin `desde_revision`: el caso de
        emergencia no lleva revisión de colección (ADR 28 §3) hoy; si se
        necesita catch-up se añade de forma aditiva.
      parameters:
      - {$ref: "#/components/parameters/CursorPagina"}
      responses:
        "200":
          description: Casos de la bandeja de Reacción del sujeto.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaBandejaEmergencias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/emergencias/{eid}:
    parameters:
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    get:
      operationId: obtenerEmergencia
      tags: [emergencias]
      summary: Caso por su id, para que el `bff` componga el detalle de Reacción.
      description: >-
        Miembro efectivo del pool Reacción de la bandeja del caso (DEC-028 #1),
        o `supervisor`/`coordinador` sobre los casos de sus integrantes de
        Reacción (DEC-099, DEC-121 #5; mando pendiente, DT-06). Poseer el UUID
        no autoriza: sin acceso responde `404`, igual que si no existiera.

        Devuelve `CasoEmergencia`, que SÍ trae `viaje_id` (y `cliente_id`).
        Es para el `bff` y solo para él: con esos ids compone, desde `operacion`
        y `catalogos`, el bloque de viaje del detalle de Reacción (DEC-121 #2) y
        NO los reenvía al panel (ver `obtenerEmergencia` en `bff.yaml`). El
        frontend nunca consume esta respuesta directo. Monitoreo con alcance
        sobre el viaje sigue usando `listarEmergencias`.
      responses:
        "200":
          description: Caso de emergencia, con los ids que el `bff` necesita para componer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CasoEmergencia"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/emergencias/{eid}/notas:
    parameters:
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    get:
      operationId: listarNotasEmergenciaPorId
      tags: [emergencias]
      summary: Listar las notas del caso nombrado por su id (solo lectura).
      description: >-
        Mismo acceso que `obtenerEmergencia`. Reacción CONSULTA las notas del
        caso (DEC-028 #4) y no las escribe (DEC-034, DEC-121 #4): no existe
        `agregarNotaEmergenciaPorId`; las notas las agregan Cliente u Operator
        por la ruta del viaje (`agregarNotaEmergencia`). Incluye la nota de
        resolución (`es_resolucion`). Orden de creación, de la más antigua a la
        más reciente (`creado_en`, desempate por `id`). Pagina por `cursor` como
        las demás páginas de `mensajeria`.
      parameters:
      - {$ref: "#/components/parameters/CursorPagina"}
      responses:
        "200":
          description: Notas del caso.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaNotasEmergencia"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/emergencias/{eid}/reclamos:
    parameters:
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: reclamarEmergenciaPorId
      tags: [emergencias]
      summary: Reclamar el caso por su id (abierta -> en_atencion) con versión esperada.
      description: >-
        Gemela de `reclamarEmergencia` sin `{id}` de viaje. Solo un miembro
        efectivo del pool Reacción de la bandeja del caso (DEC-028 #2); sin esa
        membresía responde `403`. El mando de DEC-099 no concede reclamar:
        reclamar convierte al sujeto en responsable de Reacción (ADR 21 §5).
        Solo procede si NADIE tiene el caso (`reclamo_activo` null): si ya tiene
        responsable responde `409` aunque la `version_esperada` sea la vigente
        (DEC-125). Para cambiar de responsable, quien lo tiene lo libera o lo
        transfiere. Ejecuta `abierta -> en_atencion`. Dos reclamos concurrentes
        producen un ganador; el perdedor recibe 409 `conflicto_version_reclamo`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionEsperadaEntrada"}
      responses:
        "201":
          description: Reclamo abierto; caso en atención.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/emergencias/{eid}/reclamos/{rid}:
    parameters:
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    - name: rid
      in: path
      required: true
      description: Identificador del reclamo.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    delete:
      operationId: liberarReclamoEmergenciaPorId
      tags: [emergencias]
      summary: Liberar el reclamo del caso por su id y devolverlo al pool de Reacción.
      description: >-
        Gemela de `liberarReclamoEmergencia` sin `{id}` de viaje. En V1 lo hace
        el responsable vigente o CUALQUIER `supervisor`/`coordinador`, sin
        verificar el mando (DEC-126, atajo de DEC-099; la verificación entra con
        la relación de mando, DT-06). Un miembro de Reacción que no es el
        responsable, y cualquier otro rol, recibe `403`. El caso vuelve a
        `abierta`.
      parameters:
      - name: version_esperada
        in: query
        required: true
        schema: {$ref: "#/components/schemas/VersionReclamo"}
      responses:
        "204": {description: Reclamo liberado.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/emergencias/{eid}/transferencias:
    parameters:
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: transferirEmergenciaPorId
      tags: [emergencias]
      summary: Transferir el caso por su id a otro miembro de Reacción.
      description: >-
        Gemela de `transferirEmergencia` sin `{id}` de viaje. En V1 la hace el
        responsable vigente (DEC-028 #2) o CUALQUIER `supervisor`/`coordinador`,
        sin verificar el mando (DEC-126, atajo de DEC-099; DT-06). Un miembro de
        Reacción que no es el responsable, y cualquier otro rol, recibe `403`.
        El destino debe tener membresía efectiva en el pool Reacción de la
        bandeja del caso. Cierra el reclamo anterior y abre el siguiente en UNA
        transacción; conserva el estado del caso (ADR 21 §5).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransferenciaEntrada"}
      responses:
        "201":
          description: Reclamo nuevo del responsable destino.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/emergencias/{eid}/resolucion:
    parameters:
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: resolverEmergenciaPorId
      tags: [emergencias]
      summary: Resolver el caso por su id (en_atencion -> resuelta) con nota obligatoria.
      description: >-
        Gemela de `resolverEmergencia` sin `{id}` de viaje. Solo el responsable
        vigente de Reacción (ADR 21 §5, DEC-028 #3); cualquier otro sujeto,
        incluido `supervisor`/`coordinador` por el mando de DEC-099, recibe
        `403`. Exige una nota de resolución OBLIGATORIA de 1 a 1000
        caracteres, con las mismas validaciones de las demás notas; sin nota
        válida responde 400 y el caso no cambia de estado. `resuelta` es
        irreversible. A diferencia de la gemela por viaje, devuelve
        `EmergenciaReaccion` (sin viaje ni cliente, DEC-028), porque quien
        resuelve es Reacción.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolucionEmergenciaEntrada"}
      responses:
        "200":
          description: Caso resuelto, en la vista de Reacción.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmergenciaReaccion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/emergencias/{eid}/cierre:
    parameters:
    - {$ref: "#/components/parameters/EmergenciaRuta"}
    post:
      operationId: cerrarEmergenciaPorId
      tags: [emergencias]
      summary: Cerrar administrativamente el caso por su id (resuelta -> cerrada).
      description: >-
        Gemela de `cerrarEmergencia` sin `{id}` de viaje; `mensajeria` resuelve
        el viaje del caso para evaluar el alcance. Solo
        Monitorista/Supervisor/Coordinador dentro del alcance del viaje (eje de
        monitoreo por unidad), o Administrator global (ADR 21 §5). NUNCA
        Reacción ni Ejecutivo (E8-T18, DEC-045 #9, DEC-121 #5), tampoco por el
        mando de DEC-099: responden `403`. No exige texto. `cerrada` es
        irreversible.
      responses:
        "200":
          description: Caso cerrado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CasoEmergencia"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/auditoria/conversaciones/{id}:
    parameters:
    - {$ref: "#/components/parameters/IdRuta"}
    get:
      operationId: listarAuditoriaConversacion
      tags: [auditoria]
      summary: Auditoría inmutable de una conversación.
      description: Solo `administrador` (DEC-036; el rol Auditor no existe en V1).
      parameters:
      - {$ref: "#/components/parameters/CursorPagina"}
      responses:
        "200":
          description: Página de registros de auditoría.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaAuditoria"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

components:
  parameters:
    IdRuta:
      name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    EmergenciaRuta:
      name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    CursorPagina:
      name: cursor
      in: query
      required: false
      description: Cursor de paginación. No es el cursor de cambios de ADR 28.
      schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}

  responses:
    ConflictoVersion:
      description: >-
        La versión esperada del reclamo no coincide con la vigente. `codigo` de
        máquina `conflicto_version_reclamo`.
      content:
        application/json:
          schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

    ResyncRequerido:
      description: >-
        La `desde_revision` pedida quedó fuera de la ventana de cambios retenida
        de la colección: el catch-up incremental ya no es posible y el cliente
        debe repetir el bootstrap (ADR 28 §5). `codigo` de máquina
        `stream_resync_required`, el mismo que usa `realtime` ante una línea no
        reanudable; la respuesta no distingue la causa.
      content:
        application/json:
          schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  schemas:
    SecuenciaMensaje:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Secuencia canónica de mensaje, monotónica POR CONVERSACIÓN. No es una
        versión de reclamo ni el `seq` de transporte de `realtime`.

    RevisionBandeja:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Revisión monotónica de la COLECCIÓN de trabajo de una bandeja (ADR 28
        §3): avanza con cada cambio de la colección (alta, baja, reenrutamiento,
        reclamo, atención). Es el cursor de dominio del bootstrap y el catch-up
        de bandeja. No es el cursor de paginación, ni una secuencia de mensaje,
        ni el `seq` de transporte de `realtime`.

    VersionReclamo:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Versión del reclamo de la conversación (concurrencia optimista). 0 si
        nunca se ha reclamado. No es una secuencia de mensaje.

    Audiencia:
      type: string
      description: Audiencia de dominio del autor (DEC-054), no el claim `aud`.
      enum: [Cliente, Interno]

    EstadoConversacion:
      type: string
      description: >-
        Ciclo de vida, separado del estado operativo de cola (Addendum §6).
        `solo_lectura` tras vencer `escritura_hasta` (DEC-030, DEC-041).
      enum: [abierta, solo_lectura, cerrada]

    Conversacion:
      type: object
      additionalProperties: false
      required: [id, viaje_id, cliente_id, estado, ultima_secuencia, version_reclamo, abierta_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        bandeja_id:
          type: string
          format: uuid
          nullable: true
          description: Bandeja de la ruta activa. Solo para audiencia Interno.
        estado: {$ref: "#/components/schemas/EstadoConversacion"}
        escritura_hasta:
          type: string
          format: date-time
          nullable: true
          description: Fin de la ventana de escritura. No es fecha de purga.
        ultima_secuencia: {$ref: "#/components/schemas/SecuenciaMensaje"}
        version_reclamo: {$ref: "#/components/schemas/VersionReclamo"}
        reclamo_activo:
          allOf: [$ref: "#/components/schemas/Reclamo"]
          nullable: true
          description: Reclamo vigente. Solo para audiencia Interno; null si está en el pool.
        atendida_en:
          type: string
          format: date-time
          nullable: true
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaConversaciones:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Conversacion"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.

    TrabajoBandeja:
      type: object
      additionalProperties: false
      required: [items, revision, cursor_siguiente]
      description: >-
        Trabajo de una bandeja con su cursor de dominio. A diferencia de
        `PaginaConversaciones` (listado por alcance), declara la `revision` de la
        COLECCIÓN al momento de la respuesta (ADR 28 §3): es el cursor del
        bootstrap de bandeja y el punto desde el que `desde_revision` pide el
        catch-up. El cursor de paginación (`cursor_siguiente`) y el cursor de
        cambios (`revision`) son distintos y no se confunden.
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Conversacion"}
        revision:
          allOf: [{$ref: "#/components/schemas/RevisionBandeja"}]
          description: >-
            Revisión de la colección que representa esta respuesta. El cliente la
            usa como `desde_revision` en el siguiente catch-up.
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.

    Mensaje:
      type: object
      additionalProperties: false
      required: [id, conversacion_id, secuencia, client_message_id, audiencia_autor, alias_mostrado, cuerpo, creado_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        conversacion_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        secuencia: {$ref: "#/components/schemas/SecuenciaMensaje"}
        client_message_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        audiencia_autor: {$ref: "#/components/schemas/Audiencia"}
        alias_mostrado:
          type: string
          description: Identidad presentada (comercial de AI27 para el cliente).
        actor_real:
          type: string
          format: uuid
          nullable: true
          description: >-
            Sujeto que escribió. Siempre se registra (Addendum §4 punto 9),
            pero solo se entrega a audiencia Interno.
        rol_al_enviar:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Rol"]
          nullable: true
          description: Rol del autor al enviar. Solo para audiencia Interno.
        cuerpo:
          type: string
          description: Cuerpo del mensaje. Sin edición ni borrado en V1.
        adjuntos_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaMensajes:
      type: object
      additionalProperties: false
      required: [items, hay_mas]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Mensaje"}
        hay_mas:
          type: boolean
          description: true si hay más mensajes en la dirección pedida.

    EnviarMensajeEntrada:
      type: object
      additionalProperties: false
      required: [client_message_id, cuerpo]
      properties:
        client_message_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Generado por el cliente; clave de idempotencia del envío.
        cuerpo:
          type: string
          minLength: 1
        adjuntos_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version_reclamo_esperada:
          allOf: [$ref: "#/components/schemas/VersionReclamo"]
          description: Obligatoria para audiencia Interno.
        motivo_override:
          type: string
          minLength: 1
          description: >-
            Override explícito de supervisor; se audita con este motivo. Ausente
            en el envío normal.

    Reclamo:
      type: object
      additionalProperties: false
      required: [id, conversacion_id, responsable_id, version, abierto_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        conversacion_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        responsable_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version: {$ref: "#/components/schemas/VersionReclamo"}
        abierto_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        cerrado_en:
          type: string
          format: date-time
          nullable: true

    VersionEsperadaEntrada:
      type: object
      additionalProperties: false
      required: [version_esperada]
      properties:
        version_esperada: {$ref: "#/components/schemas/VersionReclamo"}

    TransferenciaEntrada:
      type: object
      additionalProperties: false
      required: [version_esperada, responsable_destino_id]
      properties:
        version_esperada: {$ref: "#/components/schemas/VersionReclamo"}
        responsable_destino_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Miembro del pool con membresía efectiva en la bandeja.
        motivo:
          type: string

    ReciboEntrada:
      type: object
      additionalProperties: false
      required: [hasta_secuencia]
      properties:
        hasta_secuencia: {$ref: "#/components/schemas/SecuenciaMensaje"}

    IntencionSubidaEntrada:
      type: object
      additionalProperties: false
      required: [tipo_medio, tamano_bytes, checksum_sha256]
      properties:
        tipo_medio:
          type: string
          description: Tipo MIME declarado.
        tamano_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"

    IntencionSubida:
      type: object
      additionalProperties: false
      required: [adjunto_id, url_subida, expira_en]
      properties:
        adjunto_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        url_subida:
          type: string
          format: uri
          description: URL de vida corta del almacenamiento de objetos.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    EstadoEmergencia:
      type: string
      description: >-
        Ciclo del caso de emergencia (ADR 21 §5), agregado propio distinto del
        estado del viaje y de `EstadoConversacion`. `resuelta` y `cerrada` son
        irreversibles.
      enum: [abierta, en_atencion, resuelta, cerrada]

    OrigenActivacion:
      type: string
      description: Quién originó la activación (ADR 21 §3).
      enum: [cliente, operacion]

    CasoEmergencia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, cliente_id, estado, origen, version_reclamo, activada_en]
      description: >-
        Caso de emergencia tal como lo conoce `mensajeria`. El payload rico a
        Reacción (escolta, teléfonos, origen/destinos del viaje) lo compone
        `bff` con `operacion`; aquí viajan los identificadores y el ciclo del
        caso, no los datos del viaje. La proyección por audiencia la aplica la
        lectura: el Cliente recibe la vista mínima (ADR 21 §6).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado: {$ref: "#/components/schemas/EstadoEmergencia"}
        origen:
          allOf: [{$ref: "#/components/schemas/OrigenActivacion"}]
          description: Solo para audiencia Interno.
        actor_real:
          type: string
          format: uuid
          nullable: true
          description: >-
            Sujeto que activó. Siempre se registra; solo se entrega a audiencia
            Interno.
        version_reclamo: {$ref: "#/components/schemas/VersionReclamo"}
        reclamo_activo:
          allOf: [{$ref: "#/components/schemas/Reclamo"}]
          nullable: true
          description: Reclamo vigente. Solo para audiencia Interno; null en el pool.
        activada_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        resuelta_en:
          type: string
          format: date-time
          nullable: true
        cerrada_en:
          type: string
          format: date-time
          nullable: true

    PaginaEmergencias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CasoEmergencia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.

    EmergenciaReaccion:
      type: object
      additionalProperties: false
      required: [id, estado, origen, version_reclamo, activada_en]
      description: >-
        El caso tal como lo ve Reacción en su bandeja (DEC-121 #2): SIN
        `viaje_id`, `cliente_id`, `actor_real` ni notas. Solo lleva lo que el
        caso ya registra. No reemplaza a `CasoEmergencia`, que sigue siendo la
        vista de monitoreo por viaje y la que `obtenerEmergencia` entrega al
        `bff` para componer el detalle.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado: {$ref: "#/components/schemas/EstadoEmergencia"}
        origen: {$ref: "#/components/schemas/OrigenActivacion"}
        version_reclamo:
          allOf: [{$ref: "#/components/schemas/VersionReclamo"}]
          description: >-
            Versión vigente del reclamo del caso; es la `version_esperada` para
            reclamar un caso que está en el pool (`reclamo_activo` null).
        reclamo_activo:
          allOf: [{$ref: "#/components/schemas/Reclamo"}]
          nullable: true
          description: >-
            Reclamo vigente (responsable y versión); null si el caso está en el
            pool.
        activada_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        resuelta_en:
          type: string
          format: date-time
          nullable: true
        cerrada_en:
          type: string
          format: date-time
          nullable: true

    PaginaBandejaEmergencias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      description: >-
        Página de la bandeja de Reacción. Misma paginación por cursor que las
        demás páginas de `mensajeria`; sin `revision` de colección (ver
        `listarBandejaEmergencias`).
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EmergenciaReaccion"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.

    PaginaNotasEmergencia:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      description: Página de notas de un caso (`listarNotasEmergenciaPorId`).
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/NotaEmergencia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.

    ActivarEmergenciaEntrada:
      type: object
      additionalProperties: false
      required: [activacion_id]
      properties:
        activacion_id:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/Id"}]
          description: >-
            Generado por el llamante; clave de idempotencia de la activación
            (ADR 21 §2). Reentregar el mismo valor devuelve el caso original.

    NotaEmergencia:
      type: object
      additionalProperties: false
      required: [id, emergencia_id, audiencia_autor, cuerpo, creado_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        emergencia_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        audiencia_autor: {$ref: "#/components/schemas/Audiencia"}
        actor_real:
          type: string
          format: uuid
          nullable: true
          description: Sujeto que escribió. Solo se entrega a audiencia Interno.
        cuerpo:
          type: string
          description: Contenido de la nota. Sin edición ni borrado en V1.
        es_resolucion:
          type: boolean
          description: true si es la nota que acompañó la resolución del caso.
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    NotaEmergenciaEntrada:
      type: object
      additionalProperties: false
      required: [cuerpo]
      properties:
        cuerpo:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Texto de la nota. El servidor recorta espacios de inicio y fin; si
            queda vacío tras el recorte, responde 400 y no la guarda.

    ResolucionEmergenciaEntrada:
      type: object
      additionalProperties: false
      required: [version_esperada, nota]
      properties:
        version_esperada: {$ref: "#/components/schemas/VersionReclamo"}
        nota:
          type: string
          minLength: 1
          maxLength: 1000
          description: Nota de resolución obligatoria; mismas validaciones que las demás notas.

    RegistroAuditoria:
      type: object
      additionalProperties: false
      required: [id, conversacion_id, accion, actor_real, ocurrido_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        conversacion_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        accion:
          type: string
          description: >-
            Código de máquina de la acción auditada (Addendum §11). El catálogo
            de códigos no es contrato todavía.
        actor_real: {$ref: "_comunes.yaml#/components/schemas/Id"}
        motivo:
          type: string
          nullable: true
        ocurrido_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaAuditoria:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RegistroAuditoria"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.
