# =============================================================================
# contracts/openapi/identidad.yaml
# -----------------------------------------------------------------------------
# Superficie HTTP interna del servicio `identidad` para el tracer vertical.
# `identidad` es dueño del modelo de autorización y la fuente de verdad de la
# revocación de sesiones. La emisión de token delega la verificación de
# credencial en Cognito (addendum de identidad / DEC-031).
#
# OTP/MFA NO tiene endpoints propios: ADR 13 cerrado a favor de Cognito
# (DEC-031). El desafío de segundo factor lo genera y despacha el proveedor.
#
# Superficie de sesiones en PLURAL (`/api/v1/sesiones`): es la colección
# administrable de sesiones desde el servicio dueño. La superficie pública de
# `bff` usa `/api/v1/sesion` (singular) para la sesión propia del llamante.
# Ambas coexisten a propósito; ver README §"Sesión: dos superficies".
# =============================================================================
openapi: 3.0.3
info:
  title: AI27 — identidad
  version: 0.1.0-tracer.40
  description: >-
    Autenticación, sesión y alcance del tracer. Fuente de verdad de la
    revocación (evento `sesion.revocada`, ADR 26).
  x-ai27-servicio: identidad
  x-ai27-capa: catalogo
  x-ai27-tracer: true

servers:
- url: /
  description: Ruta base montada por el despliegue; los paths incluyen /api/v1.

security:
- bearerCognito: []

tags:
- name: sesiones
  description: Emisión, refresco, revocación y snapshot de revocación.
- name: gobierno
  description: >-
    Administración de sujetos, roles y alcance de monitoreo (E4-T6, E8-T19).
    Toda operación exige rol `administrador`, resuelto en servidor desde el
    token (nunca del cuerpo), salvo tres excepciones del `jefe_operativo`
    (DEC-140 #1, DEC-142 #2): lee `listarSujetos` solo con `rol=monitorista`,
    lee `obtenerAlcanceSujeto` solo de Monitoristas y escribe
    `fijarUnidadesSujeto`. El cambio se compromete en local (estado + traza +
    outbox) y el IdP se sincroniza después, de forma reintentable (DEC-085);
    por eso el fallo del IdP no revierte la operación ni se refleja como error
    de esta superficie.
- name: tenants
  description: >-
    Tenants de organización cliente (E8-T19, DEC-144). El tenant de un cliente
    tiene el mismo id que su `cliente_id` de `catalogos` (DEC-112); el `bff`
    escribe los dos lados con ese id. Toda operación exige rol `administrador`.

paths:
  /api/v1/sesiones:
    post:
      operationId: emitirSesion
      tags: [sesiones]
      summary: Emitir una sesión (login).
      description: >-
        Delega la verificación de credencial en Cognito y devuelve el token con
        los claims compuestos (rol, tenant/alcance, Audiencia, sesion_id).
      security: [] # pública: aún no hay token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredencialesEntrada"}
      responses:
        "201":
          description: Sesión emitida.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SesionEmitida"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/sesiones/refresh:
    post:
      operationId: refrescarSesion
      tags: [sesiones]
      summary: Refrescar una sesión.
      description: >-
        Punto donde los claims se REEVALÚAN desde el modelo vigente (ADR 16
        cerrado, DEC-031). `sesion_id` permanece estable durante todos los
        refresh de la misma sesión (ADR 26).
      security: [] # pública: el refresh usa el refresh token del cuerpo, no el access token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefrescoEntrada"}
      responses:
        "200":
          description: Sesión refrescada con claims recompuestos.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SesionEmitida"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/sesiones/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: sesion_id propio de AI27.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    delete:
      operationId: revocarSesion
      tags: [sesiones]
      summary: Revocar una sesión (logout o revocación administrativa).
      description: >-
        Operación de dos pasos: revoca en Cognito y compromete la revocación
        local con su evento `sesion.revocada` en la misma transacción.
      responses:
        "204": {description: Sesión revocada.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    get:
      operationId: obtenerSesion
      tags: [sesiones]
      summary: Estado durable de una sesión.
      description: >-
        Fuente durable de un sesion_id desde Postgres. Sólo se usa como fallback
        cuando la proyección local de revocación está obsoleta; no es ruta normal.
      responses:
        "200":
          description: Estado durable de la sesión.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EstadoSesion"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/sesiones/revocadas:
    get:
      operationId: listarSesionesRevocadas
      tags: [sesiones]
      summary: Snapshot de tombstones de revocación + cursor.
      description: >-
        Snapshot de tombstones no expirados más un cursor consistente para que
        cada consumidor reconstruya su proyección y haga catch-up sin ventana
        (ADR 26). Consumido por los servicios protegidos, no por el navegador.
      parameters:
      - name: cursor
        in: query
        required: false
        description: Cursor de continuación; ausente para el snapshot inicial.
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de tombstones y cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaRevocaciones"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/sujetos:
    get:
      operationId: listarSujetos
      tags: [gobierno]
      summary: Listar y buscar sujetos, con filtros (B-2).
      description: >-
        Página de sujetos con su rol activo, paginada por cursor opaco. Los
        filtros se combinan (Y lógico). `q` busca por coincidencia parcial en
        `nombre` e `identificador_usuario`; un sujeto previo a tracer.40 que no
        tiene esos datos locales solo aparece sin `q`.
        Lee `administrador`. El `jefe_operativo` lee solo con `rol=monitorista`
        (para elegir Monitoristas en `/roster`, DEC-142 #2); sin ese filtro, o
        con otro rol, responde 403. Otro rol responde 403.
      parameters:
      - name: q
        in: query
        required: false
        description: Texto a buscar en nombre e identificador de usuario.
        schema: {type: string}
      - name: rol
        in: query
        required: false
        description: Solo sujetos cuyo rol activo es este.
        schema: {$ref: "_comunes.yaml#/components/schemas/Rol"}
      - name: tenant_id
        in: query
        required: false
        description: Solo sujetos de este tenant (para un cliente, su organización).
        schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
      - name: activo
        in: query
        required: false
        description: true para solo activos, false para solo desactivados; ausente, ambos.
        schema: {type: boolean}
      - name: cursor
        in: query
        required: false
        description: Cursor de continuación; ausente para la primera página.
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de sujetos y cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaSujetos"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    post:
      operationId: altaSujeto
      tags: [gobierno]
      summary: Alta de un sujeto con su rol inicial.
      description: >-
        Crea el usuario en el IdP y el `sujeto` local con su rol inicial en una
        sola transacción local, publicando `sujeto.creado` y `rol.asignado`.
        Desde tracer.40 el `sujeto` guarda además una copia local de `nombre` e
        `identificador_usuario` para listar y buscar (B-2, B-15); el IdP sigue
        siendo dueño de la credencial.
        Restringida a `administrador` (403 si no lo es).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AltaSujetoEntrada"}
      responses:
        "201":
          description: Sujeto creado con su rol inicial.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sujeto"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/sujetos/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: sujeto_id propio de AI27.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerSujeto
      tags: [gobierno]
      summary: Detalle de un sujeto y su rol activo.
      description: Lectura restringida a `administrador` (G-10).
      responses:
        "200":
          description: Detalle del sujeto.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SujetoDetalle"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: editarSujeto
      tags: [gobierno]
      summary: Editar el nombre de un sujeto (B-8).
      description: >-
        Cambia el `nombre` en el `sujeto` local y en el IdP (este último por la
        sincronización reintentable de DEC-085). El identificador de acceso no
        se edita en V1 (DEC-139 #5). Restringida a `administrador` (403 si no
        lo es).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EdicionSujetoEntrada"}
      responses:
        "200":
          description: Sujeto con su nombre nuevo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SujetoDetalle"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    delete:
      operationId: desactivarSujeto
      tags: [gobierno]
      summary: Desactivar un sujeto (retiro de acceso).
      description: >-
        Marca el sujeto inactivo, revoca su sesión viva (corte ≤30 s, G-6) y
        publica `sujeto.desactivado`. La revocación de la sesión viva es parte
        de la operación, no un paso best-effort: si falla, la desactivación
        falla y el sujeto sigue activo. Un administrador puede desactivarse a
        sí mismo mientras quede otro administrador activo (DEC-139 #3).
        Restringida a `administrador` (403 si no lo es).
      responses:
        "204": {description: Sujeto desactivado.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            `codigo` de máquina `ultimo_administrador` si dejaría al sistema
            sin administrador activo (G-7, DEC-139 #3).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/sujetos/{id}/reactivacion:
    parameters:
    - name: id
      in: path
      required: true
      description: sujeto_id propio de AI27.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: reactivarSujeto
      tags: [gobierno]
      summary: Reactivar un sujeto desactivado (otorgamiento).
      description: >-
        Habilita el sujeto en el IdP y lo marca activo de nuevo, publicando
        `sujeto.reactivado` (hecho propio, no reusa `sujeto.creado`).
      responses:
        "204": {description: Sujeto reactivado.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/sujetos/{id}/historial:
    parameters:
    - name: id
      in: path
      required: true
      description: sujeto_id propio de AI27.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarHistorialSujeto
      tags: [gobierno]
      summary: Historial de cambios administrativos de un sujeto.
      description: >-
        Traza inmutable (`cambio_identidad`) ordenada por tiempo descendente,
        paginada por cursor opaco. Restringida a `administrador`.
      parameters:
      - name: cursor
        in: query
        required: false
        description: Cursor de continuación; ausente para la primera página.
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de cambios y cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaHistorial"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/sujetos/{id}/rol:
    parameters:
    - name: id
      in: path
      required: true
      description: sujeto_id propio de AI27.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    put:
      operationId: fijarRolSujeto
      tags: [gobierno]
      summary: Asignar el rol inicial o reemplazar el rol activo de un sujeto.
      description: >-
        Única vía para fijar el rol. Si el sujeto no tiene rol activo, lo asigna
        (`rol.asignado`); si ya tiene uno, lo reemplaza en una sola transacción
        (`rol.revocado` + `rol.asignado`). No existe revocar un rol suelto (C2).
        Al cambiar de rol se retira, en la misma transacción y con su traza, el
        alcance del rol anterior: unidades, Monitoristas o Supervisores
        asignados, y su lugar bajo un superior (DEC-140 #3). El retiro aplica de
        inmediato; el rol nuevo, en el siguiente refresco (DEC-091).
        Restringida a `administrador` (403 si no lo es).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AsignacionRolEntrada"}
      responses:
        "204": {description: Rol fijado.}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403":
          description: >-
            `codigo` de máquina `autoescalamiento` si el actor intenta cambiar
            su propio rol (E4-HU-018). Un actor que no es `administrador`
            también recibe 403.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            `codigo` de máquina: `rol_igual` si el rol nuevo es igual al
            activo; `sujeto_desactivado` si el sujeto está desactivado;
            `ultimo_administrador` si dejaría al sistema sin administrador
            activo (G-7); `rol_cruza_audiencia` si el cambio va de `cliente` a
            un rol interno o al revés (DEC-141 #1).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/sujetos/{id}/revocaciones:
    parameters:
    - name: id
      in: path
      required: true
      description: sujeto_id propio de AI27.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: revocarSesionesSujeto
      tags: [gobierno]
      summary: Revocar las sesiones vivas de un sujeto, con motivo (B-5).
      description: >-
        Revocación administrativa por sujeto (E4-HU-020). Revoca todas las
        sesiones vivas del sujeto; con DEC-138 hay a lo sumo una. Publica un
        `sesion.revocada` por sesión revocada, igual que `revocarSesion`. El
        `motivo` es obligatorio y texto libre (DEC-139 #1): se guarda en la
        auditoría local de `identidad` y no viaja en el evento. Sin `motivo`, o
        vacío, responde 400. El sujeto sigue activo; para retirarle el acceso
        se usa `desactivarSujeto`. Sin sesiones vivas responde 200 con
        `sesiones_revocadas` en 0. Restringida a `administrador` (403 si no lo
        es). No reemplaza a `revocarSesion`, que revoca por `sesion_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevocacionSesionesEntrada"}
      responses:
        "200":
          description: Revocación hecha; cuántas sesiones se revocaron.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RevocacionSesionesResultado"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/sujetos/{id}/alcance:
    parameters:
    - name: id
      in: path
      required: true
      description: sujeto_id propio de AI27.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerAlcanceSujeto
      tags: [gobierno]
      summary: Alcance de monitoreo de un sujeto (B-4).
      description: >-
        Devuelve las unidades asignadas al sujeto ("mis unidades", si es
        Monitorista), sus subordinados directos (Monitoristas de un Supervisor
        o Supervisores de un Coordinador) y sus unidades efectivas: la unión de
        las suyas y las de sus subordinados por la jerarquía (DEC-140 #2). Un
        rol sin alcance devuelve las tres listas vacías. Lee `administrador`. El
        `jefe_operativo` lee solo el alcance de un Monitorista (DEC-142 #2); el
        de un sujeto con otro rol le responde 403. Otro rol responde 403.
      responses:
        "200":
          description: Alcance del sujeto.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlcanceSujeto"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/sujetos/{id}/alcance/unidades:
    parameters:
    - name: id
      in: path
      required: true
      description: sujeto_id propio de AI27.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    put:
      operationId: fijarUnidadesSujeto
      tags: [gobierno]
      summary: Fijar las unidades de un Monitorista ("mis unidades").
      description: >-
        Reemplaza el conjunto completo de unidades del Monitorista por el que
        llega, así que repetir la misma petición no cambia nada (idempotente);
        quitar una unidad es enviarla fuera de la lista. Una unidad puede estar
        a la vez en la lista de varios Monitoristas (DEC-145 #1). `unidad_id`
        es id de `operacion`: `identidad` no lo valida contra el roster (sin FK
        entre módulos); la existencia la valida el `bff`. Escriben
        `administrador` y `jefe_operativo` (DEC-140 #1, DEC-142 #2); otro rol
        responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnidadesSujetoEntrada"}
      responses:
        "204": {description: Unidades fijadas.}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            `codigo` de máquina `rol_sin_alcance` si el sujeto no tiene rol
            activo `monitorista`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/sujetos/{id}/alcance/subordinados:
    parameters:
    - name: id
      in: path
      required: true
      description: sujeto_id del superior (Supervisor o Coordinador).
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    put:
      operationId: fijarSubordinadosSujeto
      tags: [gobierno]
      summary: Fijar los subordinados directos de un Supervisor o Coordinador.
      description: >-
        Reemplaza el conjunto completo de subordinados del superior por el que
        llega (idempotente); quitar uno es enviarlo fuera de la lista. Un
        Supervisor tiene Monitoristas y un Coordinador tiene Supervisores
        (DEC-140 #2). La jerarquía es exclusiva: cada subordinado tiene a lo
        sumo un superior (DEC-145 #2); para moverlo, primero se quita de su
        superior actual. Un id de subordinado que no existe responde 400.
        Escribe solo `administrador` (DEC-140 #2); otro rol responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubordinadosSujetoEntrada"}
      responses:
        "204": {description: Subordinados fijados.}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            `codigo` de máquina: `rol_sin_alcance` si el superior no tiene rol
            activo `supervisor` ni `coordinador`; `subordinado_rol_invalido` si
            algún subordinado no tiene el rol que corresponde (`monitorista`
            bajo un Supervisor, `supervisor` bajo un Coordinador);
            `subordinado_con_superior` si algún subordinado ya tiene otro
            superior (DEC-145 #2).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/tenants:
    get:
      operationId: listarTenants
      tags: [tenants]
      summary: Listar tenants con su conteo de usuarios activos (B-3).
      description: >-
        Página de tenants, internos y de cliente, paginada por cursor opaco.
        `usuarios_activos` cuenta los sujetos activos del tenant. Restringida a
        `administrador` (403 si no lo es).
      parameters:
      - name: cursor
        in: query
        required: false
        description: Cursor de continuación; ausente para la primera página.
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de tenants y cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaTenants"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/tenants/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: >-
        Id del tenant. Para una organización cliente es su `cliente_id` de
        `catalogos` (DEC-112); lo elige quien llama (DEC-144 #2).
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    put:
      operationId: crearTenant
      tags: [tenants]
      summary: Crear el tenant de una organización cliente, idempotente por id.
      description: >-
        Crea un tenant de tipo `cliente`, activo, con el id de la ruta
        (DEC-144 #2). Si ya existe un tenant `cliente` con ese id, no lo
        modifica y responde 200 con el tenant guardado: así un alta de
        organización que falló a la mitad se completa reintentando con el mismo
        id. Si el id es del tenant interno responde 409. Restringida a
        `administrador` (403 si no lo es).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantEntrada"}
      responses:
        "200":
          description: El tenant ya existía; se devuelve sin cambios.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        "201":
          description: Tenant creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}
    delete:
      operationId: desactivarTenant
      tags: [tenants]
      summary: Desactivar el tenant de una organización cliente (terminal).
      description: >-
        Marca el tenant inactivo. Es terminal: no hay reactivación en V1
        (DEC-139 #4). Sus sujetos pierden el acceso en el siguiente refresco
        de su sesión, porque la composición de claims rechaza el refresco de un
        sujeto de tenant inactivo; no hay revocación masiva en vivo (DEC-139
        #4, DEC-144 #2). Desactivar uno ya inactivo responde 204 (idempotente),
        para que el `bff` pueda reintentar. El tenant interno no se desactiva
        (409). Restringida a `administrador` (403 si no lo es).
      responses:
        "204": {description: Tenant desactivado.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

components:
  schemas:
    CredencialesEntrada:
      type: object
      additionalProperties: false
      required: [usuario, contrasena]
      properties:
        usuario:
          type: string
          description: Identificador de acceso del sujeto (según Cognito).
        contrasena:
          type: string
          format: password
          description: >-
            Credencial. AI27 no la custodia: se delega a Cognito. No se registra
            ni se refleja en logs (E0-T3).
        segundo_factor:
          type: string
          nullable: true
          description: >-
            Código del segundo factor (TOTP de 6 dígitos). Obligatorio en V1
            para todo rol (E4-HU-017): `identidad` rechaza un factor ausente,
            vacío o solo con espacios con el mismo 401 uniforme que una
            credencial inválida, sin llamar al IdP (DEC-094). El schema lo
            conserva opcional y nullable por compatibilidad; la obligatoriedad
            es de comportamiento. El IdP (Keycloak) valida el código; AI27
            identidad solo lo transporta.
            Ver DEC-031 (ADR 13), DEC-065 (A-3), DEC-087 (A-15) y DEC-094.

    RefrescoEntrada:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Token de refresco emitido por el proveedor.

    SesionEmitida:
      type: object
      additionalProperties: false
      required: [sesion_id, access_token, expira_en]
      properties:
        sesion_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Identificador de sesión propio de AI27, estable entre refrescos.
        access_token:
          type: string
          description: JWT verificado localmente por cada servicio contra el JWKS.
        refresh_token:
          type: string
          description: Token de refresco, cuando el flujo lo entrega.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    EstadoSesion:
      type: object
      additionalProperties: false
      required: [sesion_id, revocada, expira_en]
      properties:
        sesion_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        revocada:
          type: boolean
          description: true si la sesión está revocada de forma durable.
        revocada_en:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    Revocacion:
      type: object
      additionalProperties: false
      required: [sesion_id, revocada_en, expira_en]
      description: >-
        Tombstone de revocación. Coincide en forma con el payload del evento
        `sesion.revocada` (contracts/events).
      properties:
        sesion_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        revocada_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaRevocaciones:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Revocacion"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    AltaSujetoEntrada:
      type: object
      additionalProperties: false
      required: [nombre, identificador_usuario, rol, tenant_id]
      description: >-
        Alta de un sujeto con su rol inicial (E4-HU-018). El actor y su
        autorización NO viajan aquí: se resuelven en servidor desde el token.
      properties:
        nombre:
          type: string
          description: Nombre del usuario.
        identificador_usuario:
          type: string
          description: Identificador de acceso del sujeto (correo o usuario).
        rol: {$ref: "_comunes.yaml#/components/schemas/Rol"}
        tenant_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: >-
            Tenant del sujeto. Para `cliente` lo determina su organización;
            para los roles internos es el tenant interno de AI27 (G-9).

    Sujeto:
      type: object
      additionalProperties: false
      required: [id, tenant_id, activo]
      description: >-
        Sujeto dentro de un tenant. identidad no custodia credenciales; el
        `idp_subject` es el subject OIDC opaco del IdP (DEC-072, `sub` ≠ `id`).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        idp_subject:
          type: string
          description: Subject OIDC opaco del IdP. No es la credencial ni el `id`.
        tenant_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        activo:
          type: boolean
          description: false si el sujeto está desactivado (retiro de acceso).
        nombre:
          type: string
          description: >-
            Nombre del usuario, copia local desde tracer.40 (B-15). Opcional:
            un sujeto dado de alta antes no lo tiene.
        identificador_usuario:
          type: string
          description: >-
            Identificador de acceso (correo o usuario), copia local desde
            tracer.40 (B-15). Inmutable en V1 (DEC-139 #5). Opcional: un sujeto
            dado de alta antes no lo tiene.

    SujetoDetalle:
      type: object
      additionalProperties: false
      required: [sujeto, tiene_rol]
      description: Detalle de un sujeto con su rol activo, si tiene uno.
      properties:
        sujeto: {$ref: "#/components/schemas/Sujeto"}
        tiene_rol:
          type: boolean
          description: false si el sujeto no tiene rol activo; entonces `rol` se omite.
        rol:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Rol"]
          description: Rol activo del sujeto. Ausente si `tiene_rol` es false.

    AsignacionRolEntrada:
      type: object
      additionalProperties: false
      required: [rol]
      description: >-
        Rol a fijar en el sujeto. Si no tiene rol activo lo asigna; si ya tiene,
        lo reemplaza. El actor se resuelve en servidor desde el token.
      properties:
        rol: {$ref: "_comunes.yaml#/components/schemas/Rol"}

    PaginaSujetos:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SujetoDetalle"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más páginas.

    EdicionSujetoEntrada:
      type: object
      additionalProperties: false
      required: [nombre]
      description: >-
        Datos editables del sujeto. Solo el nombre: el identificador de acceso
        no se edita en V1 (DEC-139 #5).
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre nuevo del usuario.

    RevocacionSesionesEntrada:
      type: object
      additionalProperties: false
      required: [motivo]
      description: Revocación administrativa de las sesiones de un sujeto (E4-HU-020).
      properties:
        motivo:
          type: string
          minLength: 1
          description: >-
            Motivo de la revocación, texto libre y obligatorio (DEC-139 #1). Se
            guarda en la auditoría local; no viaja en `sesion.revocada`.

    RevocacionSesionesResultado:
      type: object
      additionalProperties: false
      required: [sesiones_revocadas]
      properties:
        sesiones_revocadas:
          type: integer
          minimum: 0
          description: Cuántas sesiones vivas se revocaron. 0 si no tenía ninguna.

    AlcanceSujeto:
      type: object
      additionalProperties: false
      required: [unidades_ids, subordinados_ids, unidades_efectivas_ids]
      description: >-
        Alcance de monitoreo de un sujeto (DEC-140). El alcance no viaja en el
        token: se resuelve en servidor (DEC-053).
      properties:
        unidades_ids:
          type: array
          description: >-
            Unidades asignadas directamente ("mis unidades"). Solo un
            Monitorista tiene; vacía para otro rol. Ids de `operacion`.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        subordinados_ids:
          type: array
          description: >-
            Subordinados directos: Monitoristas de un Supervisor o Supervisores
            de un Coordinador. Vacía para otro rol.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        unidades_efectivas_ids:
          type: array
          description: >-
            Unión, sin repetidos, de `unidades_ids` y de las unidades de los
            subordinados por la jerarquía (DEC-140 #2). Para un Monitorista es
            igual a `unidades_ids`.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    UnidadesSujetoEntrada:
      type: object
      additionalProperties: false
      required: [unidades_ids]
      description: Conjunto completo de unidades del Monitorista; reemplaza al anterior.
      properties:
        unidades_ids:
          type: array
          description: Ids de unidades de `operacion`. Vacía para quitarle todas.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    SubordinadosSujetoEntrada:
      type: object
      additionalProperties: false
      required: [sujetos_ids]
      description: Conjunto completo de subordinados directos; reemplaza al anterior.
      properties:
        sujetos_ids:
          type: array
          description: Ids de sujeto de los subordinados. Vacía para quitarle todos.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    Tenant:
      type: object
      additionalProperties: false
      required: [id, nombre, tipo, activa, usuarios_activos]
      description: >-
        Espacio de pertenencia de un sujeto. Hay un tenant interno de AI27 y uno
        por organización cliente, con el id de su `cliente_id` (DEC-112).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        nombre: {type: string}
        tipo:
          type: string
          enum: [interno, cliente]
          description: >-
            `interno` para el tenant único de AI27; `cliente` para el de una
            organización cliente.
        activa:
          type: boolean
          description: >-
            false si la organización está desactivada (terminal, DEC-139 #4).
            Sus sujetos no pasan el siguiente refresco.
        usuarios_activos:
          type: integer
          minimum: 0
          description: Sujetos activos del tenant.

    TenantEntrada:
      type: object
      additionalProperties: false
      required: [nombre]
      description: Alta del tenant de una organización cliente. El id va en la ruta.
      properties:
        nombre:
          type: string
          minLength: 1

    PaginaTenants:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Tenant"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más páginas.
    CambioAdministrativo:
      type: object
      additionalProperties: false
      required: [tipo, sujeto_id, ocurrido_en]
      description: Una fila de la traza inmutable `cambio_identidad`.
      properties:
        tipo:
          type: string
          description: >-
            Nombre canónico del hecho registrado: `sujeto.creado`,
            `sujeto.desactivado`, `sujeto.reactivado`, `rol.asignado`,
            `rol.revocado`.
        sujeto_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tenant_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Opcional; ausente en cambios que no lo registran.
        actor_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Sujeto que ejecutó el cambio. Opcional en cambios de sistema.
        ocurrido_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaHistorial:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CambioAdministrativo"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más páginas.
