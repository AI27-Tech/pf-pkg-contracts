# =============================================================================
# contracts/openapi/bff.yaml
# -----------------------------------------------------------------------------
# ÚNICA superficie HTTP para el frontend. `bff` no tiene estado y no valida
# credenciales: delega en `identidad` y compone lecturas desde `operacion`.
#
# Superficie de sesión en SINGULAR (`/api/v1/sesion`): representa la sesión
# propia del llamante (login / refresh / logout del usuario actual). Contrasta
# con la superficie interna de `identidad` en plural (`/api/v1/sesiones`), que
# es la colección administrable. Las dos coexisten a propósito (ver README).
#
# E2 (hitos + ETA + incidencia curada) viaja por POLLING HTTP como transporte
# normal, no por SSE (ADR 27). La cadencia es configuración del cliente, no
# contrato. `/api/v1/viajes/{id}/tracking` es V2 y NO aparece en el tracer.
# =============================================================================
openapi: 3.0.3
info:
  title: AI27 — bff
  version: 0.1.0-tracer.39
  description: >-
    Superficie pública del tracer: sesión propia del llamante y lectura
    compuesta de viajes/hitos para los dos portales.


    Convenciones de acceso V1 (las aplica el servicio dueño; detalle en
    `mensajeria.yaml`). La audiencia Interno NO se acota por el tenant de quien
    pregunta: su límite es el rol (DEC-129). El Cliente sigue acotado a su
    empresa. Bandeja única de conversaciones por rol `ejecutivo` (DEC-127) y de
    emergencias por rol `reaccion` (DEC-130). `supervisor` y `coordinador`
    leen conversaciones y, en emergencias, ven bandeja, detalle y notas y
    liberan o transfieren, sin reclamar ni resolver (DEC-131, DEC-126).
  x-ai27-servicio: bff
  x-ai27-capa: borde
  x-ai27-tracer: true

servers:
- url: /
  description: Ruta base montada por el despliegue.

security:
- bearerCognito: []

tags:
- name: sesion
  description: Sesión propia del llamante (singular).
- name: viajes
- name: emergencias
- name: descarga
- name: bandejas
  description: >-
    Cola de trabajo de la bandeja compartida para audiencia interna (E8-T15 /
    DEC-103). Proyección espejo de `mensajeria`; cola única e implícita resuelta
    de los claims, sin `{id}` en la ruta.
- name: conversaciones
  description: >-
    Superficie interna de conversación para el pool (reclamo, transferencia,
    atención y recibos). Proyección espejo de `mensajeria` para audiencia
    interna; expone el estado canónico, el reclamo y el actor real (DEC-006
    invertido), a diferencia de la vista de cliente `conversacion`.
- name: mensajes
- name: reclamos
  description: >-
    Descarga del expediente de UN viaje para usuarios internos (E6-T3 / DEC-022
    #7). `bff` compone leyendo de `operacion` (fuente exacta y actual), no de
    `reportes` (analítico, eventualmente consistente).
- name: reportes
  description: >-
    Dashboard de monitoreo para audiencia interna (E6-HU-025 / E8-T17).
    Proyección espejo de `reportes`: mismos operationId, schemas y errores,
    reenviando a `reportes` con las guardas de rol/alcance del `bff`.
- name: adjuntos
  description: >-
    Evidencia del viaje para audiencia interna (E6-HU-027 / E8-T17). Proyección
    espejo de `operacion`: los bytes NO pasan por el `bff` (subida y descarga
    van a la URL de vida corta del almacenamiento de objetos); la auditoría de
    cada acceso la sigue escribiendo `operacion`.
- name: roster
  description: >-
    Roster de unidades para `/roster` (E8-T21 / DEC-142). Proyección espejo de
    `operacion`; entran `jefe_operativo` y `administrador`.
- name: recursos
  description: >-
    Vehículos y custodios para `/catalogos` (adelanto de E8-T16 / DEC-142 #6).
    Proyección espejo de `catalogos`; leen `jefe_operativo` y `administrador`,
    escribe solo `administrador`.

paths:
  /api/v1/sesion:
    post:
      operationId: iniciarSesion
      tags: [sesion]
      summary: Iniciar sesión (login).
      description: Delega en `identidad`; `bff` no valida credenciales.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredencialesEntrada"}
      responses:
        "201":
          description: Sesión iniciada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sesion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
    delete:
      operationId: cerrarSesion
      tags: [sesion]
      summary: Cerrar sesión (logout).
      description: Delega la revocación en `identidad`, que publica `sesion.revocada`.
      responses:
        "204": {description: Sesión cerrada.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/sesion/refresh:
    post:
      operationId: refrescarSesion
      tags: [sesion]
      summary: Refrescar la sesión propia.
      description: >-
        Punto donde los claims se reevalúan (fija la exposición máxima ante un
        cambio de permisos, ADR 26). Delega en `identidad`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefrescoEntrada"}
      responses:
        "200":
          description: Sesión refrescada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sesion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/viajes:
    post:
      operationId: crearViaje
      tags: [viajes]
      summary: Crear un viaje (cliente o Operación dentro de alcance).
      description: >-
        El cliente crea en `SOLICITADO`; Operación en `APROBADO` y puede asignar
        atómicamente para dejarlo `ASIGNADO` (DEC-026). El estado inicial lo fija
        el rol del token. `bff` reenvía a `operacion`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrearViajeEntrada"}
      responses:
        "201":
          description: Viaje creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeResumen"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}
    get:
      operationId: listarViajes
      tags: [viajes]
      summary: Listar viajes con filtros, por alcance.
      description: Alcance de flota para interno; alcance de tenant para cliente (P9, P10).
      parameters:
      - name: estado
        in: query
        required: false
        schema: {type: string}
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de viajes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaViajesResumen"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}

  /api/v1/viajes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: seguirViaje
      tags: [viajes]
      summary: Detalle/seguimiento compuesto del viaje (lectura de hitos V1).
      description: >-
        Lectura inicial y periódica de hitos V1 por POLLING HTTP (ADR 27). `bff`
        compone: hito de estado, ETA manual con marca `stale` e incidencia
        curada desde `operacion`. Para el cliente, la incidencia es la vista
        curada (categoría + estado), nunca el tipo interno (DEC-006).
      responses:
        "200":
          description: Vista compuesta del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeSeguimiento"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Descarga del expediente de UN viaje (E6-T3 / E6-HU-026). Solo usuarios
  # internos en V1 (DEC-022 #7). `bff` compone el expediente leyendo de
  # `operacion` (fuente exacta y actual), NUNCA de `reportes` (analítico y
  # eventualmente consistente). Autorización por mínimo privilegio: un operativo
  # solo descarga viajes de su alcance; un administrador, más ampliamente — el
  # rechazo por alcance ocurre antes de componer dato alguno. Cada descarga deja
  # un registro de auditoría (actor, viaje, momento). El expediente SOLO serializa
  # campos contratados de V1: no existe representación para cuenta espejo ni
  # `clave_amago` (DEC-009/DEC-039). Es descarga de UN viaje: la exportación de
  # listados es V2 (DEC-023), por eso no hay ruta de lote.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/descarga:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: descargarViaje
      tags: [descarga]
      summary: Descargar el expediente de un viaje (solo interno).
      description: >-
        Compone ficha técnica, histórico de bitácora y auditoría relevante del
        viaje en un expediente de exportación. Audiencia interna; un operativo
        fuera de su alcance recibe 403 antes de componer nada. Un viaje
        inexistente o fuera de alcance devuelve 404. Cada descarga exitosa deja
        un registro de auditoría (actor, viaje, momento; E1-T7): el rastro lo
        escribe `operacion` en su transacción vía `registrarDescargaViaje`, no el
        `bff` (que no tiene base de datos).
      responses:
        "200":
          description: Expediente del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DescargaViaje"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Superficie interna de avance del viaje (E8-T8 / E1-HU-005). Tres reenvíos a
  # `operacion` con las guardas de alcance/rol del `bff`; no añaden lógica de
  # dominio. Existen porque el frontend interno habla sólo con el `bff` y la
  # vista `seguirViaje` es deliberadamente la curada para cliente (hito colapsado
  # + ETA con `stale`, DEC-006): no trae el `estado` canónico ni las condiciones,
  # así que no sirve para derivar acciones desde la máquina de estados. La vista
  # interna y la curada coexisten a propósito, como la sesión singular/plural.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/detalle:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerViajeInterno
      tags: [viajes]
      summary: Detalle interno del viaje con estado canónico (audiencia interna).
      description: >-
        Reenvía a `operacion.obtenerViaje`. Devuelve el `estado` canónico (token
        de `EstadoViaje`, ADR 19) y las condiciones activas como dato separado,
        para que el frontend interno derive las acciones ofrecidas desde la
        máquina de estados generada. Audiencia interna: un usuario fuera del
        alcance del viaje recibe 403; un viaje inexistente o fuera de alcance, 404.
      responses:
        "200":
          description: Detalle interno del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeDetalle"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # Ficha técnica (E8-T12). Dos reenvíos a `operacion` con las guardas de
  # alcance/rol del `bff`. La ficha es editable e incremental (DEC-104); el `bff`
  # no añade lógica. La escolta se lee de la asignación, no de aquí (DEC-044).
  /api/v1/viajes/{id}/ficha:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerFicha
      tags: [viajes]
      summary: Leer la ficha técnica del viaje (audiencia interna).
      description: Reenvía a `operacion.obtenerFicha`.
      responses:
        "200":
          description: Ficha técnica del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FichaTecnica"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: guardarFicha
      tags: [viajes]
      summary: Guardar parcialmente la ficha técnica (audiencia interna).
      description: >-
        Reenvía a `operacion.guardarFicha`. Edición incremental: ningún campo
        obligatorio; colecciones por reemplazo (DEC-104).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FichaTecnicaEntrada"}
      responses:
        "200":
          description: Ficha actualizada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FichaTecnica"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/transiciones:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: transicionarViaje
      tags: [viajes]
      summary: Registrar una transición de estado validada (audiencia interna).
      description: >-
        Reenvía a `operacion.transicionarViaje`. La máquina de estados valida la
        arista en `operacion`; `bff` no replica el grafo. Devuelve el detalle
        interno ya recompuesto para refrescar la vista sin un segundo GET.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransicionEntrada"}
      responses:
        "200":
          description: Transición aplicada; detalle interno del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeDetalle"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Transición no permitida. `codigo` de máquina en el cuerpo:
            `transicion_no_permitida` (arista inexistente o carrera),
            `cierre_anticipado_solo_por_incidencia` (cierre desde `EN_TRANSITO`
            con motivo distinto de `por_incidencia`) o
            `cierre_anticipado_requiere_incidencia` (cierre anticipado sin
            `INCIDENCIA` abierta). La UI ramifica por el `codigo`, no por el
            `mensaje` (DEC-020 #6 / DEC-113).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  # ---------------------------------------------------------------------------
  # Transición del viaje para audiencia CLIENTE (E9-T7 / E1-HU-002 / DEC-111).
  # El portal cliente solo habla con el `bff`. Ruta y operationId PROPIOS, con
  # sufijo `Cliente` (patrón de la familia `emergencias`), separados de la
  # superficie interna `transicionarViaje`: aquella devuelve `ViajeDetalle`
  # (estado canónico + condiciones) que la vista de cliente oculta a propósito
  # (DEC-006), y acepta cualquier arista. Esta operación está acotada a lo que el
  # cliente origina: cancelar o rechazar su propio viaje. `operacion` sigue
  # siendo la única autoridad de transición y aplica el aislamiento por tenant
  # (un cliente solo su viaje, tenant=cliente DEC-112; viaje ajeno -> 404) y la
  # guarda de facultad (solo CANCELADO / RECHAZADO_POR_CLIENTE; otra arista ->
  # 403*); el `bff` filtra audiencia Cliente y reenvía. Devuelve la vista de
  # seguimiento del cliente (`ViajeSeguimiento`), no el detalle interno.
  # (*) Nota: en V1 `operacion` responde 401 a la arista no permitida porque la
  # plataforma aún no tiene un 403 propio; el contrato declara 403 por fidelidad
  # a la facultad. Alinear 401->403 es un pendiente (DEC-111, notas).
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/transiciones-cliente:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: transicionarViajeCliente
      tags: [viajes]
      summary: Cancelar o rechazar el viaje (audiencia cliente).
      description: >-
        Reenvía a `operacion.transicionarViaje` con audiencia Cliente. El cliente
        solo puede llevar SU viaje a `CANCELADO` (ya no lo quiere, hasta antes de
        la salida) o `RECHAZADO_POR_CLIENTE` (no acepta el servicio asignado),
        DEC-005/DEC-111. El `motivo` (campo `causa`) es OBLIGATORIO en ambas
        acciones (DEC-111, supera DEC-020 #7). El aislamiento por tenant y la
        máquina de estados se validan en `operacion`; el `bff` no replica el
        grafo. Devuelve la vista de seguimiento del cliente para refrescar sin un
        segundo GET; nunca el estado canónico ni las condiciones (DEC-006).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransicionEntrada"}
      responses:
        "200":
          description: Transición aplicada; vista de seguimiento del cliente.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeSeguimiento"}
        "400":
          description: >-
            Cuerpo inválido, o falta el `motivo` obligatorio al cancelar o
            rechazar (DEC-111).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403":
          description: >-
            El cliente pidió una arista que no le corresponde (solo `CANCELADO` o
            `RECHAZADO_POR_CLIENTE`), o el viaje está fuera de su alcance.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            Transición no permitida por la máquina de estados (p. ej. el viaje ya
            salió o ya es terminal). `codigo` de máquina `transicion_no_permitida`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/eta:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: fijarEta
      tags: [viajes]
      summary: Fijar el ETA estimado del viaje (captura manual, audiencia interna).
      description: >-
        Reenvía a `operacion.fijarEta`. En V1 el ETA es captura manual, no un
        cálculo (ADR 20 / DEC-007). No es un cambio de estado; sólo exige que el
        viaje no esté en un estado terminal. Devuelve el detalle interno
        recompuesto para refrescar la vista sin un segundo GET.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EtaEntrada"}
      responses:
        "200":
          description: ETA actualizado; detalle interno del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeDetalle"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            El viaje está en un estado terminal y no admite fijar ETA. `codigo`
            de máquina `viaje_en_estado_terminal` en el cuerpo.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/fecha-hora:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: completarFechaHora
      tags: [viajes]
      summary: Completar o editar la fecha/hora del servicio del viaje (audiencia interna).
      description: >-
        Reenvía a `operacion.completarFechaHora`. Escribe `fecha_hora_servicio`
        sobre un viaje ya creado para satisfacer la guarda de aprobación
        (`fecha_hora_servicio_definida`, DEC-010 #2): si el cliente no lo puso al
        crear, el operador lo completa antes de aprobar (E1-HU-003). No es un
        cambio de estado; sólo exige que el viaje no esté en un estado terminal.
        Devuelve el detalle interno recompuesto para refrescar la vista sin un
        segundo GET.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FechaHoraEntrada"}
      responses:
        "200":
          description: Fecha/hora del servicio actualizada; detalle interno del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViajeDetalle"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            El viaje está en un estado terminal y no admite editar la fecha/hora
            del servicio. `codigo` de máquina `viaje_en_estado_terminal` en el
            cuerpo.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/emergencias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarEmergenciasCliente
      tags: [emergencias]
      summary: Vista mínima de las emergencias del viaje para el cliente (ADR 21 §6).
      description: >-
        Reenvía a `mensajeria.listarEmergencias` con audiencia Cliente. Devuelve
        solo los casos en `abierta`, `en_atencion` o `resuelta`, identificados
        por fecha/hora, con un indicador agregado "emergencia activa". Nunca
        expone cuerpos de nota, contactos, recursos, actor interno ni personal
        de Reacción. Las acciones de atención de Reacción NO pasan por `bff`:
        son superficie interna de `mensajeria`.
      responses:
        "200":
          description: Vista mínima de emergencias del viaje para el cliente.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmergenciasCliente"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: activarEmergenciaCliente
      tags: [emergencias]
      summary: El cliente activa una emergencia sobre su viaje (idempotente).
      description: >-
        Reenvía a `mensajeria.activarEmergencia`. Idempotente por
        `activacion_id` del llamante. Un usuario fuera de alcance recibe 403
        antes de componer nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivarEmergenciaClienteEntrada"}
      responses:
        "201":
          description: Caso creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmergenciaCliente"}
        "200":
          description: Reentrega idempotente; caso original.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmergenciaCliente"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: "`codigo` de máquina `viaje_en_estado_terminal`."
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/emergencias/{eid}/notas:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: agregarNotaEmergenciaCliente
      tags: [emergencias]
      summary: El cliente agrega una nota a un caso de emergencia.
      description: >-
        Reenvía a `mensajeria.agregarNotaEmergencia`. Texto ≤1000, se recorta y
        no se guarda si queda vacío. Denegado si el caso está `cerrada`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotaEmergenciaClienteEntrada"}
      responses:
        "201": {description: Nota agregada.}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: "`codigo` de máquina `emergencia_cerrada`."
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  # ---------------------------------------------------------------------------
  # Conversación del viaje para audiencia CLIENTE (E9-T8 / E3-HU-014 / DEC-029).
  # El portal cliente habla solo con el `bff`. Ruta anclada al VIAJE, nunca al
  # `conversacion_id` (el cliente navega por viaje; la conversación se crea
  # dirigida por el evento del viaje, E3-T1). Patrón de la familia `emergencias`:
  # el `bff` reenvía a `mensajeria` con audiencia Cliente y recorta a un schema
  # `*Cliente` propio, que NUNCA expone `actor_real`, rol interno, reclamo,
  # bandeja ni pool (DEC-021: el cliente ve el alias "AI27 Operations", no al
  # operador real). El cliente ve el estado "atendido/resuelto" (DEC-014), no
  # recibos de lectura individuales. Entrega viva (SSE) fuera de alcance: V1 es
  # lectura HTTP + polling.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/conversacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerConversacionViaje
      tags: [conversacion]
      summary: Obtener la conversación del viaje (audiencia cliente).
      description: >-
        Reenvía a `mensajeria.obtenerConversacion` con audiencia Cliente,
        resolviendo la conversación por el viaje. Vista mínima del cliente: sin
        bandeja, reclamo, pool ni actor interno.
      responses:
        "200":
          description: Conversación del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversacionCliente"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/conversacion/mensajes:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarMensajesViaje
      tags: [conversacion]
      summary: Listar los mensajes de la conversación del viaje (audiencia cliente).
      description: >-
        Reenvía a `mensajeria.listarMensajes` con audiencia Cliente. Historia por
        secuencia de dominio; el cliente nunca ve `actor_real` ni el rol interno:
        solo `de_cliente` (true = cliente, false = AI27, alias "AI27 Operations").
        Se pagina por secuencia, no por cursor opaco: `antes_de` lee la historia
        hacia atrás y `despues_de` recupera lo nuevo tras reconexión (catch-up,
        Addendum §9 de mensajería). Son mutuamente excluyentes; sin ninguno,
        devuelve los más recientes.
      parameters:
      - name: antes_de
        in: query
        required: false
        description: Devuelve mensajes con secuencia menor a este valor.
        schema: {type: integer, format: int64, minimum: 0}
      - name: despues_de
        in: query
        required: false
        description: Devuelve mensajes con secuencia mayor a este valor.
        schema: {type: integer, format: int64, minimum: 0}
      - name: limite
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Página de mensajes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaMensajesCliente"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: enviarMensajeViaje
      tags: [conversacion]
      summary: Enviar un mensaje a la conversación del viaje (audiencia cliente).
      description: >-
        Reenvía a `mensajeria.enviarMensaje` con audiencia Cliente. Idempotente
        por `client_message_id` (reintentar el mismo devuelve el mensaje
        original). El cliente no envía `version_reclamo_esperada` ni
        `motivo_override` (son de la superficie interna).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnviarMensajeClienteEntrada"}
      responses:
        "201":
          description: Mensaje creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MensajeCliente"}
        "200":
          description: Reintento idempotente; mensaje original.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MensajeCliente"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            La conversación no admite escritura (venció la ventana tras el cierre
            del viaje, DEC-030/DEC-041). `codigo` de máquina
            `conversacion_solo_lectura`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  # ===========================================================================
  # SUPERFICIE INTERNA de bandeja y conversación (E8-T15, ola tracer.30).
  # Proyección espejo de `mensajeria` por la puerta única del `bff`: el frontend
  # interno habla SOLO con el `bff`, nunca con `mensajeria` directo. Mismos
  # operationId, schemas y códigos de error que `mensajeria`, con el `bff`
  # reenviando y aplicando sus guardas de alcance/rol; no añade lógica de
  # dominio (el reclamo versionado, el orden canónico y la ventana de escritura
  # viven en `mensajeria`). A diferencia de la familia `conversacion` de cliente
  # —vista recortada que oculta reclamo, bandeja y actor real (DEC-006)—, esta
  # superficie expone los schemas COMPLETOS: la audiencia interna sí ve el estado
  # canónico, el reclamo y el actor real (DEC-006 invertido). No se proyecta
  # `listarConversaciones` ni adjuntos ni auditoría en esta ola.
  # ---------------------------------------------------------------------------
  # DIVERGENCIA vs `mensajeria` (DEC-103): la cola de bandeja es ÚNICA e
  # IMPLÍCITA. La ruta NO lleva `{id}`: el `bff` resuelve la bandeja del sujeto
  # desde los claims de la sesión y reenvía a `mensajeria.listarTrabajoBandeja`;
  # el frontend no pasa identificador de bandeja.
  # ===========================================================================
  /api/v1/bandeja/trabajo:
    get:
      operationId: listarTrabajoBandeja
      tags: [bandejas]
      summary: Listar el trabajo de la bandeja del llamante (bootstrap y catch-up).
      description: >-
        El `bff` resuelve la bandeja del sujeto desde los claims de la sesión
        (cola única e implícita, DEC-103) y reenvía a
        `mensajeria.listarTrabajoBandeja`; el frontend no pasa id de bandeja.
        La bandeja única de chat la ven el rol `ejecutivo` (DEC-127) y, solo en
        lectura, `supervisor`/`coordinador` (DEC-131); otro rol recibe `404`
        (no tiene bandeja). Sin acotar por el tenant de quien pregunta
        (DEC-129).

        Sin `desde_revision` es el BOOTSTRAP: devuelve el trabajo actual y la
        `revision` de la colección (ADR 28 §2, §3). Con `desde_revision` es el
        CATCH-UP: devuelve los cambios de la colección posteriores a esa
        revisión. Si la revisión pedida quedó fuera de la ventana retenida,
        responde `409 stream_resync_required` y el cliente repite el bootstrap
        (ADR 28 §5). `desde_revision` y `cursor` de paginación son ortogonales.
      parameters:
      - name: cursor
        in: query
        required: false
        description: Cursor de paginación. No es el cursor de cambios de ADR 28.
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      - name: desde_revision
        in: query
        required: false
        description: >-
          Catch-up: devuelve los cambios de la colección con revisión mayor a
          este valor. Es la `revision` de una respuesta previa, no el cursor de
          paginación.
        schema: {$ref: "#/components/schemas/RevisionBandeja"}
      responses:
        "200":
          description: Trabajo de la bandeja con la revisión de la colección.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrabajoBandeja"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ResyncRequerido"}

  /api/v1/conversaciones/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerConversacion
      tags: [conversaciones]
      summary: Detalle de una conversación (estado inicial para bootstrap).
      description: >-
        Reenvía a `mensajeria.obtenerConversacion` con audiencia Interno. Leen el
        `ejecutivo` y, solo en lectura, `supervisor`/`coordinador` (DEC-131),
        sin acotar por el tenant de quien pregunta (DEC-129); otro rol interno
        recibe `403`. Poseer el UUID no autoriza (Addendum §7): una
        conversación inexistente responde 404. `ultima_secuencia` es el cursor
        de dominio del bootstrap (ADR 28 §2).
      responses:
        "200":
          description: Conversación.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversacion"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/conversaciones/{id}/mensajes:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarMensajes
      tags: [mensajes]
      summary: Historia de mensajes por secuencia canónica.
      description: >-
        Reenvía a `mensajeria.listarMensajes` con audiencia Interno. `antes_de`
        pagina la historia hacia atrás; `despues_de` es la recuperación tras
        reconexión y cierra huecos (Addendum §9). Son mutuamente excluyentes; sin
        ninguno, devuelve los más recientes. El orden es siempre por `secuencia`,
        nunca por `creado_en`. Mismo acceso que `obtenerConversacion`:
        `supervisor`/`coordinador` leen (DEC-131).
      parameters:
      - name: antes_de
        in: query
        required: false
        description: Devuelve mensajes con secuencia menor a este valor.
        schema: {$ref: "#/components/schemas/SecuenciaMensaje"}
      - name: despues_de
        in: query
        required: false
        description: Devuelve mensajes con secuencia mayor a este valor.
        schema: {$ref: "#/components/schemas/SecuenciaMensaje"}
      - name: limite
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Mensajes en orden ascendente de secuencia.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaMensajes"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: enviarMensaje
      tags: [mensajes]
      summary: Enviar un mensaje interno (idempotente por client_message_id).
      description: >-
        Reenvía a `mensajeria.enviarMensaje` con audiencia Interno. El interno
        requiere rol `ejecutivo`, RECLAMO ACTIVO y `version_reclamo_esperada`
        (Addendum §7); `supervisor`/`coordinador` solo leen y reciben `403`
        (DEC-131).
        Reintentar el mismo `client_message_id` devuelve el mensaje original con
        200 y nunca crea un segundo mensaje.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnviarMensajeInternaEntrada"}
      responses:
        "201":
          description: Mensaje creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Mensaje"}
        "200":
          description: Reintento idempotente; mensaje original.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Mensaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            `codigo` de máquina `conflicto_version_reclamo` (otro reclamo ganó
            o la versión cambió) o `conversacion_solo_lectura` (venció
            `escritura_hasta`, DEC-030/DEC-041).
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/conversaciones/{id}/reclamos:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: reclamarConversacion
      tags: [reclamos]
      summary: Reclamar la conversación con versión esperada.
      description: >-
        Reenvía a `mensajeria.reclamarConversacion`. Solo el rol `ejecutivo`
        (DEC-127); `supervisor`/`coordinador` reciben `403` (DEC-131). Dos
        reclamos concurrentes producen un ganador; el perdedor recibe 409
        `conflicto_version_reclamo` (Addendum §4 punto 5).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionEsperadaEntrada"}
      responses:
        "201":
          description: Reclamo abierto.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/conversaciones/{id}/reclamos/{rid}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: rid
      in: path
      required: true
      description: Identificador del reclamo.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    delete:
      operationId: liberarReclamo
      tags: [reclamos]
      summary: Liberar el reclamo y devolver el trabajo al pool.
      description: >-
        Reenvía a `mensajeria.liberarReclamo`. Lo hace el responsable; en V1 un
        `supervisor`/`coordinador` NO libera una conversación ajena (DEC-118) y
        recibe `403` (DEC-131).
      parameters:
      - name: version_esperada
        in: query
        required: true
        schema: {$ref: "#/components/schemas/VersionReclamo"}
      responses:
        "204": {description: Reclamo liberado.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/conversaciones/{id}/transferencias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: transferirConversacion
      tags: [reclamos]
      summary: Transferir la responsabilidad a otro miembro del pool.
      description: >-
        Reenvía a `mensajeria.transferirConversacion`. Lo hace el responsable;
        `supervisor`/`coordinador` reciben `403` (DEC-118, DEC-131). Cierra el
        reclamo anterior y abre el siguiente en UNA transacción: no hay ventana
        sin responsable ni con dos (Addendum §6).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransferenciaEntrada"}
      responses:
        "201":
          description: Reclamo nuevo del responsable destino.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/conversaciones/{id}/atendida:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: marcarAtendida
      tags: [reclamos]
      summary: Marcar la conversación como atendida por el responsable.
      description: >-
        Reenvía a `mensajeria.marcarAtendida`. Solo el responsable (DEC-117);
        `supervisor`/`coordinador` reciben `403` (DEC-131).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionEsperadaEntrada"}
      responses:
        "204": {description: Conversación atendida.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/conversaciones/{id}/recibos/entregado:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: registrarReciboEntregado
      tags: [mensajes]
      summary: Avanzar el cursor de entrega del llamante.
      description: >-
        Reenvía a `mensajeria.registrarReciboEntregado`.
        `supervisor`/`coordinador` solo leen y no registran recibos: `403`
        (DEC-131).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReciboEntrada"}
      responses:
        "204": {description: Cursor avanzado (o sin cambio si ya estaba más adelante).}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/conversaciones/{id}/recibos/leido:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: registrarReciboLeido
      tags: [mensajes]
      summary: Avanzar el cursor de lectura del llamante.
      description: >-
        Reenvía a `mensajeria.registrarReciboLeido`. Una vista incidental de un
        miembro no responsable no genera un "leído" visible al cliente
        (Addendum §8). `supervisor`/`coordinador` solo leen y no registran
        recibos: `403` (DEC-131).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReciboEntrada"}
      responses:
        "204": {description: Cursor avanzado (o sin cambio si ya estaba más adelante).}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ===========================================================================
  # EMERGENCIAS DEL MONITOREO por viaje (tracer.37, E8-T18, DEC-135). Desde el
  # panel del viaje el monitoreo lista los casos del viaje, activa uno y anota.
  # Solo audiencia Interno; el `bff` propaga el Bearer y `mensajeria` autoriza
  # por rol (misma regla que el panel de Reacción). El `bff` recorta el caso a
  # la fila mínima `EmergenciaViaje` y, al activar, rechaza el viaje terminal
  # antes de reenviar (DEC-135 #5). El alcance por unidad del monitoreo aún no
  # se aplica (DT-07): hoy el límite es el rol. Para cerrar se usa
  # `cerrarEmergenciaPorId` con el id que da esta lista.
  # ===========================================================================
  /api/v1/panel/viajes/{id}/emergencias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarEmergenciasViaje
      tags: [emergencias]
      summary: Casos de emergencia del viaje para el monitoreo (fila mínima).
      description: >-
        Solo audiencia Interno. Reenvía a `mensajeria.listarEmergencias` y
        recorta cada caso a `EmergenciaViaje` (id, estado, activada_en), sin
        notas, actor ni personal de Reacción (DEC-135 #1). Incluye todos los
        estados, también `cerrada`, del más antiguo al más reciente por
        `activada_en`. La ven `monitorista`, `supervisor`, `coordinador` y
        `administrador`; otro rol interno responde `403` (DEC-132).
      responses:
        "200":
          description: Casos del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaEmergenciasViaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    post:
      operationId: activarEmergenciaInterno
      tags: [emergencias]
      summary: El monitoreo activa una emergencia sobre el viaje (idempotente).
      description: >-
        Solo audiencia Interno. Activan `monitorista`, `supervisor` y
        `coordinador` (DEC-045 #9); otro rol interno responde `403`. El `bff`
        lee el viaje y, si está en `CERRADO`, `CANCELADO`, `RECHAZADO_POR_AI27`
        o `RECHAZADO_POR_CLIENTE`, responde 409 `viaje_en_estado_terminal` sin
        reenviar (DEC-135 #5; carrera en DT-16). Si no, reenvía a
        `mensajeria.activarEmergencia`, que registra origen `operacion` y deja
        el caso bajo la empresa del viaje (DEC-133). Idempotente por
        `activacion_id`: la reentrega devuelve el mismo caso con 200; una
        pulsación nueva con otro `activacion_id` crea otro caso con 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivarEmergenciaInternoEntrada"}
      responses:
        "201":
          description: Caso creado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmergenciaViaje"}
        "200":
          description: Reentrega idempotente; caso original.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmergenciaViaje"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: "`codigo` de máquina `viaje_en_estado_terminal`."
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/panel/viajes/{id}/emergencias/{eid}/notas:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: agregarNotaEmergenciaInterno
      tags: [emergencias]
      summary: El monitoreo agrega una nota a un caso de emergencia.
      description: >-
        Solo audiencia Interno. Reenvía a `mensajeria.agregarNotaEmergencia`.
        Anotan `monitorista`, `supervisor`, `coordinador` y `administrador`
        (DEC-135 #3); Reacción lee y no escribe (DEC-121 #4), y otro rol
        interno responde `403`. Texto de 1 a 1000 caracteres, se recorta;
        vacío tras recortar es 400. Admitida en `abierta`, `en_atencion` y
        `resuelta`; en `cerrada` responde 409 `emergencia_cerrada`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotaEmergenciaInternoEntrada"}
      responses:
        "201": {description: Nota agregada.}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: "`codigo` de máquina `emergencia_cerrada`."
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  # ===========================================================================
  # PANEL DE REACCIÓN: bandeja y caso por su propio id (tracer.34, DEC-028,
  # DEC-121). Proyección de la familia nueva de `mensajeria`
  # (`listarBandejaEmergencias`, `obtenerEmergencia`, `listarNotasEmergenciaPorId`
  # y las acciones `...PorId`): mismos operationId. Reacción no accede a las
  # acciones ni a la bitácora del viaje (DEC-028, E8-T18), así que estas rutas
  # no llevan `{id}` de viaje. Misma regla de audiencia que las rutas de panel
  # por viaje (`/api/v1/panel/viajes/{id}/emergencias...`, tracer.37):
  # solo audiencia Interno; el `bff` propaga el Bearer del usuario y
  # `mensajeria` autoriza por rol (DEC-130, DEC-131). El `bff` reenvía la vista de
  # `mensajeria` salvo en `obtenerEmergencia`, donde COMPONE el detalle con el
  # bloque de viaje (DEC-121 #2). Autorización por operación: ver la gemela en
  # `mensajeria.yaml`; el `bff` no valida rol.
  # ===========================================================================
  /api/v1/panel/emergencias:
    get:
      operationId: listarBandejaEmergencias
      tags: [emergencias]
      summary: Listar los casos de la bandeja de Reacción del llamante.
      description: >-
        Solo audiencia Interno. Reenvía a `mensajeria.listarBandejaEmergencias`:
        la bandeja única de emergencias (DEC-130), sin `{id}`. La ven el rol
        `reaccion`, miembro por su rol, y `supervisor`/`coordinador`, que ven
        todos los casos de la bandeja sin verificar mando (DEC-131; DT-06). Sin
        acotar por el tenant de quien pregunta (DEC-129). Otro rol interno
        responde `403` (DEC-132). Cada fila es `EmergenciaReaccion`, sin datos del
        viaje ni del cliente ni notas (DEC-121 #2). EXCLUYE los casos en
        `cerrada` y ordena del más antiguo al más reciente por `activada_en`
        (DEC-121 #3).
      parameters:
      - name: cursor
        in: query
        required: false
        description: Cursor de paginación.
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Casos de la bandeja de Reacción del llamante.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaBandejaEmergencias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/panel/emergencias/{eid}:
    parameters:
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerEmergencia
      tags: [emergencias]
      summary: Detalle del caso por su id, con la información del viaje que Reacción necesita.
      description: >-
        Solo audiencia Interno. Mismo acceso que `mensajeria.obtenerEmergencia`:
        rol `reaccion` (DEC-130), o `supervisor`/`coordinador` sobre cualquier
        caso sin verificar mando (DEC-131; DT-06). Poseer el UUID no autoriza:
        un caso inexistente responde `404`; otro rol recibe `403`.

        El `bff` COMPONE la respuesta: lee el caso de
        `mensajeria.obtenerEmergencia` (que trae `viaje_id`), el viaje de
        `operacion` y el nombre del cliente y la escolta de `catalogos`, y
        devuelve `DetalleEmergenciaReaccion`. Es la visibilidad tipo monitorista
        acotada al caso de DEC-028 #5: SIN `viaje_id`, bitácora, incidencias ni
        conversación. No concede acciones sobre el viaje.
      responses:
        "200":
          description: Caso con el bloque de viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DetalleEmergenciaReaccion"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/panel/emergencias/{eid}/notas:
    parameters:
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarNotasEmergenciaPorId
      tags: [emergencias]
      summary: Listar las notas del caso nombrado por su id (solo lectura).
      description: >-
        Solo audiencia Interno. Reenvía a `mensajeria.listarNotasEmergenciaPorId`.
        Mismo acceso que `obtenerEmergencia`: rol `reaccion` y
        `supervisor`/`coordinador` (DEC-130, DEC-131). Reacción CONSULTA las notas
        (DEC-028 #4) y no las escribe (DEC-034, DEC-121 #4): no hay ruta de
        escritura por id. Incluye la nota de resolución (`es_resolucion`).
        Orden de creación, de la más antigua a la más reciente.
      parameters:
      - name: cursor
        in: query
        required: false
        description: Cursor de paginación.
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Notas del caso.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaNotasEmergencia"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/panel/emergencias/{eid}/reclamos:
    parameters:
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: reclamarEmergenciaPorId
      tags: [emergencias]
      summary: Reclamar el caso por su id (abierta -> en_atencion) con versión esperada.
      description: >-
        Solo audiencia Interno. Reenvía a `mensajeria.reclamarEmergenciaPorId`.
        Solo un usuario con rol `reaccion` (DEC-130, DEC-028 #2); cualquier otro
        rol, `403`. `supervisor` y `coordinador` no reclaman (DEC-131). Solo
        procede si NADIE tiene el caso: con responsable vigente
        responde `409` aunque la versión sea la vigente (DEC-125). Dos reclamos
        concurrentes producen un ganador; el perdedor recibe 409
        `conflicto_version_reclamo`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionEsperadaEntrada"}
      responses:
        "201":
          description: Reclamo abierto; caso en atención.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/panel/emergencias/{eid}/reclamos/{rid}:
    parameters:
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: rid
      in: path
      required: true
      description: Identificador del reclamo.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    delete:
      operationId: liberarReclamoEmergenciaPorId
      tags: [emergencias]
      summary: Liberar el reclamo del caso por su id y devolverlo al pool de Reacción.
      description: >-
        Solo audiencia Interno. Reenvía a
        `mensajeria.liberarReclamoEmergenciaPorId`. En V1 lo hace el responsable
        vigente o CUALQUIER `supervisor`/`coordinador`, sin verificar el mando
        (DEC-126, DEC-131, atajo de DEC-099; DT-06). Un miembro de Reacción que no es el
        responsable, y cualquier otro rol, recibe `403`. El caso vuelve a
        `abierta`.
      parameters:
      - name: version_esperada
        in: query
        required: true
        schema: {$ref: "#/components/schemas/VersionReclamo"}
      responses:
        "204": {description: Reclamo liberado.}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/panel/emergencias/{eid}/transferencias:
    parameters:
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: transferirEmergenciaPorId
      tags: [emergencias]
      summary: Transferir el caso por su id a otro miembro de Reacción.
      description: >-
        Solo audiencia Interno. Reenvía a `mensajeria.transferirEmergenciaPorId`.
        En V1 la hace el responsable vigente (DEC-028 #2) o CUALQUIER
        `supervisor`/`coordinador`, sin verificar el mando (DEC-126, DEC-131; DT-06). Un
        miembro de Reacción que no es el responsable, y cualquier otro rol,
        recibe `403`. El destino debe tener rol `reaccion` (DEC-130). Cierra el
        reclamo anterior y abre el siguiente en UNA
        transacción; conserva el estado del caso.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransferenciaEntrada"}
      responses:
        "201":
          description: Reclamo nuevo del responsable destino.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reclamo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/panel/emergencias/{eid}/resolucion:
    parameters:
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: resolverEmergenciaPorId
      tags: [emergencias]
      summary: Resolver el caso por su id (en_atencion -> resuelta) con nota obligatoria.
      description: >-
        Solo audiencia Interno. Reenvía a `mensajeria.resolverEmergenciaPorId`.
        Solo el responsable vigente de Reacción (ADR 21 §5, DEC-028 #3);
        cualquier otro sujeto, incluido `supervisor`/`coordinador`, recibe
        `403`. Nota de resolución OBLIGATORIA de 1 a 1000
        caracteres; sin nota válida responde 400 y el caso no cambia de estado.
        `resuelta` es irreversible. Devuelve `EmergenciaReaccion`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolucionEmergenciaEntrada"}
      responses:
        "200":
          description: Caso resuelto, en la vista de Reacción.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmergenciaReaccion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  /api/v1/panel/emergencias/{eid}/cierre:
    parameters:
    - name: eid
      in: path
      required: true
      description: Identificador del caso de emergencia.
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: cerrarEmergenciaPorId
      tags: [emergencias]
      summary: Cerrar administrativamente el caso por su id (resuelta -> cerrada).
      description: >-
        Solo audiencia Interno. Reenvía a `mensajeria.cerrarEmergenciaPorId`.
        Solo Monitorista/Supervisor/Coordinador dentro del alcance del viaje del
        caso (eje de monitoreo por unidad), o Administrator global (ADR 21 §5).
        NUNCA Reacción ni Ejecutivo (E8-T18, DEC-045 #9, DEC-121 #5), tampoco
        por el mando de DEC-099: responden `403`. No exige texto. `cerrada` es
        irreversible.
      responses:
        "200":
          description: Caso cerrado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CasoEmergencia"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "#/components/responses/ConflictoVersion"}

  # ---------------------------------------------------------------------------
  # Selector de cliente para la creación de viaje por Operación (E8-T11 /
  # E1-HU-028 / DEC-026 #3-4). Proyección espejo de `catalogos.listarClientes`
  # por la puerta única; el frontend no llama a `catalogos` directo. El `bff`
  # reenvía con las guardas de alcance/rol del `jefe_operativo`: la lista queda
  # limitada a los clientes de su alcance (DEC-026 #3) y SOLO a los `activo`
  # (un cliente inactivo no es asignable a un viaje nuevo). El filtro de alcance
  # y de estado lo resuelve el servidor, no el frontend; un `cliente_id` fuera
  # de alcance se rechaza al crear. No se proyecta el parámetro `ids` de
  # `catalogos` (es la lectura por lote de `mensajeria`, no un selector).
  # ---------------------------------------------------------------------------
  /api/v1/clientes:
    get:
      operationId: listarClientes
      tags: [viajes]
      summary: Listar clientes seleccionables para crear un viaje (audiencia interna).
      description: >-
        Reenvía a `catalogos.listarClientes`. Devuelve los clientes `activo`
        dentro del alcance del `jefe_operativo` (DEC-026 #3): los fuera de
        alcance no se muestran, y asociar uno por `cliente_id` manipulado se
        rechaza al crear el viaje. Paginado por cursor. El frontend sólo consume
        la respuesta y envía el `cliente_id` elegido.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de clientes seleccionables.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaClientes"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  # ---------------------------------------------------------------------------
  # Catálogo de tipos de servicio para el wizard de solicitud del cliente
  # (E9-T4 / E1-HU-001). Proyección espejo de `catalogos.listarValoresCatalogo`
  # para el único tipo que el portal cliente necesita: `tipos_servicio`
  # (DEC-017: rutas/marcas/kit son texto libre, no catálogo). El `bff` NO expone
  # el `{tipo}` genérico al cliente: las otras familias (zonas_riesgo, etc.) son
  # operativas internas y no deben llegar al portal. Devuelve SOLO los valores
  # `activo` (un valor inactivo no es seleccionable), mismo criterio que
  # `listarClientes`. El cliente elige el `codigo` y lo manda en `tipo_servicio`
  # al crear el viaje.
  # ---------------------------------------------------------------------------
  /api/v1/catalogos/tipos-servicio:
    get:
      operationId: listarTiposServicio
      tags: [viajes]
      summary: Listar los tipos de servicio seleccionables (audiencia cliente).
      description: >-
        Reenvía a `catalogos.listarValoresCatalogo` con `tipo=tipos_servicio` y
        recorta a la vista mínima del selector: `codigo` y `etiqueta` de los
        valores `activo`. Paginado por cursor.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de tipos de servicio seleccionables.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaTiposServicio"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
  # Proyección espejo de `operacion` (asignarRecursos, listarUnidades): mismos
  # verbos, rutas y formas, expuestos por la puerta única del `bff`. El frontend
  # interno habla sólo con el `bff` y no puede llamar a `operacion` directo. El
  # `bff` reenvía con sus guardas de alcance/rol; no añade lógica de dominio: la
  # reserva atómica, la máquina de estados (APROBADO → ASIGNADO) y la aptitud
  # informativa (DEC-055, no gatea) viven en `operacion` (ADR 31 / DEC-026/043).
  # Reasignar (PATCH) es V2 para este consumidor: fuera de alcance de E8-T10.
  # ---------------------------------------------------------------------------
  /api/v1/viajes/{id}/asignacion:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerAsignacion
      tags: [viajes]
      summary: Escolta vigente del viaje, con sus unidades legibles (audiencia interna).
      description: >-
        Reenvía a `operacion.obtenerAsignacion` y compone cada unidad con el
        vehículo y los custodios legibles de `catalogos`, como `listarUnidades`
        (tracer.38). Es la lectura de la ficha técnica y del detalle del viaje:
        la escolta asignada a ESTE viaje, no el roster completo (DEC-142,
        E8-T12). Cualquier rol interno la lee; un actor Cliente recibe 404.
        `unidades` vacío con 200 si el viaje no tiene asignación vigente.
      responses:
        "200":
          description: Escolta vigente; `unidades` vacío si no hay asignación.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EscoltaVigente"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: asignarRecursos
      tags: [viajes]
      summary: Asignar la escolta (una o más unidades) en una escritura atómica (audiencia interna).
      description: >-
        Reenvía a `operacion.asignarRecursos`. Reserva la escolta —una o más
        `unidades` (paquetes vehículo + custodios) del roster— en una sola
        transacción (ADR 31): o se reservan todas, o ninguna. Al confirmar, el
        viaje pasa `APROBADO → ASIGNADO` (DEC-026). La aptitud es informativa y
        NO condiciona la asignación en V1 (DEC-055): no existe rechazo "no apto".
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AsignacionEntrada"}
      responses:
        "200":
          description: Asignación confirmada; el viaje queda `ASIGNADO`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asignacion"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Alguna unidad no está disponible en la ventana del viaje; sin reserva
            parcial. Único código de rechazo: `codigo` de máquina
            `recurso_no_disponible` (incluye la carrera contra otro jefe
            operativo; el dominio no la distingue, DEC-043). La aptitud nunca
            rechaza en V1 (DEC-055): no existe `recurso_no_apto`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/unidades:
    get:
      operationId: listarUnidades
      tags: [viajes]
      summary: Listar unidades del roster (audiencia interna).
      description: >-
        Reenvía a `operacion.listarUnidades`. El roster de `unidades` vive en
        `operacion` (ADR 31 §5 / ADR 33). Una `unidad` es un paquete pre-armado:
        un vehículo con uno o dos custodios, referidos por identificador. En V1
        la lectura del roster NO expone aptitud.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de unidades del roster.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaUnidades"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    # Sección `/roster` del Jefe Operativo (E8-T21 / DEC-142, tracer.39).
    # Proyección espejo de `operacion` (crearUnidad, obtenerUnidad,
    # modificarUnidad): mismos `operationId`, rutas y cuerpos. Solo audiencia
    # Interno; entran `jefe_operativo` y `administrador` (DEC-142 #3). Las
    # reglas del roster (exclusividad, reserva vigente, cantidad por tipo)
    # viven en `operacion`; el `bff` reenvía y preserva sus 400/403/404/409 y
    # su `codigo`. La respuesta es la `Unidad` del `bff`, con `vehiculo` y
    # `custodios` legibles compuestos desde `catalogos` (tracer.38).
    post:
      operationId: crearUnidad
      tags: [roster]
      summary: Crear una unidad del roster (audiencia interna).
      description: >-
        Solo audiencia Interno. Reenvía a `operacion.crearUnidad`. Crean
        `jefe_operativo` y `administrador` (DEC-142 #3). El `tipo` no se envía:
        se deriva del vehículo. El vehículo y los custodios no pueden estar en
        otra unidad activa (DEC-142 #4).
        Responde 400 si el vehículo o algún custodio no existe o está
        inactivo en `catalogos`, si hay custodios repetidos o si la cantidad
        de custodios no corresponde al tipo (patrulla: 1 o 2; moto: 1, ADR 31).
        Otro rol responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnidadEntrada"}
      responses:
        "201":
          description: Unidad creada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Exclusividad del roster (DEC-142 #4). `codigo` de máquina
            `vehiculo_en_otra_unidad` si el vehículo ya está en otra unidad
            activa, o `custodio_en_otra_unidad` si algún custodio lo está.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/unidades/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerUnidad
      tags: [roster]
      summary: Detalle de una unidad del roster (audiencia interna).
      description: >-
        Solo audiencia Interno. Reenvía a `operacion.obtenerUnidad`. Leen
        `jefe_operativo` y `administrador` (DEC-142 #3); otro rol responde 403.
      responses:
        "200":
          description: Unidad.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: modificarUnidad
      tags: [roster]
      summary: Modificar una unidad del roster, incluido activar/desactivar (audiencia interna).
      description: >-
        Solo audiencia Interno. Reenvía a `operacion.modificarUnidad`. Modifican
        `jefe_operativo` y `administrador` (DEC-142 #3). Activar o desactivar es
        cambiar `activa`. La exclusividad (DEC-142 #4) se revisa también al
        reactivar. Una unidad con reserva en un viaje no terminal no se edita ni
        se desactiva: primero se reasigna la escolta de ese viaje (DEC-142 #5).
       
        Responde 400 si el vehículo o algún custodio no existe o está
        inactivo en `catalogos`, si hay custodios repetidos o si la cantidad
        de custodios no corresponde al tipo (patrulla: 1 o 2; moto: 1, ADR 31).
        Otro rol responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnidadModificacion"}
      responses:
        "200":
          description: Unidad modificada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unidad"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: >-
            El cambio choca con el roster (DEC-142 #4 y #5). `codigo` de
            máquina: `vehiculo_en_otra_unidad` o `custodio_en_otra_unidad` si el
            vehículo o algún custodio ya está en otra unidad activa (también al
            reactivar); `unidad_con_reserva_vigente` si la unidad tiene una
            reserva en un viaje no terminal.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  # ===========================================================================
  # Vehículos y custodios de `/catalogos` (adelanto de E8-T16 / DEC-142 #6,
  # tracer.39). Proyección espejo de `catalogos`: mismos `operationId`, rutas y
  # formas. Solo audiencia Interno. Leen (`listar*`, `obtener*`)
  # `jefe_operativo` y `administrador`: el Jefe Operativo los necesita para
  # armar unidades en `/roster`. Escriben (`crear*`, `actualizar*`) solo
  # `administrador`. `catalogos` no revisa rol, así que la guarda de rol la
  # aplica el `bff` antes de reenviar. No se proyectan `ids` (lectura por lote
  # para servicios, no un selector; mismo criterio que `listarClientes`) ni
  # `a_fecha` (lectura probatoria, P8): la pantalla no los usa y agregarlos
  # después es aditivo.
  # ===========================================================================
  /api/v1/vehiculos:
    get:
      operationId: listarVehiculos
      tags: [recursos]
      summary: Listar vehículos de la flota (audiencia interna).
      description: >-
        Solo audiencia Interno. Reenvía a `catalogos.listarVehiculos`, paginado
        por cursor, con vehículos activos e inactivos (`catalogos` no filtra por
        estado). Leen `jefe_operativo` y `administrador`.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de vehículos.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaVehiculos"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    post:
      operationId: crearVehiculo
      tags: [recursos]
      summary: Alta de un vehículo (audiencia interna, solo administrador).
      description: >-
        Solo audiencia Interno. Reenvía a `catalogos.crearVehiculo`, que crea la
        versión 1. Escribe solo `administrador` (DEC-142 #6).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VehiculoEntrada"}
      responses:
        "201":
          description: Vehículo creado (versión 1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Vehiculo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/vehiculos/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerVehiculo
      tags: [recursos]
      summary: Vehículo vigente (audiencia interna).
      description: >-
        Solo audiencia Interno. Reenvía a `catalogos.obtenerVehiculo` y devuelve
        la versión vigente. Leen `jefe_operativo` y `administrador`.
      responses:
        "200":
          description: Vehículo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Vehiculo"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: actualizarVehiculo
      tags: [recursos]
      summary: Modifica un vehículo creando una nueva versión (audiencia interna, solo administrador).
      description: >-
        Solo audiencia Interno. Reenvía a `catalogos.actualizarVehiculo`, que no
        sobrescribe: crea la versión siguiente. Activar o desactivar es cambiar
        `estado`. Escribe solo `administrador` (DEC-142 #6).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VehiculoCambios"}
      responses:
        "200":
          description: Vehículo con su nueva versión.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Vehiculo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/custodios:
    get:
      operationId: listarCustodios
      tags: [recursos]
      summary: Listar custodios (audiencia interna).
      description: >-
        Solo audiencia Interno. Reenvía a `catalogos.listarCustodios`, paginado
        por cursor, con custodios activos e inactivos (`catalogos` no filtra por
        estado). Leen `jefe_operativo` y `administrador`.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de custodios.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaCustodios"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    post:
      operationId: crearCustodio
      tags: [recursos]
      summary: Alta de un custodio (audiencia interna, solo administrador).
      description: >-
        Solo audiencia Interno. Reenvía a `catalogos.crearCustodio`, que crea la
        versión 1. Escribe solo `administrador` (DEC-142 #6).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustodioEntrada"}
      responses:
        "201":
          description: Custodio creado (versión 1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Custodio"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/custodios/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerCustodio
      tags: [recursos]
      summary: Custodio vigente (audiencia interna).
      description: >-
        Solo audiencia Interno. Reenvía a `catalogos.obtenerCustodio` y devuelve
        la versión vigente. Leen `jefe_operativo` y `administrador`.
      responses:
        "200":
          description: Custodio.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Custodio"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: actualizarCustodio
      tags: [recursos]
      summary: Modifica un custodio creando una nueva versión (audiencia interna, solo administrador).
      description: >-
        Solo audiencia Interno. Reenvía a `catalogos.actualizarCustodio`, que no
        sobrescribe: crea la versión siguiente. Activar o desactivar es cambiar
        `estado`. Escribe solo `administrador` (DEC-142 #6).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustodioCambios"}
      responses:
        "200":
          description: Custodio con su nueva versión.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Custodio"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  # ===========================================================================
  # Histórico operativo del viaje (E8-T13 / DEC-105). Siete reenvíos a
  # `operacion` (bitácora, incidencias, estadías) con las guardas de alcance/rol
  # del `bff`; sin lógica de dominio. Son superficie INTERNA: la vista curada
  # para el cliente (`seguirViaje`/`IncidenciaCurada`, DEC-006) es otra cosa y no
  # se toca. `operationId` idénticos a `operacion`. Los `409`
  # (`condicion_ya_abierta`, `estadia_ya_cerrada`) y `403` se preservan.
  # ===========================================================================
  /api/v1/viajes/{id}/bitacora:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarBitacora
      tags: [viajes]
      summary: Listar entradas de bitácora del viaje (audiencia interna).
      description: Reenvía a `operacion.listarBitacora`.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de entradas.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaBitacora"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: registrarEntradaBitacora
      tags: [viajes]
      summary: Registrar una entrada de bitácora (append-only, audiencia interna).
      description: Reenvía a `operacion.registrarEntradaBitacora`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EntradaBitacoraEntrada"}
      responses:
        "201":
          description: Entrada registrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntradaBitacora"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/viajes/{id}/incidencias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarIncidencias
      tags: [viajes]
      summary: Listar incidencias del viaje (audiencia interna).
      description: >-
        Reenvía a `operacion.listarIncidencias`. Histórico append-only: incluye
        incidencias `en_atencion` y `resuelta`. `tipo_interno` crudo (audiencia
        interna); la vista curada al cliente la compone `bff` (DEC-006).
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de incidencias.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaIncidencias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: abrirIncidencia
      tags: [viajes]
      summary: Abrir una incidencia del viaje (audiencia interna).
      description: >-
        Reenvía a `operacion.abrirIncidencia`. El `tipo_interno` es el catálogo
        operativo interno; la vista curada al cliente la compone `bff` (DEC-006).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IncidenciaEntrada"}
      responses:
        "201":
          description: Incidencia abierta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incidencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409":
          description: >-
            Ya existe una condición `INCIDENCIA` abierta para este viaje.
            `codigo` `condicion_ya_abierta`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  /api/v1/viajes/{id}/incidencias/{iid}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: iid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: resolverIncidencia
      tags: [viajes]
      summary: Resolver una incidencia (audiencia interna).
      description: >-
        Reenvía a `operacion.resolverIncidencia`. Resolver es facultad de
        Supervisor/Coordinador: un rol sin ella recibe 403 (lo impone el
        servidor, no el esquema).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolucionIncidenciaEntrada"}
      responses:
        "200":
          description: Incidencia resuelta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incidencia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/estadias:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarEstadias
      tags: [viajes]
      summary: Listar estadías del viaje (audiencia interna).
      description: >-
        Reenvía a `operacion.listarEstadias`. La duración se deriva de
        `inicio`/`cierre`; no hay campo de duración ni `prolongada` (DEC-038).
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de estadías.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaEstadias"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: abrirEstadia
      tags: [viajes]
      summary: Abrir una estadía del viaje (audiencia interna).
      description: Reenvía a `operacion.abrirEstadia`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EstadiaEntrada"}
      responses:
        "201":
          description: Estadía abierta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Estadia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/viajes/{id}/estadias/{eid}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: eid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: cerrarEstadia
      tags: [viajes]
      summary: Cerrar una estadía del viaje (audiencia interna).
      description: Reenvía a `operacion.cerrarEstadia`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CierreEstadiaEntrada"}
      responses:
        "200":
          description: Estadía cerrada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Estadia"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409":
          description: La estadía ya está cerrada. `codigo` `estadia_ya_cerrada`.
          content:
            application/json:
              schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  # Catálogo de GPS (E8-T12). Reenvío a `catalogos.listarGps`; el selector de la
  # ficha solo recibe dispositivos activos (filtro en servidor, DEC-104 #5).
  /api/v1/gps:
    get:
      operationId: listarGps
      tags: [viajes]
      summary: Listar dispositivos GPS del catálogo (audiencia interna).
      description: Reenvía a `catalogos.listarGps`. Solo dispositivos activos.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de dispositivos GPS.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaGps"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  # ===========================================================================
  # Dashboard de monitoreo (E6-HU-025 / E6-T2 / E8-T17). Dos reenvíos a
  # `reportes` con las guardas de rol/alcance del `bff`; sin lógica de dominio.
  # `operationId`, schemas y errores idénticos a `reportes`. Autorización (DEC-022
  # #9, DEC-060): 200 para `monitorista`, `supervisor`, `coordinador` y
  # `administrador`; 403 para `jefe_operativo`, `ejecutivo`, `reaccion` y
  # `cliente`. Alcance por unidad (DEC-045): monitorista, sus unidades;
  # supervisor/coordinador, la unión de su alcance; administrador, global. El
  # filtro por unidad aún no se aplica de extremo a extremo (deuda DT-07). Se
  # conservan `proyeccion_al` y `stale`: un tablero atrasado se muestra como
  # atrasado (DEC-033). `reportes` no acota por tenant a la audiencia Interno
  # (DEC-129; su implementación en `pf-svc-reportes` va en ola aparte).
  # ===========================================================================
  /api/v1/reportes/viajes:
    get:
      operationId: reporteViajes
      tags: [reportes]
      summary: Reporte operativo de viajes por periodo y alcance (audiencia interna).
      description: >-
        Reenvía a `reportes.reporteViajes`. Sin `en_curso`, `desde` y `hasta`
        son obligatorios (400 si falta alguno). Con `en_curso=true` devuelve los
        viajes en estado no terminal sin importar su fecha de creación; `desde`
        y `hasta` son entonces opcionales y, si se mandan, se intersecan.
      parameters:
      - name: desde
        in: query
        required: false
        description: Inicio del periodo. Obligatorio salvo con `en_curso=true`.
        schema: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
      - name: hasta
        in: query
        required: false
        description: Fin del periodo. Obligatorio salvo con `en_curso=true`.
        schema: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
      - name: en_curso
        in: query
        required: false
        description: >-
          true devuelve solo los viajes en estado no terminal (E6-HU-025).
          Ausente o false no filtra por estado.
        schema: {type: boolean}
      responses:
        "200":
          description: Filas del reporte de viajes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReporteViajes"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/reportes/estados:
    get:
      operationId: reporteEstados
      tags: [reportes]
      summary: Distribución y tiempos de permanencia por estado (audiencia interna).
      description: Reenvía a `reportes.reporteEstados`.
      parameters:
      - name: desde
        in: query
        required: true
        schema: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
      - name: hasta
        in: query
        required: true
        schema: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
      responses:
        "200":
          description: Distribución por estado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReporteEstados"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  # ===========================================================================
  # Evidencia del viaje (E6-HU-027 / E6-T4 / E8-T17). Tres reenvíos a
  # `operacion` con las guardas de rol/alcance del `bff`. `operationId`, schemas
  # y errores idénticos a `operacion`. Los BYTES no pasan por el `bff`: la subida
  # y la descarga usan la URL de vida corta del almacenamiento de objetos. La
  # auditoría de cada acceso la sigue escribiendo `operacion` (el `bff` no tiene
  # base de datos). Autorización (DEC-022 #9, DEC-060): 200 para `monitorista`,
  # `supervisor`, `coordinador` (en su alcance por unidad) y `administrador`
  # (global); 403 para `jefe_operativo`, `ejecutivo`, `reaccion` y `cliente`. Un
  # usuario fuera de alcance recibe 403 antes de emitir ninguna URL.
  # ===========================================================================
  /api/v1/viajes/{id}/adjuntos:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: listarAdjuntos
      tags: [adjuntos]
      summary: Listar los adjuntos de un viaje con sus metadatos (audiencia interna).
      description: >-
        Reenvía a `operacion.listarAdjuntos`. No devuelve bytes. El
        `estado_escaneo` de cada adjunto se refresca releyendo esta lista
        (sondeo HTTP, ADR 27): no hay evento de empuje para el fin del escaneo.
        Un usuario fuera del alcance del viaje recibe 403 antes de listar nada.
      responses:
        "200":
          description: Adjuntos del viaje.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaAdjuntos"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/adjuntos/intenciones-subida:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    post:
      operationId: crearIntencionSubidaAdjunto
      tags: [adjuntos]
      summary: Intención de subida de un adjunto con autorización de vida corta.
      description: >-
        Reenvía a `operacion.crearIntencionSubidaAdjunto`. Los bytes NO pasan
        por el `bff`: el cliente los sube al almacenamiento de objetos con la URL
        devuelta. Un usuario fuera del alcance del viaje recibe 403 antes de
        emitir la intención.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntencionSubidaAdjuntoEntrada"}
      responses:
        "201":
          description: Intención creada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntencionSubidaAdjunto"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/viajes/{id}/adjuntos/{aid}/descarga:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    - name: aid
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: descargarAdjunto
      tags: [adjuntos]
      summary: Autorización de vida corta para descargar un adjunto (audiencia interna).
      description: >-
        Reenvía a `operacion.descargarAdjunto`. Devuelve una URL de vida corta
        del almacenamiento de objetos; los bytes NO pasan por el `bff`. Cada
        descarga la audita `operacion`. Un usuario fuera del alcance recibe 403
        antes de autorizar nada.
      responses:
        "200":
          description: Autorización de descarga.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DescargaAdjunto"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

components:
  responses:
    ConflictoVersion:
      description: >-
        La versión esperada del reclamo no coincide con la vigente. `codigo` de
        máquina `conflicto_version_reclamo`.
      content:
        application/json:
          schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

    ResyncRequerido:
      description: >-
        La `desde_revision` pedida quedó fuera de la ventana de cambios retenida
        de la colección: el catch-up incremental ya no es posible y el cliente
        debe repetir el bootstrap (ADR 28 §5). `codigo` de máquina
        `stream_resync_required`, el mismo que usa `realtime` ante una línea no
        reanudable; la respuesta no distingue la causa.
      content:
        application/json:
          schema: {$ref: "_comunes.yaml#/components/schemas/Error"}

  schemas:
    CredencialesEntrada:
      type: object
      additionalProperties: false
      required: [usuario, contrasena]
      properties:
        usuario: {type: string}
        contrasena:
          type: string
          format: password
        segundo_factor:
          type: string
          nullable: true
          description: >-
            Código del segundo factor (TOTP). Opcional en V1; requerido en V2+.
            El IdP (Keycloak) lo valida; `bff`/`identidad` sólo lo transportan.
            Espejo de `CredencialesEntrada.segundo_factor` de `identidad`
            (DEC-031/ADR 13, DEC-071).

    RefrescoEntrada:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: {type: string}

    Sesion:
      type: object
      additionalProperties: false
      required: [sesion_id, access_token, expira_en]
      properties:
        sesion_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        access_token: {type: string}
        refresh_token: {type: string}
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    CrearViajeEntrada:
      type: object
      additionalProperties: false
      required: [origen, destinos]
      properties:
        origen: {type: string}
        destinos:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [nombre]
            properties:
              nombre: {type: string}
              numero_envio: {type: string}
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio: {type: string}

    ViajeResumen:
      type: object
      additionalProperties: false
      required: [id, estado, origen]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          description: Token de estado tal como lo publica `operacion` (ADR 19).
        origen: {type: string}

    PaginaViajesResumen:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ViajeResumen"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Superficie interna del viaje (E8-T8). Espejo de las formas de
    #     `operacion` (ViajeDetalle, Viaje, CondicionAbierta, TransicionEntrada,
    #     EtaEntrada): mismos nombres y mismas formas, para que el consumidor
    #     migre por cambio de importación, no por reescritura. El `estado` es el
    #     token canónico como `string` (igual que ViajeResumen): el enum vive y
    #     se valida en `operacion`/`contracts/estados`, el `bff` no lo replica. ---
    ViajeDetalle:
      type: object
      additionalProperties: false
      required: [viaje, condiciones_activas]
      description: >-
        Detalle interno del viaje: estado canónico MÁS condiciones activas como
        dato separado. Un viaje puede estar `EN_TRANSITO` y con `INCIDENCIA`
        abierta a la vez. Espejo de `ViajeDetalle` de `operacion`.
      properties:
        viaje: {$ref: "#/components/schemas/ViajeInterno"}
        condiciones_activas:
          type: array
          description: Condiciones ortogonales abiertas (dato separado del estado).
          items: {$ref: "#/components/schemas/CondicionAbierta"}

    ViajeInterno:
      type: object
      additionalProperties: false
      required: [id, estado, origen, destinos, creado_en]
      description: >-
        Viaje con su estado canónico, tal como lo expone `operacion` (ADR 19).
        Los campos mínimos que el frontend interno necesita para derivar acciones
        y pintar el bucle multi-parada y el estado terminal.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          description: >-
            Token de estado canónico (`EstadoViaje`, ADR 19), tal como lo publica
            `operacion`. El `bff` no replica el enum; el frontend deriva las
            acciones con la máquina de estados generada.
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.
        origen: {type: string}
        destinos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nombre]
            properties:
              nombre: {type: string}
              numero_envio: {type: string}
              arribo:
                type: boolean
                description: Si la unidad arribó a este destino (DEC-012). Espejo de `Destino.arribo` de `operacion`.
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio:
          type: string
          nullable: true
          description: >-
            Tipo de servicio/monitoreo elegido por el cliente en la solicitud
            (DEC-010 #3). Solo lectura; el monitorista lo visualiza (DEC-104 #4).
            Espejo de `Viaje.tipo_servicio` de `operacion`.
        eta_estimado:
          type: string
          format: date-time
          nullable: true
          description: >-
            ETA estimado capturado a mano (ADR 20). Mismo formato que
            `MarcaTiempo`. null si no se ha fijado. El `bff` deriva `stale` sólo
            en la vista de cliente (`seguirViaje`), no aquí.
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    CondicionAbierta:
      type: object
      additionalProperties: false
      required: [tipo, abierta_en]
      description: Condición ortogonal abierta. Espejo de `CondicionAbierta` de `operacion`.
      properties:
        tipo:
          type: string
          enum: [INCIDENCIA, SIN_SENAL]
          description: Condición ortogonal al progreso. Nunca es un estado.
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    MotivoCierre:
      type: string
      description: >-
        Motivo del cierre del viaje (DEC-113). Catálogo cerrado de V1: `normal` o
        `por_incidencia`. Espejo de `MotivoCierre` de `operacion`.
      enum: [normal, por_incidencia]

    TransicionEntrada:
      type: object
      additionalProperties: false
      required: [a_estado]
      description: Entrada de una transición de estado. Espejo de `TransicionEntrada` de `operacion`.
      properties:
        a_estado:
          type: string
          description: >-
            Estado destino (token de `EstadoViaje`, ADR 19). Se valida contra la
            máquina de estados en `operacion`.
        causa:
          type: string
          description: >-
            Causa de la transición. Obligatoria cuando el destino la requiere;
            la validación fina vive en `operacion`.
        motivo_cierre:
          allOf: [{$ref: "#/components/schemas/MotivoCierre"}]
          description: >-
            Obligatorio al transicionar a `CERRADO` (E8-T14, DEC-113); ignorado en
            otras aristas. La validación vive en `operacion`.

    EtaEntrada:
      type: object
      additionalProperties: false
      required: [eta_estimado]
      description: Entrada para fijar el ETA. Espejo de `EtaEntrada` de `operacion`.
      properties:
        eta_estimado:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          description: ETA estimado a fijar (captura manual, ADR 20). Reemplaza el valor previo.

    FechaHoraEntrada:
      type: object
      additionalProperties: false
      required: [fecha_hora_servicio]
      description: Entrada para completar/editar la fecha/hora del servicio. Espejo de `FechaHoraEntrada` de `operacion`.
      properties:
        fecha_hora_servicio:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          description: Fecha/hora del servicio a completar o editar (E1-HU-003, DEC-010 #2). Reemplaza el valor previo.

    HitoCliente:
      type: object
      additionalProperties: false
      required: [estado]
      description: >-
        Hito de progreso presentado al cliente. `bff` colapsa el bucle
        multi-parada en un hito legible (mapeo estado→hito, E2-T2); no expone el
        enum completo de estados.
      properties:
        estado:
          type: string
          description: Token de estado subyacente (referencia técnica).
        etiqueta:
          type: string
          description: Etiqueta de hito para el cliente.

    IncidenciaCurada:
      type: object
      additionalProperties: false
      required: [categoria, estado, marca_tiempo]
      description: >-
        Vista curada de la incidencia para el cliente (DEC-006): categoría
        mapeada, estado y marca de tiempo. Nunca el tipo interno.
      properties:
        categoria:
          type: string
          description: Categoría curada (p. ej. "Incidencia de seguridad").
        estado:
          type: string
          enum: [en_atencion, resuelta]
        marca_tiempo: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        impacto_eta:
          type: string
          nullable: true
    ViajeSeguimiento:
      type: object
      additionalProperties: false
      required: [id, hito, incidencias]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        hito: {$ref: "#/components/schemas/HitoCliente"}
        eta:
          description: ETA estimado, no en vivo; con marca de obsolescencia (stale).
          type: object
          additionalProperties: false
          required: [valor, obsoleto]
          properties:
            valor: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
            obsoleto: {type: boolean}
          nullable: true
        incidencias:
          type: array
          items: {$ref: "#/components/schemas/IncidenciaCurada"}

    # --- Descarga del expediente de UN viaje (E6-T3). Composición de ficha +
    #     bitácora + auditoría relevante, leída de `operacion`. Solo campos
    #     contratados de V1: sin cuenta espejo ni `clave_amago` (DEC-009/039). ---
    DescargaViaje:
      type: object
      additionalProperties: false
      required: [viaje_id, ficha, bitacora, auditoria, generado_en]
      description: >-
        Expediente de exportación de un viaje. Lo compone `bff` leyendo de
        `operacion`. No contiene cuenta espejo ni `clave_amago` (no existen en
        el modelo V1, DEC-009/DEC-039).
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        ficha:
          $ref: "#/components/schemas/FichaTecnicaDescarga"
        bitacora:
          type: array
          description: Histórico de bitácora del viaje, ordenado por tiempo (append-only).
          items: {$ref: "#/components/schemas/EntradaBitacoraDescarga"}
        auditoria:
          type: array
          description: >-
            Auditoría relevante del viaje (sin exponer todo el detalle interno).
          items: {$ref: "#/components/schemas/RegistroAuditoriaDescarga"}
        generado_en:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          description: Momento en que `bff` compuso el expediente.

    FichaTecnicaDescarga:
      type: object
      additionalProperties: false
      required: [estado, origen, destinos]
      description: Ficha técnica del viaje tal como la expone `operacion` (E1-T5).
      properties:
        estado:
          type: string
          description: Token de estado del viaje (ADR 19).
        cliente_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.
        origen: {type: string}
        destinos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nombre]
            properties:
              nombre: {type: string}
              numero_envio: {type: string}
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio: {type: string}

    EntradaBitacoraDescarga:
      type: object
      additionalProperties: false
      required: [texto, autor, ts]
      properties:
        texto: {type: string}
        autor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    RegistroAuditoriaDescarga:
      type: object
      additionalProperties: false
      required: [entidad, actor, ts]
      properties:
        entidad: {type: string}
        actor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    # --- Vista mínima de emergencia para el cliente (ADR 21 §6). Nunca cuerpos
    #     de nota, contactos, recursos ni personal de Reacción. ---
    EmergenciaCliente:
      type: object
      additionalProperties: false
      required: [id, estado, activada_en]
      description: >-
        Caso de emergencia tal como lo ve el cliente: identificado por fecha/hora
        y estado, sin detalles internos. `cerrada` no aparece en la lista
        (ADR 21 §6).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          enum: [abierta, en_atencion, resuelta]
          description: El cliente no distingue `abierta` de `en_atencion` salvo por este valor.
        activada_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    EmergenciasCliente:
      type: object
      additionalProperties: false
      required: [emergencia_activa, casos]
      properties:
        emergencia_activa:
          type: boolean
          description: >-
            Indicador agregado: true mientras exista al menos un caso en
            `abierta` o `en_atencion` (ADR 21 §6). `resuelta` no lo sostiene.
        casos:
          type: array
          description: Casos en `abierta`, `en_atencion` o `resuelta`, por fecha/hora.
          items: {$ref: "#/components/schemas/EmergenciaCliente"}

    ActivarEmergenciaClienteEntrada:
      type: object
      additionalProperties: false
      required: [activacion_id]
      properties:
        activacion_id:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/Id"}]
          description: Clave de idempotencia de la activación, generada por el cliente.

    NotaEmergenciaClienteEntrada:
      type: object
      additionalProperties: false
      required: [cuerpo]
      properties:
        cuerpo:
          type: string
          minLength: 1
          maxLength: 1000

    # --- Emergencias del monitoreo por viaje (tracer.37, DEC-135). Fila mínima
    #     para el selector del panel: sin notas, actor ni Reacción. ---
    EmergenciaViaje:
      type: object
      additionalProperties: false
      required: [id, estado, activada_en]
      description: >-
        Caso de emergencia del viaje tal como lo ve el monitoreo en el panel. El
        `id` es el que piden `agregarNotaEmergenciaInterno` y
        `cerrarEmergenciaPorId`.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado: {$ref: "#/components/schemas/EstadoEmergencia"}
        activada_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaEmergenciasViaje:
      type: object
      additionalProperties: false
      required: [items]
      description: Todos los casos del viaje, del más antiguo al más reciente. Sin paginación.
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EmergenciaViaje"}

    ActivarEmergenciaInternoEntrada:
      type: object
      additionalProperties: false
      required: [activacion_id]
      properties:
        activacion_id:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/Id"}]
          description: Clave de idempotencia de la activación, generada por el panel.

    NotaEmergenciaInternoEntrada:
      type: object
      additionalProperties: false
      required: [cuerpo]
      properties:
        cuerpo:
          type: string
          minLength: 1
          maxLength: 1000

    # --- Conversación del viaje para el cliente (E9-T8). Vista mínima: nunca
    #     expone actor_real, rol interno, reclamo, bandeja ni pool. Recorte del
    #     `bff` sobre `mensajeria.Conversacion`/`Mensaje` (DEC-021/DEC-014). ---
    ConversacionCliente:
      type: object
      additionalProperties: false
      required: [viaje_id, estado, ultima_secuencia]
      description: >-
        Conversación del viaje tal como la ve el cliente: el viaje al que
        pertenece, su estado de ciclo de vida y si AI27 ya la atendió. Sin
        `conversacion_id`, bandeja, reclamo ni actor interno.
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          enum: [abierta, solo_lectura, cerrada]
          description: >-
            Ciclo de vida de la conversación. `solo_lectura` tras vencer la
            ventana de escritura del cierre del viaje (DEC-030/DEC-041).
        atendida:
          type: boolean
          description: >-
            true si AI27 marcó la conversación como atendida (DEC-014). El cliente
            ve el estado atendido/resuelto, no recibos de lectura individuales.
        ultima_secuencia:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Cursor de dominio del bootstrap (ADR 28 §2): secuencia canónica del
            último mensaje de la conversación, monotónica por conversación. El
            cliente abre con esta lectura y pide el catch-up con
            `listarMensajes?despues_de=`. No es el `seq` de transporte de
            `realtime`. 0 si la conversación aún no tiene mensajes.

    MensajeCliente:
      type: object
      additionalProperties: false
      required: [id, secuencia, cuerpo, enviado_en, de_cliente]
      description: >-
        Mensaje tal como lo ve el cliente. `de_cliente` distingue quién escribió;
        AI27 se presenta siempre con el alias "AI27 Operations" (DEC-021), nunca
        con el actor real ni el rol interno.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        secuencia:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Secuencia canónica de dominio por conversación; ordena en pantalla.
            No es el `seq` de transporte de `realtime`.
        cuerpo: {type: string}
        enviado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        de_cliente:
          type: boolean
          description: true si lo escribió el cliente; false si lo escribió AI27.

    PaginaMensajesCliente:
      type: object
      additionalProperties: false
      required: [items, hay_mas]
      description: >-
        Página de la historia de mensajes, paginada por secuencia de dominio
        (espejo de `mensajeria.listarMensajes`). No usa cursor opaco: un chat se
        recorre por `secuencia` para permitir el catch-up tras reconexión con
        `despues_de` (Addendum §9 de mensajería).
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/MensajeCliente"}
        hay_mas:
          type: boolean
          description: true si hay más mensajes en la dirección pedida.

    EnviarMensajeClienteEntrada:
      type: object
      additionalProperties: false
      required: [cuerpo, client_message_id]
      description: >-
        Cuerpo del envío del cliente. `client_message_id` es la clave de
        idempotencia que genera el cliente (E3-T2). No lleva
        `version_reclamo_esperada` ni `motivo_override` (superficie interna).
      properties:
        cuerpo:
          type: string
          minLength: 1
        client_message_id:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/Id"}]
          description: Generado por el cliente; clave de idempotencia del envío.


    # --- Asignación de la escolta y roster (E8-T10). Espejo de las formas de
    #     `operacion` (AsignacionEntrada, Asignacion, UnidadAsignada,
    #     AptitudRecurso, Unidad, PaginaUnidades): mismos nombres y mismas
    #     formas, para que el consumidor migre por cambio de importación, no por
    #     reescritura. La reserva es por `unidad` completa (paquete vehículo +
    #     custodios), no por recursos sueltos (ADR 31). La aptitud es informativa
    #     y nunca gatea la asignación en V1 (DEC-055). ---
    AsignacionEntrada:
      type: object
      additionalProperties: false
      required: [unidades_ids]
      description: >-
        Escolta a reservar: una o más `unidades` del roster. La reserva es por
        unidad completa (paquete vehículo + custodios), no por recursos sueltos
        (ADR 31). Espejo de `AsignacionEntrada` de `operacion`.
      properties:
        unidades_ids:
          type: array
          minItems: 1
          description: Identificadores de las unidades del roster que forman la escolta.
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    AptitudRecurso:
      type: object
      additionalProperties: false
      required: [recurso, recurso_id, estado]
      description: >-
        Aptitud informativa por átomo en la respuesta de la asignación (DEC-055).
        Nunca bloquea la asignación en V1. Espejo de `AptitudRecurso` de `operacion`.
      properties:
        recurso:
          type: string
          enum: [vehiculo, custodio]
          description: Átomo evaluado dentro de la unidad.
        recurso_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          enum: [apto, no_apto, desconocido]
          description: >-
            Afirmación informativa (DEC-055). `desconocido` lo calcula
            `operacion`. Nunca bloquea la asignación en V1.
        motivos:
          type: array
          description: Motivos, cuando el estado es `no_apto`.
          items: {type: string}

    UnidadAsignada:
      type: object
      additionalProperties: false
      required: [unidad_id, aptitud]
      description: Unidad reservada con su aptitud informativa. Espejo de `UnidadAsignada` de `operacion`.
      properties:
        unidad_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        aptitud:
          type: array
          description: Aptitud informativa por átomo (vehículo y custodios de la unidad).
          items: {$ref: "#/components/schemas/AptitudRecurso"}

    Asignacion:
      type: object
      additionalProperties: false
      required: [viaje_id, estado, unidades]
      description: >-
        Escolta reservada del viaje; la reserva ya ocurrió y el viaje quedó
        `ASIGNADO`. Cada unidad trae su aptitud informativa por átomo (sólo
        dato). Espejo de `Asignacion` de `operacion`.
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          description: >-
            Estado del viaje tras la reserva (token de `EstadoViaje`, ADR 19),
            tal como lo publica `operacion`. En V1 la asignación exitosa deja
            `ASIGNADO`. El `bff` no replica el enum; se afirma en el dato para
            que el consumidor no lo infiera del éxito de la operación.
        unidades:
          type: array
          description: Unidades de la escolta reservada, cada una con su aptitud informativa.
          items: {$ref: "#/components/schemas/UnidadAsignada"}

    # --- Roster de unidades (ADR 31 §5 / ADR 33). La `unidad` es un paquete
    #     pre-armado: un vehículo con uno o dos custodios, referidos POR
    #     IDENTIFICADOR. El `tipo` (patrulla|moto) es SOLO LECTURA: se deriva del
    #     vehículo. La lectura del roster en V1 NO expone aptitud. ---
    Unidad:
      type: object
      additionalProperties: false
      required: [id, vehiculo_id, custodios_ids, tipo, activa]
      description: >-
        Unidad del roster tal como la expone `operacion` (espejo de su `Unidad`),
        más `vehiculo` y `custodios` legibles que agrega el `bff` (tracer.38).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        vehiculo_id:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/Id"}]
          description: Identificador del vehículo en `catalogos`. Referencia, no FK.
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          description: Custodios de la unidad, por identificador. Un coche lleva uno o dos; una moto, uno (ADR 31).
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo:
          type: string
          enum: [patrulla, moto]
          readOnly: true
          description: >-
            Tipo de unidad, SOLO LECTURA, derivado del vehículo (coche -> patrulla,
            moto -> moto, ADR 31). Nunca se envía en una petición.
        activa:
          type: boolean
          description: Si la unidad está activa (disponible para asignarse).
        vehiculo:
          readOnly: true
          description: >-
            Datos legibles del vehículo para el selector del roster (tracer.38,
            DT-19). Los compone el `bff` desde `catalogos`. Ausente si el vehículo
            ya no existe en el catálogo: el consumidor muestra `vehiculo_id`.
          allOf: [{$ref: "#/components/schemas/VehiculoUnidad"}]
        custodios:
          type: array
          readOnly: true
          description: >-
            Nombre de cada custodio de `custodios_ids`, en el mismo orden
            (tracer.38, DT-19). Los compone el `bff` desde `catalogos`. Un
            custodio que ya no existe en el catálogo no aparece.
          items: {$ref: "#/components/schemas/CustodioUnidad"}

    VehiculoUnidad:
      type: object
      additionalProperties: false
      description: Opcionales como en `catalogos`, donde el vehículo puede no tenerlos capturados.
      properties:
        economico: {type: string, description: Número económico del vehículo.}
        placas: {type: string}

    CustodioUnidad:
      type: object
      additionalProperties: false
      required: [id, nombre]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        nombre: {type: string}

    EscoltaVigente:
      type: object
      additionalProperties: false
      required: [viaje_id, unidades]
      description: >-
        Escolta de la asignación vigente del viaje (`obtenerAsignacion`).
        Espejo de `EscoltaVigente` de `operacion`, con cada unidad en la forma
        legible del bff (`vehiculo` y `custodios`).
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        unidades:
          type: array
          description: Unidades reservadas, ordenadas por `id`. Vacío sin asignación vigente.
          items: {$ref: "#/components/schemas/Unidad"}

    PaginaUnidades:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Unidad"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Alta y edición de unidades del roster (E8-T21 / DEC-142, tracer.39).
    #     Espejo de `UnidadEntrada` y `UnidadModificacion` de `operacion`. ---
    UnidadEntrada:
      type: object
      additionalProperties: false
      required: [vehiculo_id, custodios_ids]
      description: >-
        Alta de unidad. El `tipo` NO se envía: se deriva del vehículo. `activa`
        es opcional al crear (el servidor decide el valor por defecto). Espejo
        de `UnidadEntrada` de `operacion`.
      properties:
        vehiculo_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        activa:
          type: boolean
          description: Opcional al crear. Si se omite, el servidor fija el valor por defecto.

    UnidadModificacion:
      type: object
      additionalProperties: false
      description: >-
        Modificación de unidad. Todos los campos son opcionales; activar o
        desactivar es cambiar `activa`. El `tipo` nunca se envía (derivado).
        Espejo de `UnidadModificacion` de `operacion`.
      properties:
        vehiculo_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        custodios_ids:
          type: array
          minItems: 1
          maxItems: 2
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        activa:
          type: boolean

    # --- Vehículos y custodios de `/catalogos` (adelanto de E8-T16 / DEC-142
    #     #6, tracer.39). Espejo de las formas de `catalogos` (Vehiculo,
    #     VehiculoEntrada, VehiculoCambios, PaginaVehiculos y sus pares de
    #     custodio): mismos nombres y formas. Vehículo usa `activa|inactiva` y
    #     custodio `activo|inactivo`, como en `catalogos`. ---
    Vehiculo:
      type: object
      additionalProperties: false
      required: [id, tipo, estado]
      description: >-
        Vehículo de la flota de AI27 (átomo de `catalogos`). Espejo de
        `Vehiculo` de `catalogos`.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version:
          type: integer
          minimum: 1
          description: Versión de la entidad. Opcional como en `catalogos`, que la llena siempre.
        tipo:
          type: string
          enum: [coche, moto]
          description: >-
            Tipo de vehículo. Un coche lleva uno o dos custodios; una moto, uno
            (ADR 31). El `tipo` de la unidad (patrulla|moto) se deriva de este
            valor en `operacion`.
        economico:
          type: string
          description: Número económico del vehículo.
        placas: {type: string}
        estado:
          type: string
          enum: [activa, inactiva]
        vigencia_desde:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          description: Inicio de vigencia de esta versión.
        vigencia_hasta:
          type: string
          format: date-time
          nullable: true
          description: Fin de vigencia de esta versión, o null si es la vigente. Mismo formato que `MarcaTiempo`.

    VehiculoEntrada:
      type: object
      additionalProperties: false
      required: [tipo, estado, cliente_id]
      description: >-
        Cuerpo de alta de un vehículo (POST). El servicio asigna id y versión.
        Espejo de `VehiculoEntrada` de `catalogos`.
      properties:
        tipo:
          type: string
          enum: [coche, moto]
        economico: {type: string}
        placas: {type: string}
        estado:
          type: string
          enum: [activa, inactiva]
        cliente_id:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/Id"}]
          description: >-
            Cliente contra cuyo contrato/SLA `catalogos` evalúa la aptitud
            informativa del vehículo (DEC-055). Requerido en `catalogos`.

    VehiculoCambios:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de modificación de un vehículo (PATCH). Todos los campos son
        opcionales; los presentes forman la nueva versión. Espejo de
        `VehiculoCambios` de `catalogos`.
      properties:
        tipo:
          type: string
          enum: [coche, moto]
        economico: {type: string}
        placas: {type: string}
        estado:
          type: string
          enum: [activa, inactiva]

    PaginaVehiculos:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Vehiculo"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    Custodio:
      type: object
      additionalProperties: false
      required: [id, nombre, estado]
      description: >-
        Custodio de AI27 (átomo de `catalogos`, persona). Espejo de `Custodio`
        de `catalogos`. Datos personales (nombre, teléfono).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version:
          type: integer
          minimum: 1
          description: Versión de la entidad. Opcional como en `catalogos`, que la llena siempre.
        nombre: {type: string}
        telefono: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Referencia opcional al usuario de `identidad` cuando el custodio
            también tiene acceso al sistema. Identificador, no FK. null si el
            custodio no es usuario.
        vigencia_desde:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          description: Inicio de vigencia de esta versión.
        vigencia_hasta:
          type: string
          format: date-time
          nullable: true
          description: Fin de vigencia de esta versión, o null si es la vigente. Mismo formato que `MarcaTiempo`.

    CustodioEntrada:
      type: object
      additionalProperties: false
      required: [nombre, estado]
      description: >-
        Cuerpo de alta de un custodio (POST). El servicio asigna id y versión.
        Espejo de `CustodioEntrada` de `catalogos`.
      properties:
        nombre: {type: string}
        telefono: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Referencia opcional al usuario de `identidad` (identificador, no FK).

    CustodioCambios:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de modificación de un custodio (PATCH). Todos los campos son
        opcionales; los presentes forman la nueva versión. Espejo de
        `CustodioCambios` de `catalogos`.
      properties:
        nombre: {type: string}
        telefono: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Referencia opcional al usuario de `identidad` (identificador, no FK).

    PaginaCustodios:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Custodio"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Cliente para el selector de creación de viaje (E8-T11). Espejo de
    #     `Cliente`/`PaginaClientes` de `catalogos`. Forma ligera: id + nombre
    #     legible + estado. El BFF sólo expone los `activo` dentro de alcance
    #     (el filtro vive en el servidor, no en el schema). `contrato_vigente_id`
    #     se conserva por fidelidad al espejo; el selector usa id y nombre. ---
    Cliente:
      type: object
      additionalProperties: false
      required: [id, nombre, estado]
      description: Cliente seleccionable tal como lo expone `catalogos`. Espejo de `Cliente` de `catalogos`.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        nombre: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]
          description: >-
            Estado del cliente. El BFF devuelve sólo `activo` en este selector;
            `inactivo` no aparece (un cliente inactivo no es asignable a un viaje
            nuevo). El campo se conserva por fidelidad al espejo de `catalogos`.
        contrato_vigente_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.

    PaginaClientes:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Cliente"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    TipoServicioCliente:
      type: object
      additionalProperties: false
      required: [codigo, etiqueta]
      description: >-
        Tipo de servicio seleccionable en el wizard de solicitud. Vista mínima
        del valor de catálogo: `codigo` (el que se manda en `tipo_servicio` al
        crear) y `etiqueta` (lo que se muestra). Sin `estado` ni `version`: el
        BFF ya filtró a los `activo`.
      properties:
        codigo:
          type: string
          description: Código estable del valor; es lo que el cliente envía en tipo_servicio.
        etiqueta:
          type: string
          description: Etiqueta legible para el selector.

    PaginaTiposServicio:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/TipoServicioCliente"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Ficha técnica (E8-T12). Espejo de los esquemas de `operacion`. ---
    Tracto:
      type: object
      additionalProperties: false
      description: Tracto del cliente, texto libre. Espejo de `Tracto` de `operacion` (DEC-104 #1).
      properties:
        placas:    {type: string}
        economico: {type: string}
        marca:     {type: string}
        modelo:    {type: string}
        color:     {type: string}

    Contenedor:
      type: object
      additionalProperties: false
      description: Contenedor del viaje (0..N). Espejo de `Contenedor` de `operacion` (DEC-104 #2).
      properties:
        economico: {type: string}
        placas:    {type: string}
        sello:     {type: string}
        color:     {type: string}

    FichaTecnica:
      type: object
      additionalProperties: false
      required: [viaje_id]
      description: Ficha técnica del viaje (lectura). Espejo de `FichaTecnica` de `operacion`.
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
        contenedores:
          type: array
          items: {$ref: "#/components/schemas/Contenedor"}
        gps_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    FichaTecnicaEntrada:
      type: object
      additionalProperties: false
      description: >-
        Guardado parcial de la ficha. Ningún campo obligatorio; colecciones por
        reemplazo (DEC-104 #3). Espejo de `FichaTecnicaEntrada` de `operacion`.
      properties:
        tracto:
          allOf: [{$ref: "#/components/schemas/Tracto"}]
          nullable: true
        contenedores:
          type: array
          items: {$ref: "#/components/schemas/Contenedor"}
        gps_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}

    DispositivoGps:
      type: object
      additionalProperties: false
      required: [id, identificador, activo]
      description: Dispositivo GPS del catálogo. Espejo de `DispositivoGps` de `catalogos`.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        identificador: {type: string}
        activo: {type: boolean}

    PaginaGps:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/DispositivoGps"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # --- Histórico operativo (E8-T13). Espejo de los esquemas de `operacion`. ---
    EntradaBitacoraEntrada:
      type: object
      additionalProperties: false
      required: [texto]
      description: Espejo de `EntradaBitacoraEntrada` de `operacion`.
      properties:
        texto: {type: string}

    EntradaBitacora:
      type: object
      additionalProperties: false
      required: [id, viaje_id, texto, autor, ts]
      description: Espejo de `EntradaBitacora` de `operacion`.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        texto: {type: string}
        autor: {type: string}
        ts: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaBitacora:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EntradaBitacora"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    IncidenciaEntrada:
      type: object
      additionalProperties: false
      required: [tipo_interno]
      description: >-
        Espejo de `IncidenciaEntrada` de `operacion`. `tipo_interno` es `string`
        en V1: la lista de tipos existe y está validada (DEC-003, propuesta de
        clasificación §2), pero aún no se tipa a enum —faltan la forma del token,
        el cierre del pendiente de DEC-003 y la curación de dimensiones (DEC-105)—;
        se tipará en una ola aditiva. La vista curada al cliente la compone `bff`
        (DEC-006), no este contrato.
      properties:
        tipo_interno: {type: string}
        descripcion: {type: string}

    Incidencia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, tipo_interno, estado, abierta_en]
      description: Espejo de `Incidencia` de `operacion`.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        tipo_interno: {type: string}
        estado:
          type: string
          enum: [en_atencion, resuelta]
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        resuelta_en:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.

    PaginaIncidencias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Incidencia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    ResolucionIncidenciaEntrada:
      type: object
      additionalProperties: false
      required: [resolucion]
      description: Espejo de `ResolucionIncidenciaEntrada` de `operacion`.
      properties:
        resolucion: {type: string}

    MotivoEstadia:
      type: string
      description: Motivo de la estadía. Espejo de `MotivoEstadia` de `operacion`.
      enum:
        - combustible
        - descanso
        - alimentos
        - sanitario
        - reten
        - revision_autoridades
        - gastos
        - espera_entrega

    EjeAutorizacionEstadia:
      type: string
      description: Eje de autorización de la estadía. Espejo de `EjeAutorizacionEstadia` de `operacion`.
      enum:
        - autorizada
        - no_autorizada
        - antes_200km

    Estadia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, motivo, eje_autorizacion, inicio]
      description: >-
        Estadía del viaje. La duración se deriva de `inicio` y `cierre`; sin
        `prolongada` ni umbral (DEC-038). Espejo de `Estadia` de `operacion`.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        motivo: {$ref: "#/components/schemas/MotivoEstadia"}
        eje_autorizacion: {$ref: "#/components/schemas/EjeAutorizacionEstadia"}
        inicio: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        cierre:
          type: string
          format: date-time
          nullable: true
          description: Cierre de la estadía, o null si sigue abierta. Mismo formato que `MarcaTiempo`.

    EstadiaEntrada:
      type: object
      additionalProperties: false
      required: [motivo, eje_autorizacion]
      description: Espejo de `EstadiaEntrada` de `operacion`.
      properties:
        motivo: {$ref: "#/components/schemas/MotivoEstadia"}
        eje_autorizacion: {$ref: "#/components/schemas/EjeAutorizacionEstadia"}

    CierreEstadiaEntrada:
      type: object
      additionalProperties: false
      description: Cuerpo de cierre (vacío válido). Espejo de `CierreEstadiaEntrada` de `operacion`.
      properties: {}

    PaginaEstadias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Estadia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    # -------------------------------------------------------------------------
    # Schemas de la SUPERFICIE INTERNA de bandeja y conversación (E8-T15,
    # tracer.30). Copiados EXACTOS de `mensajeria.yaml`: ambos specs comparten
    # `_comunes.yaml`, así que los `$ref` a Id/MarcaTiempo/Rol se mantienen. La
    # audiencia interna ve los schemas COMPLETOS (bandeja_id, reclamo_activo,
    # actor_real, rol_al_enviar), a diferencia de las vistas `*Cliente`
    # (DEC-006 invertido). `EnviarMensajeInternaEntrada` es la única divergencia.
    # -------------------------------------------------------------------------
    SecuenciaMensaje:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Secuencia canónica de mensaje, monotónica POR CONVERSACIÓN. No es una
        versión de reclamo ni el `seq` de transporte de `realtime`.

    RevisionBandeja:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Revisión monotónica de la COLECCIÓN de trabajo de una bandeja (ADR 28
        §3): avanza con cada cambio de la colección (alta, baja, reenrutamiento,
        reclamo, atención). Es el cursor de dominio del bootstrap y el catch-up
        de bandeja. No es el cursor de paginación, ni una secuencia de mensaje,
        ni el `seq` de transporte de `realtime`.

    VersionReclamo:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Versión del reclamo de la conversación (concurrencia optimista). 0 si
        nunca se ha reclamado. No es una secuencia de mensaje.

    Audiencia:
      type: string
      description: Audiencia de dominio del autor (DEC-054), no el claim `aud`.
      enum: [Cliente, Interno]

    EstadoConversacion:
      type: string
      description: >-
        Ciclo de vida, separado del estado operativo de cola (Addendum §6).
        `solo_lectura` tras vencer `escritura_hasta` (DEC-030, DEC-041).
      enum: [abierta, solo_lectura, cerrada]

    Conversacion:
      type: object
      additionalProperties: false
      required: [id, viaje_id, cliente_id, estado, ultima_secuencia, version_reclamo, abierta_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        bandeja_id:
          type: string
          format: uuid
          nullable: true
          description: Bandeja de la ruta activa. Solo para audiencia Interno.
        estado: {$ref: "#/components/schemas/EstadoConversacion"}
        escritura_hasta:
          type: string
          format: date-time
          nullable: true
          description: Fin de la ventana de escritura. No es fecha de purga.
        ultima_secuencia: {$ref: "#/components/schemas/SecuenciaMensaje"}
        version_reclamo: {$ref: "#/components/schemas/VersionReclamo"}
        reclamo_activo:
          allOf: [$ref: "#/components/schemas/Reclamo"]
          nullable: true
          description: Reclamo vigente. Solo para audiencia Interno; null si está en el pool.
        atendida_en:
          type: string
          format: date-time
          nullable: true
        abierta_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    TrabajoBandeja:
      type: object
      additionalProperties: false
      required: [items, revision, cursor_siguiente]
      description: >-
        Trabajo de una bandeja con su cursor de dominio. Declara la `revision` de
        la COLECCIÓN al momento de la respuesta (ADR 28 §3): es el cursor del
        bootstrap de bandeja y el punto desde el que `desde_revision` pide el
        catch-up. El cursor de paginación (`cursor_siguiente`) y el cursor de
        cambios (`revision`) son distintos y no se confunden.
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Conversacion"}
        revision:
          allOf: [{$ref: "#/components/schemas/RevisionBandeja"}]
          description: >-
            Revisión de la colección que representa esta respuesta. El cliente la
            usa como `desde_revision` en el siguiente catch-up.
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.

    Mensaje:
      type: object
      additionalProperties: false
      required: [id, conversacion_id, secuencia, client_message_id, audiencia_autor, alias_mostrado, cuerpo, creado_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        conversacion_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        secuencia: {$ref: "#/components/schemas/SecuenciaMensaje"}
        client_message_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        audiencia_autor: {$ref: "#/components/schemas/Audiencia"}
        alias_mostrado:
          type: string
          description: Identidad presentada (comercial de AI27 para el cliente).
        actor_real:
          type: string
          format: uuid
          nullable: true
          description: >-
            Sujeto que escribió. Siempre se registra (Addendum §4 punto 9),
            pero solo se entrega a audiencia Interno.
        rol_al_enviar:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Rol"]
          nullable: true
          description: Rol del autor al enviar. Solo para audiencia Interno.
        cuerpo:
          type: string
          description: Cuerpo del mensaje. Sin edición ni borrado en V1.
        adjuntos_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaMensajes:
      type: object
      additionalProperties: false
      required: [items, hay_mas]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Mensaje"}
        hay_mas:
          type: boolean
          description: true si hay más mensajes en la dirección pedida.

    EnviarMensajeInternaEntrada:
      type: object
      additionalProperties: false
      required: [client_message_id, cuerpo]
      description: >-
        Envío por audiencia Interno. Es `EnviarMensajeEntrada` de `mensajeria`
        SIN el campo `motivo_override`: DEC-107 cerró el override de supervisor
        en V1, así que el `bff` no lo expone. `mensajeria` rechaza con 400 todo
        envío que traiga `motivo_override`.
      properties:
        client_message_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Generado por el cliente; clave de idempotencia del envío.
        cuerpo:
          type: string
          minLength: 1
        adjuntos_ids:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version_reclamo_esperada:
          allOf: [$ref: "#/components/schemas/VersionReclamo"]
          description: Obligatoria para audiencia Interno (exige reclamo activo).

    Reclamo:
      type: object
      additionalProperties: false
      required: [id, conversacion_id, responsable_id, version, abierto_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        conversacion_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        responsable_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version: {$ref: "#/components/schemas/VersionReclamo"}
        abierto_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        cerrado_en:
          type: string
          format: date-time
          nullable: true

    VersionEsperadaEntrada:
      type: object
      additionalProperties: false
      required: [version_esperada]
      properties:
        version_esperada: {$ref: "#/components/schemas/VersionReclamo"}

    TransferenciaEntrada:
      type: object
      additionalProperties: false
      required: [version_esperada, responsable_destino_id]
      properties:
        version_esperada: {$ref: "#/components/schemas/VersionReclamo"}
        responsable_destino_id:
          allOf: [$ref: "_comunes.yaml#/components/schemas/Id"]
          description: Miembro del pool con membresía efectiva en la bandeja.
        motivo:
          type: string

    ReciboEntrada:
      type: object
      additionalProperties: false
      required: [hasta_secuencia]
      properties:
        hasta_secuencia: {$ref: "#/components/schemas/SecuenciaMensaje"}

    # --- Vista interna de emergencia para el panel (tracer.34). Copia exacta de
    #     los schemas de `mensajeria`, salvo el detalle de Reacción
    #     (`DetalleEmergenciaReaccion` y su bloque de viaje), que compone el
    #     `bff` (DEC-121 #2). `EmergenciaReaccion` es la fila de la bandeja, sin
    #     viaje ni cliente. ---
    EstadoEmergencia:
      type: string
      description: >-
        Ciclo del caso de emergencia (ADR 21 §5), agregado propio distinto del
        estado del viaje y de `EstadoConversacion`. `resuelta` y `cerrada` son
        irreversibles.
      enum: [abierta, en_atencion, resuelta, cerrada]

    OrigenActivacion:
      type: string
      description: Quién originó la activación (ADR 21 §3).
      enum: [cliente, operacion]

    CasoEmergencia:
      type: object
      additionalProperties: false
      required: [id, viaje_id, cliente_id, estado, origen, version_reclamo, activada_en]
      description: >-
        Caso de emergencia tal como lo conoce `mensajeria`. El payload rico a
        Reacción (escolta, teléfonos, origen/destinos del viaje) lo compone
        `bff` con `operacion`; aquí viajan los identificadores y el ciclo del
        caso, no los datos del viaje. La proyección por audiencia la aplica la
        lectura: el Cliente recibe la vista mínima (ADR 21 §6).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado: {$ref: "#/components/schemas/EstadoEmergencia"}
        origen:
          allOf: [{$ref: "#/components/schemas/OrigenActivacion"}]
          description: Solo para audiencia Interno.
        actor_real:
          type: string
          format: uuid
          nullable: true
          description: >-
            Sujeto que activó. Siempre se registra; solo se entrega a audiencia
            Interno.
        version_reclamo: {$ref: "#/components/schemas/VersionReclamo"}
        reclamo_activo:
          allOf: [{$ref: "#/components/schemas/Reclamo"}]
          nullable: true
          description: Reclamo vigente. Solo para audiencia Interno; null en el pool.
        activada_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        resuelta_en:
          type: string
          format: date-time
          nullable: true
        cerrada_en:
          type: string
          format: date-time
          nullable: true

    EmergenciaReaccion:
      type: object
      additionalProperties: false
      required: [id, estado, origen, version_reclamo, activada_en]
      description: >-
        El caso tal como lo ve Reacción en su bandeja (DEC-121 #2): SIN
        `viaje_id`, `cliente_id`, `actor_real` ni notas. Solo lleva lo que el
        caso ya registra. En el detalle viaja como `caso` dentro de
        `DetalleEmergenciaReaccion`. No reemplaza a `CasoEmergencia`, que sigue
        siendo la vista de monitoreo por viaje.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado: {$ref: "#/components/schemas/EstadoEmergencia"}
        origen: {$ref: "#/components/schemas/OrigenActivacion"}
        version_reclamo:
          allOf: [{$ref: "#/components/schemas/VersionReclamo"}]
          description: >-
            Versión vigente del reclamo del caso; es la `version_esperada` para
            reclamar un caso que está en el pool (`reclamo_activo` null).
        reclamo_activo:
          allOf: [{$ref: "#/components/schemas/Reclamo"}]
          nullable: true
          description: >-
            Reclamo vigente (responsable y versión); null si el caso está en el
            pool.
        activada_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        resuelta_en:
          type: string
          format: date-time
          nullable: true
        cerrada_en:
          type: string
          format: date-time
          nullable: true

    PaginaBandejaEmergencias:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      description: >-
        Página de la bandeja de Reacción. Misma paginación por cursor que las
        demás páginas de `mensajeria`; sin `revision` de colección (ver
        `listarBandejaEmergencias`).
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EmergenciaReaccion"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.

    DetalleEmergenciaReaccion:
      type: object
      additionalProperties: false
      required: [caso, viaje]
      description: >-
        Detalle del caso para Reacción (DEC-121 #2): el caso más la información
        del viaje que necesita para atender. Es la visibilidad tipo monitorista
        acotada al caso de DEC-028 #5. Lo COMPONE el `bff`: `caso` viene de
        `mensajeria` y `viaje` de `operacion` y `catalogos`. Sin `viaje_id`,
        bitácora, incidencias ni conversación.
      properties:
        caso: {$ref: "#/components/schemas/EmergenciaReaccion"}
        viaje: {$ref: "#/components/schemas/ViajeEmergencia"}

    ViajeEmergencia:
      type: object
      additionalProperties: false
      required: [cliente_nombre, estado, origen, destinos, escolta]
      description: >-
        Bloque de viaje del detalle de Reacción, con exactamente los campos de
        DEC-121 #2. El `bff` lo compone de `operacion` (estado, origen,
        destinos, fecha y tipo de servicio, ETA, unidades de la escolta) y de
        `catalogos` (nombre del cliente, vehículo y custodios de cada unidad).
        El tracto y los contenedores de la ficha técnica entrarán en una ola
        aditiva posterior, cuando `operacion` implemente la ficha (E8-T12).
        Fuera de V1: ubicación (DEC-001), operador del tracto y folio legible
        del viaje.
      properties:
        cliente_nombre:
          type: string
          description: Nombre del cliente del viaje, de `catalogos`.
        estado:
          type: string
          description: >-
            Token de estado canónico del viaje (`EstadoViaje`, ADR 19), como en
            `ViajeInterno.estado`. El `bff` no replica el enum.
        origen: {type: string}
        destinos:
          type: array
          items: {$ref: "#/components/schemas/DestinoViajeEmergencia"}
        fecha_hora_servicio:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        tipo_servicio:
          type: string
          nullable: true
          description: Tipo de servicio/monitoreo del viaje (DEC-010 #3). Espejo de `Viaje.tipo_servicio` de `operacion`.
        eta_estimado:
          type: string
          format: date-time
          nullable: true
          description: ETA estimado capturado a mano (ADR 20). Mismo formato que `MarcaTiempo`. null si no se ha fijado.
        escolta:
          type: array
          description: Unidades de la escolta asignada; vacío si el viaje aún no tiene escolta.
          items: {$ref: "#/components/schemas/UnidadEscoltaEmergencia"}

    DestinoViajeEmergencia:
      type: object
      additionalProperties: false
      required: [nombre]
      description: Destino del viaje en el detalle de Reacción. Subconjunto de `Destino` de `operacion`.
      properties:
        nombre: {type: string}
        fecha_cita:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.
        arribo:
          type: boolean
          description: Si la unidad arribó a este destino (DEC-012). Espejo de `Destino.arribo` de `operacion`.

    UnidadEscoltaEmergencia:
      type: object
      additionalProperties: false
      required: [tipo, custodios]
      description: >-
        Unidad de la escolta en el detalle de Reacción: `tipo` de la unidad del
        roster (`operacion`), `economico` y `placas` del vehículo y sus
        custodios (`catalogos`). Sin identificadores.
      properties:
        tipo:
          type: string
          description: >-
            Token de `Unidad.tipo` (`patrulla` o `moto`). Se declara `string`
            y no enum para no renombrar las constantes Go de `UnidadTipo` del
            cliente generado.
        economico:
          type: string
          description: Número económico del vehículo.
        placas: {type: string}
        custodios:
          type: array
          items: {$ref: "#/components/schemas/CustodioEscoltaEmergencia"}

    CustodioEscoltaEmergencia:
      type: object
      additionalProperties: false
      required: [nombre]
      description: Custodio de una unidad de la escolta. Subconjunto de `Custodio` de `catalogos`.
      properties:
        nombre: {type: string}
        telefono: {type: string}

    PaginaNotasEmergencia:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      description: Página de notas de un caso (`listarNotasEmergenciaPorId`).
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/NotaEmergencia"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no hay más.

    NotaEmergencia:
      type: object
      additionalProperties: false
      required: [id, emergencia_id, audiencia_autor, cuerpo, creado_en]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        emergencia_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        audiencia_autor: {$ref: "#/components/schemas/Audiencia"}
        actor_real:
          type: string
          format: uuid
          nullable: true
          description: Sujeto que escribió. Solo se entrega a audiencia Interno.
        cuerpo:
          type: string
          description: Contenido de la nota. Sin edición ni borrado en V1.
        es_resolucion:
          type: boolean
          description: true si es la nota que acompañó la resolución del caso.
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    ResolucionEmergenciaEntrada:
      type: object
      additionalProperties: false
      required: [version_esperada, nota]
      properties:
        version_esperada: {$ref: "#/components/schemas/VersionReclamo"}
        nota:
          type: string
          minLength: 1
          maxLength: 1000
          description: Nota de resolución obligatoria; mismas validaciones que las demás notas.

    # -------------------------------------------------------------------------
    # Schemas del DASHBOARD de monitoreo (E6-HU-025 / E8-T17). Copiados EXACTOS
    # de `reportes.yaml`: ambos specs comparten `_comunes.yaml`, así que los
    # `$ref` a Id/MarcaTiempo se mantienen. Se conservan `proyeccion_al` y
    # `stale` sin recortar (DEC-033): un tablero atrasado se muestra atrasado.
    # -------------------------------------------------------------------------
    FilaViaje:
      type: object
      additionalProperties: false
      required: [viaje_id, estado]
      properties:
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        estado:
          type: string
          description: Token de estado (ADR 19), tal como lo proyecta el evento.
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        cerrado_en:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.

    ReporteViajes:
      type: object
      additionalProperties: false
      required: [filas, total]
      properties:
        filas:
          type: array
          items: {$ref: "#/components/schemas/FilaViaje"}
        total: {type: integer}
        proyeccion_al:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          nullable: true
          description: >-
            Instante hasta el que la proyección aplicó eventos del origen
            (`reportes` es una proyección por eventos, ADR 18). El reporte
            refleja el estado del dominio hasta este momento, no el de ahora.
            Opcional (expand/contract): el servicio lo llena siempre. null solo
            si la proyección aún no aplicó ningún evento.
        stale:
          type: boolean
          description: >-
            true si el retraso de la proyección (now menos `proyeccion_al`)
            excede el techo de frescura configurado del servicio. Distingue un
            reporte al día de uno congelado por un consumo detenido. El valor
            del techo es configuración del servicio, no del contrato. Opcional:
            si falta, el consumidor lo trata como frescura no informada, nunca
            como fresca (P4 de E8-T17).

    ConteoEstado:
      type: object
      additionalProperties: false
      required: [estado, conteo]
      properties:
        estado: {type: string}
        conteo: {type: integer}
        permanencia_promedio_seg:
          type: integer
          nullable: true

    ReporteEstados:
      type: object
      additionalProperties: false
      required: [conteos]
      properties:
        conteos:
          type: array
          items: {$ref: "#/components/schemas/ConteoEstado"}
        proyeccion_al:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          nullable: true
          description: >-
            Instante hasta el que la proyección aplicó eventos del origen
            (`reportes` es una proyección por eventos, ADR 18). El reporte
            refleja el estado del dominio hasta este momento, no el de ahora.
            Opcional (expand/contract): el servicio lo llena siempre. null solo
            si la proyección aún no aplicó ningún evento.
        stale:
          type: boolean
          description: >-
            true si el retraso de la proyección (now menos `proyeccion_al`)
            excede el techo de frescura configurado del servicio. Distingue un
            reporte al día de uno congelado por un consumo detenido. El valor
            del techo es configuración del servicio, no del contrato. Opcional:
            si falta, el consumidor lo trata como frescura no informada, nunca
            como fresca (P4 de E8-T17).

    # -------------------------------------------------------------------------
    # Schemas de EVIDENCIA del viaje (E6-HU-027 / E8-T17). Copiados EXACTOS de
    # `operacion.yaml` (comparten `_comunes.yaml`). `nombre` es obligatorio para
    # identificar el archivo en la lista; el autor queda fuera de V1 (DT-11).
    # `PaginaAdjuntos` no pagina en V1 (DT-08).
    # -------------------------------------------------------------------------
    Adjunto:
      type: object
      additionalProperties: false
      required: [id, viaje_id, nombre, tipo_medio, tamano_bytes, estado_escaneo, creado_en]
      description: Metadatos de un adjunto del viaje. No incluye los bytes.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        viaje_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        nombre:
          type: string
          minLength: 1
          description: >-
            Nombre de archivo declarado en la subida, para identificar el
            adjunto en la lista de evidencia (E6-HU-027). No es el actor que lo
            subió: el autor queda fuera de V1 (DT-11).
        tipo_medio:
          type: string
          description: Tipo MIME declarado del adjunto.
        tamano_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{64}$"
          description: Checksum declarado en la subida; null si no se declaró.
        estado_escaneo:
          type: string
          enum: [pendiente, limpio, infectado]
          description: >-
            Estado del escaneo antivirus del objeto. `pendiente` tras crear la
            intención; `limpio`/`infectado` cuando el escaneo concluye. Un
            adjunto no `limpio` no autoriza descarga. Se refresca releyendo
            `listarAdjuntos` (sondeo; no hay evento de empuje en V1).
        creado_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    PaginaAdjuntos:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Adjunto"}

    IntencionSubidaAdjuntoEntrada:
      type: object
      additionalProperties: false
      required: [nombre, tipo_medio, tamano_bytes, checksum_sha256]
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre de archivo declarado, mostrado luego en la lista (E6-HU-027).
        tipo_medio:
          type: string
          description: Tipo MIME declarado.
        tamano_bytes:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"

    IntencionSubidaAdjunto:
      type: object
      additionalProperties: false
      required: [adjunto_id, url_subida, expira_en]
      properties:
        adjunto_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        url_subida:
          type: string
          format: uri
          description: URL de vida corta del almacenamiento de objetos.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}

    DescargaAdjunto:
      type: object
      additionalProperties: false
      required: [url_descarga, expira_en]
      properties:
        url_descarga:
          type: string
          format: uri
          description: URL de vida corta del almacenamiento de objetos.
        expira_en: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
