# =============================================================================
# contracts/openapi/catalogos.yaml
# -----------------------------------------------------------------------------
# Superficie HTTP interna de `catalogos` para el tracer. `catalogos` es el
# registro maestro (hoja del grafo: no llama a nadie). En el tracer expone
# lectura de clientes, contratos/SLA, vehículos (átomos coche/moto) y custodios,
# y la AFIRMACIÓN de aptitud administrativa que `operacion` consulta antes de
# reservar.
#
# La aptitud es INFORMATIVA en V1 (DEC-055): es una afirmación, NO una reserva ni
# un bloqueo; la reserva vive en `operacion.asignacion` (ADR 24/31 /
# operacion.md (a)). El valor "aptitud desconocida" lo calcula el CONSUMIDOR
# (operacion/bff) cuando `catalogos` no responde o el dato está obsoleto;
# `catalogos` nunca lo devuelve.
#
# La `unidad` (paquete vehículo + custodios) NO es de catalogos: es roster de
# `operacion` (ADR 31 §5). Catalogos es dueño del ÁTOMO vehículo (coche/moto).
#
# Fuera del tracer / V2: rutas y zonas de riesgo (telemetría), escritura de
# catálogos (E5).
# =============================================================================
openapi: 3.0.3
info:
  title: AI27 — catalogos
  version: 0.1.0-tracer.22
  description: Registro maestro. Lectura para el tracer y afirmación de aptitud.
  x-ai27-servicio: catalogos
  x-ai27-capa: catalogo
  x-ai27-tracer: true

servers:
- url: /
  description: Ruta base montada por el despliegue.

security:
- bearerCognito: []

tags:
- name: clientes
- name: contratos
- name: recursos
  description: Vehículos (átomos coche/moto) y custodios — los átomos de AI27 (ADR 31).
- name: catalogos-tipo
  description: >-
    Catálogos de tipo de V1 (listas de valores administrables): tipos de
    servicio/monitoreo, líneas de transporte, tipos de unidad, tipos de custodia
    y zonas de riesgo como lista (sin geometría; E5-T3 / DEC-017).

paths:
  /api/v1/clientes:
    get:
      operationId: listarClientes
      tags: [clientes]
      summary: Listar clientes (expediente comercial), por alcance interno.
      description: >-
        Sin `ids`, devuelve una página paginada por cursor. Con `ids`, devuelve
        la LECTURA POR LOTE de esos clientes (consumidor: `mensajeria`, con
        caché invalidada por `catalogo.actualizado`). `ids` y `cursor` son
        mutuamente excluyentes: con `ids`, `cursor_siguiente` es null.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      - name: ids
        in: query
        required: false
        description: >-
          Lista de identificadores separados por coma para la lectura por lote.
          Mutuamente excluyente con `cursor`.
        style: form
        explode: false
        schema:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
      responses:
        "200":
          description: Página de clientes (o el lote solicitado).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaClientes"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

  /api/v1/clientes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerCliente
      tags: [clientes]
      summary: Expediente del cliente y su contrato vigente.
      responses:
        "200":
          description: Cliente.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cliente"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/contratos:
    post:
      operationId: crearContrato
      tags: [contratos]
      summary: Alta de un contrato (crea la versión 1).
      description: >-
        Registra un contrato nuevo para un cliente. Crea la versión 1 y emite
        `catalogo.actualizado` en la misma transacción (P17). Escritura
        administrativa de E5 (E5-T4), mismo patrón de versionado que vehículos y
        custodios. En V1 el contrato es informativo (DEC-022 #4): no condiciona
        ningún flujo de E1.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContratoEntrada"}
      responses:
        "201":
          description: Contrato creado (versión 1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Contrato"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/contratos/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerContrato
      tags: [contratos]
      summary: Contrato, vigente o vigente a una fecha.
      description: >-
        La lectura vigente-a-una-fecha es la que la exportación probatoria
        necesita. En V1 el contrato/SLA es informativo (DEC-022 #4).
      parameters:
      - name: a_fecha
        in: query
        required: false
        description: Devuelve la versión vigente a esa fecha (probatorio).
        schema: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
      responses:
        "200":
          description: Contrato.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Contrato"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: actualizarContrato
      tags: [contratos]
      summary: Modifica un contrato creando una nueva versión.
      description: >-
        No sobrescribe: cierra la vigencia de la versión actual y crea una nueva
        (version+1), y emite `catalogo.actualizado` en la misma transacción
        (P17). La versión anterior sigue consultable con `?a_fecha` (P8).
        Escritura administrativa de E5 (E5-T4).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContratoCambios"}
      responses:
        "200":
          description: Contrato con su nueva versión.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Contrato"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/sla:
    post:
      operationId: crearSla
      tags: [contratos]
      summary: Alta de un SLA de contrato (crea la versión 1).
      description: >-
        Registra el SLA de un contrato. Crea la versión 1 y emite
        `catalogo.actualizado` en la misma transacción (P17). En V1 el SLA es
        INFORMATIVO (DEC-022 #4 / DEC-025): se registra, no se vigila ni alerta;
        no condiciona ningún flujo de E1.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SlaEntrada"}
      responses:
        "201":
          description: SLA creado (versión 1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sla"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/sla/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerSla
      tags: [contratos]
      summary: SLA de un contrato, vigente o vigente a una fecha.
      parameters:
      - name: a_fecha
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
      responses:
        "200":
          description: SLA.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sla"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: actualizarSla
      tags: [contratos]
      summary: Modifica un SLA creando una nueva versión.
      description: >-
        No sobrescribe: cierra la vigencia de la versión actual y crea una nueva
        (version+1), y emite `catalogo.actualizado` en la misma transacción
        (P17). La versión anterior sigue consultable con `?a_fecha` (P8).
        Escritura administrativa de E5 (E5-T4).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SlaCambios"}
      responses:
        "200":
          description: SLA con su nueva versión.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sla"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/vehiculos:
    get:
      operationId: listarVehiculos
      tags: [recursos]
      summary: Listar vehículos de la flota de AI27 (coche o moto).
      description: >-
        Sin `ids`, devuelve una página paginada por cursor. Con `ids`, devuelve
        la LECTURA POR LOTE de esos identificadores en un solo viaje (evita el
        patrón N+1 de los consumidores; E5-T1 la trata como de primera clase).
        `ids` y `cursor` son mutuamente excluyentes: con `ids` presente, el
        resultado no se pagina y `cursor_siguiente` es null.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      - name: ids
        in: query
        required: false
        description: >-
          Lista de identificadores separados por coma para la lectura por lote.
          Mutuamente excluyente con `cursor`.
        style: form
        explode: false
        schema:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
      responses:
        "200":
          description: Página de vehículos (o el lote solicitado).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaVehiculos"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    post:
      operationId: crearVehiculo
      tags: [recursos]
      summary: Alta de un vehículo (crea la versión 1).
      description: >-
        Registra un vehículo nuevo. Crea la versión 1 y emite
        `catalogo.actualizado` en la misma transacción (P17). Escritura
        administrativa de E5 (brecha C7).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VehiculoEntrada"}
      responses:
        "201":
          description: Vehículo creado (versión 1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Vehiculo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/vehiculos/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerVehiculo
      tags: [recursos]
      summary: Vehículo vigente, o vigente a una fecha.
      description: >-
        La lectura vigente-a-una-fecha es la que la exportación probatoria
        necesita (P8): devuelve la versión que regía en esa fecha, no la actual.
      parameters:
      - name: a_fecha
        in: query
        required: false
        description: Devuelve la versión vigente a esa fecha (probatorio).
        schema: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
      responses:
        "200":
          description: Vehículo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Vehiculo"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: actualizarVehiculo
      tags: [recursos]
      summary: Modifica un vehículo creando una nueva versión.
      description: >-
        No sobrescribe: cierra la vigencia de la versión actual y crea una nueva
        (version+1), y emite `catalogo.actualizado` en la misma transacción
        (P17). La versión anterior sigue consultable con `?a_fecha`. Escritura
        administrativa de E5 (brecha C7).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VehiculoCambios"}
      responses:
        "200":
          description: Vehículo con su nueva versión.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Vehiculo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/vehiculos/{id}/aptitud:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: aptitudVehiculo
      tags: [recursos]
      summary: Afirmación de aptitud administrativa de un vehículo.
      description: >-
        Responde si el vehículo está activo, con documentos vigentes y apto para
        el contrato/SLA de un cliente. En V1 la aptitud es INFORMATIVA (DEC-055):
        es una AFIRMACIÓN, no una reserva, y `operacion` nunca rechaza armar ni
        asignar por ella. `catalogos` devuelve `apto` true/false con sus motivos;
        NO devuelve "desconocida": ese valor lo calcula el CONSUMIDOR cuando
        `catalogos` no responde o el dato está obsoleto (catalogos.md (i)).
      parameters:
      - name: cliente_id
        in: query
        required: true
        description: Cliente para cuyo contrato/SLA se evalúa la aptitud.
        schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
      responses:
        "200":
          description: Afirmación de aptitud.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Aptitud"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  /api/v1/custodios:
    get:
      operationId: listarCustodios
      tags: [recursos]
      summary: Listar custodios (personas de AI27 que viajan en la unidad).
      description: >-
        Sin `ids`, devuelve una página paginada por cursor. Con `ids`, devuelve
        la LECTURA POR LOTE de esos identificadores en un solo viaje (evita el
        patrón N+1 de los consumidores; misma semántica de primera clase que
        vehículos en E5-T1). `ids` y `cursor` son mutuamente excluyentes: con
        `ids` presente, el resultado no se pagina y `cursor_siguiente` es null.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      - name: ids
        in: query
        required: false
        description: >-
          Lista de identificadores separados por coma para la lectura por lote.
          Mutuamente excluyente con `cursor`.
        style: form
        explode: false
        schema:
          type: array
          items: {$ref: "_comunes.yaml#/components/schemas/Id"}
      responses:
        "200":
          description: Página de custodios (o el lote solicitado).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaCustodios"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
    post:
      operationId: crearCustodio
      tags: [recursos]
      summary: Alta de un custodio (crea la versión 1).
      description: >-
        Registra un custodio nuevo. Crea la versión 1 y emite
        `catalogo.actualizado` en la misma transacción (P17). Escritura
        administrativa de E5 (E5-T2), mismo patrón que vehículos.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustodioEntrada"}
      responses:
        "201":
          description: Custodio creado (versión 1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Custodio"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/custodios/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: obtenerCustodio
      tags: [recursos]
      summary: Custodio vigente, o vigente a una fecha.
      description: >-
        La lectura vigente-a-una-fecha es la que la exportación probatoria
        necesita (P8): devuelve la versión que regía en esa fecha, no la actual.
      parameters:
      - name: a_fecha
        in: query
        required: false
        description: Devuelve la versión vigente a esa fecha (probatorio).
        schema: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
      responses:
        "200":
          description: Custodio.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Custodio"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    patch:
      operationId: actualizarCustodio
      tags: [recursos]
      summary: Modifica un custodio creando una nueva versión.
      description: >-
        No sobrescribe: cierra la vigencia de la versión actual y crea una nueva
        (version+1), y emite `catalogo.actualizado` en la misma transacción
        (P17). La versión anterior sigue consultable con `?a_fecha`. Escritura
        administrativa de E5 (E5-T2).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustodioCambios"}
      responses:
        "200":
          description: Custodio con su nueva versión.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Custodio"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/custodios/{id}/aptitud:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    get:
      operationId: aptitudCustodio
      tags: [recursos]
      summary: Afirmación de aptitud administrativa de un custodio.
      description: >-
        En V1 la aptitud es INFORMATIVA (DEC-055): `operacion` nunca rechaza por
        ella. `catalogos` devuelve `apto` true/false con sus motivos; el valor
        "desconocida" lo calcula el CONSUMIDOR, no `catalogos`.
      parameters:
      - name: cliente_id
        in: query
        required: true
        schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
      responses:
        "200":
          description: Afirmación de aptitud.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Aptitud"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}

  # ---------------------------------------------------------------------------
  # Catálogos de tipo (E5-T3). Un ÚNICO recurso parametrizado por `{tipo}` para
  # las cinco listas de valores de V1 (opción A): comparten forma (código,
  # etiqueta, estado, versión), así que no se declaran cinco recursos casi
  # idénticos. Agregar una lista futura es un valor más del enum `TipoCatalogo`,
  # no una ruta nueva. `zona_riesgo` entra SOLO como lista de valores (sin
  # geometría); cuando V2 agregue geometría, se gradúa a su propio recurso
  # (ADR 5 / DEC-017). Mismo patrón versión-en-outbox (`catalogo.actualizado`,
  # P17) que vehículos, custodios, contratos y SLA.
  # ---------------------------------------------------------------------------
  /api/v1/catalogos-tipo/{tipo}:
    parameters:
    - name: tipo
      in: path
      required: true
      description: Cuál de las listas de valores de V1 se consulta o administra.
      schema: {$ref: "#/components/schemas/TipoCatalogo"}
    get:
      operationId: listarValoresCatalogo
      tags: [catalogos-tipo]
      summary: Listar los valores de un catálogo de tipo (lectura por lote).
      description: >-
        Devuelve los valores vigentes del catálogo `{tipo}`. Lectura de primera
        clase para los consumidores (evita N+1). Cada valor trae su `version`
        para revalidación barata de caché.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de valores del catálogo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaValoresCatalogo"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
    post:
      operationId: crearValorCatalogo
      tags: [catalogos-tipo]
      summary: Alta de un valor en un catálogo de tipo (crea la versión 1).
      description: >-
        Registra un valor nuevo en el catálogo `{tipo}`. Crea la versión 1 y
        emite `catalogo.actualizado` en la misma transacción (P17). Escritura
        administrativa de E5 (E5-T3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ValorCatalogoEntrada"}
      responses:
        "201":
          description: Valor creado (versión 1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValorCatalogo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  /api/v1/catalogos-tipo/{tipo}/{id}:
    parameters:
    - name: tipo
      in: path
      required: true
      schema: {$ref: "#/components/schemas/TipoCatalogo"}
    - name: id
      in: path
      required: true
      schema: {$ref: "_comunes.yaml#/components/schemas/Id"}
    patch:
      operationId: actualizarValorCatalogo
      tags: [catalogos-tipo]
      summary: Modifica o desactiva un valor de catálogo (crea una nueva versión).
      description: >-
        No sobrescribe: cierra la vigencia de la versión actual y crea una nueva
        (version+1), y emite `catalogo.actualizado` en la misma transacción
        (P17). Desactivar un valor es cambiar su `estado` por esta misma ruta;
        no rompe los registros históricos que ya lo usaban (siguen apuntando a la
        versión que regía entonces, P8).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ValorCatalogoCambios"}
      responses:
        "200":
          description: Valor con su nueva versión.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValorCatalogo"}
        "400": {$ref: "_comunes.yaml#/components/responses/SolicitudInvalida"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}
        "404": {$ref: "_comunes.yaml#/components/responses/NoEncontrado"}
        "409": {$ref: "_comunes.yaml#/components/responses/Conflicto"}

  # ---------------------------------------------------------------------------
  # Catálogo de dispositivos GPS (DEC-047 #2 / DEC-104 #5). Dato maestro: ~100
  # dispositivos que Operación carga. La ficha del viaje los REFERENCIA por id
  # (DEC-012), sin ingestión de posición en vivo (V2). En V1 solo lectura: la
  # carga de los valores reales es trabajo de datos de Operación, no superficie
  # de esta ola.
  # ---------------------------------------------------------------------------
  /api/v1/gps:
    get:
      operationId: listarGps
      tags: [recursos]
      summary: Listar dispositivos GPS del catálogo registrado.
      description: >-
        Página de dispositivos para poblar el selector de GPS de la ficha. El
        selector ofrece solo dispositivos `activo` (DEC-104 #5); el filtro lo
        aplica el servidor.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {$ref: "_comunes.yaml#/components/schemas/Cursor"}
      responses:
        "200":
          description: Página de dispositivos GPS.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginaGps"}
        "401": {$ref: "_comunes.yaml#/components/responses/NoAutorizado"}
        "403": {$ref: "_comunes.yaml#/components/responses/Prohibido"}

components:
  schemas:
    Cliente:
      type: object
      additionalProperties: false
      required: [id, nombre, estado]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        nombre: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]
        contrato_vigente_id:
          type: string
          format: uuid
          nullable: true
          description: Opcional; mismo formato que `Id`. null si no aplica.
    PaginaClientes:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Cliente"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    Contrato:
      type: object
      additionalProperties: false
      required: [id, cliente_id, vigencia_desde]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version:
          type: integer
          minimum: 1
          description: >-
            Versión de la entidad, para revalidación barata de caché (E5-T4,
            misma brecha C6 que vehículos y custodios). OPCIONAL por evolución
            expand/contract: se agrega sin romper a los consumidores de tracer.6;
            el servicio la llena siempre.
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        vigencia_desde: {$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}
        vigencia_hasta:
          type: string
          format: date-time
          nullable: true
          description: Opcional; mismo formato que `MarcaTiempo`. null si no aplica.

    ContratoEntrada:
      type: object
      additionalProperties: false
      required: [cliente_id]
      description: Cuerpo de alta de un contrato (POST). El servicio asigna id y versión.
      properties:
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        descripcion:
          type: string
          description: Descripción del contrato (informativo en V1, DEC-022 #4).

    ContratoCambios:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de modificación de un contrato (PATCH). Todos los campos son
        opcionales; los presentes forman la nueva versión. No incluye `id`,
        `version` ni `cliente_id`.
      properties:
        descripcion:
          type: string

    Sla:
      type: object
      additionalProperties: false
      required: [id, contrato_id]
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version:
          type: integer
          minimum: 1
          description: >-
            Versión de la entidad, para revalidación barata de caché (E5-T4).
            OPCIONAL por evolución expand/contract: se agrega sin romper a los
            consumidores de tracer.6; el servicio la llena siempre. Se promoverá a
            requerida en una ola futura.
        contrato_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        descripcion:
          type: string
          description: Compromiso informativo en V1 (DEC-022 #4).

    SlaEntrada:
      type: object
      additionalProperties: false
      required: [contrato_id]
      description: Cuerpo de alta de un SLA (POST). El servicio asigna id y versión.
      properties:
        contrato_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        descripcion:
          type: string
          description: Compromiso informativo en V1 (DEC-022 #4).

    SlaCambios:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de modificación de un SLA (PATCH). Todos los campos son
        opcionales; los presentes forman la nueva versión. No incluye `id`,
        `version` ni `contrato_id` (los gobierna el servidor).
      properties:
        descripcion:
          type: string

    Vehiculo:
      type: object
      additionalProperties: false
      required: [id, tipo, estado]
      description: >-
        Vehículo de la flota de AI27 (ÁTOMO de catalogos). La `unidad` (paquete
        vehículo + custodios) NO vive aquí: es roster de `operacion` (ADR 31 §5).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version:
          type: integer
          minimum: 1
          description: >-
            Versión de la entidad, para que el consumidor revalide su caché
            barato (E5-T1, brecha C6). OPCIONAL por evolución expand/contract: se
            agrega sin romper a los consumidores de tracer.4; el servicio la llena
            siempre. Se promoverá a requerida en una ola futura.
        tipo:
          type: string
          enum: [coche, moto]
          description: >-
            Tipo de vehículo de AI27. Un coche lleva uno o dos custodios; una
            moto, uno (ADR 31). El `tipo` de la `unidad` del roster (patrulla|moto)
            se deriva de este valor en `operacion`, no se escribe aquí.
        economico:
          type: string
          description: Número económico del vehículo.
        placas: {type: string}
        estado:
          type: string
          enum: [activa, inactiva]
        vigencia_desde:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          description: >-
            Inicio de vigencia de esta versión. Opcional por la misma evolución
            que `version`; sostiene la lectura `?a_fecha` (C9).
        vigencia_hasta:
          type: string
          format: date-time
          nullable: true
          description: >-
            Fin de vigencia de esta versión, o null si es la vigente. Mismo
            formato que `MarcaTiempo`.

    VehiculoEntrada:
      type: object
      additionalProperties: false
      required: [tipo, estado, cliente_id]
      description: Cuerpo de alta de un vehículo (POST). El servicio asigna id y versión.
      properties:
        tipo:
          type: string
          enum: [coche, moto]
        economico: {type: string}
        placas: {type: string}
        estado:
          type: string
          enum: [activa, inactiva]
        cliente_id: {$ref: "_comunes.yaml#/components/schemas/Id"}

    VehiculoCambios:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de modificación de un vehículo (PATCH). Todos los campos son
        opcionales; los presentes forman la nueva versión. No incluye `id` ni
        `version` (los gobierna el servidor).
      properties:
        tipo:
          type: string
          enum: [coche, moto]
        economico: {type: string}
        placas: {type: string}
        estado:
          type: string
          enum: [activa, inactiva]

    PaginaVehiculos:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Vehiculo"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    Custodio:
      type: object
      additionalProperties: false
      required: [id, nombre, estado]
      description: >-
        Custodio de AI27 (ÁTOMO de catalogos, persona). Puede además ser un
        usuario de `identidad`: dos registros, dos dueños, una referencia por
        identificador (`usuario_id`), NUNCA una FK entre schemas (P1). Datos
        personales (nombre, teléfono).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version:
          type: integer
          minimum: 1
          description: >-
            Versión de la entidad, para que el consumidor revalide su caché
            barato (E5-T2, misma brecha C6 que vehículos). OPCIONAL por evolución
            expand/contract: se agrega sin romper a los consumidores de tracer.6;
            el servicio la llena siempre. Se promoverá a requerida en una ola
            futura.
        nombre: {type: string}
        telefono: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Referencia OPCIONAL al usuario de `identidad` cuando el custodio
            también tiene acceso al sistema. Es un IDENTIFICADOR, no una FK entre
            schemas (P1): el consumidor resuelve el usuario contra `identidad`,
            `catalogos` nunca hace JOIN. null si el custodio no es usuario.
        vigencia_desde:
          allOf: [{$ref: "_comunes.yaml#/components/schemas/MarcaTiempo"}]
          description: >-
            Inicio de vigencia de esta versión. Opcional por la misma evolución
            que `version`; sostiene la lectura `?a_fecha` (C9).
        vigencia_hasta:
          type: string
          format: date-time
          nullable: true
          description: >-
            Fin de vigencia de esta versión, o null si es la vigente. Mismo
            formato que `MarcaTiempo`.

    CustodioEntrada:
      type: object
      additionalProperties: false
      required: [nombre, estado]
      description: Cuerpo de alta de un custodio (POST). El servicio asigna id y versión.
      properties:
        nombre: {type: string}
        telefono: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Referencia opcional al usuario de `identidad` (identificador, no FK).
            null u omitido si el custodio no es usuario del sistema.

    CustodioCambios:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de modificación de un custodio (PATCH). Todos los campos son
        opcionales; los presentes forman la nueva versión. No incluye `id` ni
        `version` (los gobierna el servidor).
      properties:
        nombre: {type: string}
        telefono: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Referencia opcional al usuario de `identidad` (identificador, no FK).

    PaginaCustodios:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Custodio"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
    Aptitud:
      type: object
      additionalProperties: false
      required: [recurso_id, apto]
      description: >-
        Afirmación de aptitud administrativa, INFORMATIVA en V1 (DEC-055).
        `apto=false` no reserva ni bloquea; informa a `operacion`, que decide
        dentro de su transacción de asignación y asigna igual. `catalogos`
        devuelve `apto` true/false; el estado "desconocido" NO existe aquí, lo
        calcula el consumidor cuando no hay respuesta o el dato está obsoleto.
      properties:
        recurso_id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        apto: {type: boolean}
        motivos:
          type: array
          description: Motivos de no aptitud, cuando `apto=false`.
          items: {type: string}

    # --- Catálogos de tipo (E5-T3). Cinco listas de valores de V1 bajo un solo
    #     recurso parametrizado por `tipo` (opción A). `tipos_unidad` incluye
    #     `Patrulla` (la unidad en su rol de escolta, ADR 31). `zonas_riesgo`
    #     entra SOLO como lista de valores (sin geometría, DEC-017). ---
    TipoCatalogo:
      type: string
      description: >-
        Cuál de los catálogos de tipo de V1 se consulta o administra. Agregar
        una lista futura es un valor más de este enum, no una ruta nueva.
      enum:
        - tipos_servicio
        - lineas_transporte
        - tipos_unidad
        - tipos_custodia
        - zonas_riesgo

    ValorCatalogo:
      type: object
      additionalProperties: false
      required: [id, codigo, etiqueta, estado]
      description: >-
        Un valor de un catálogo de tipo. Forma común a las cinco listas: código
        estable, etiqueta legible, estado administrativo y versión. Sin geometría
        (incluso para `zonas_riesgo`, que en V1 es solo lista de valores).
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        version:
          type: integer
          minimum: 1
          description: >-
            Versión del valor, para revalidación barata de caché (E5-T3). OPCIONAL
            por evolución expand/contract; el servicio la llena siempre.
        codigo:
          type: string
          description: Código estable del valor (máquina). No se traduce.
        etiqueta:
          type: string
          description: Etiqueta legible del valor (presentación).
        estado:
          type: string
          enum: [activo, inactivo]
          description: >-
            Estado administrativo. Desactivar un valor (`inactivo`) no rompe los
            registros históricos que ya lo usaban (P8).

    ValorCatalogoEntrada:
      type: object
      additionalProperties: false
      required: [codigo, etiqueta, estado]
      description: >-
        Cuerpo de alta de un valor de catálogo (POST). El servicio asigna id y
        versión. El `tipo` viaja en la ruta, no en el cuerpo.
      properties:
        codigo: {type: string}
        etiqueta: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]

    ValorCatalogoCambios:
      type: object
      additionalProperties: false
      description: >-
        Cuerpo de modificación de un valor de catálogo (PATCH). Todos los campos
        son opcionales; los presentes forman la nueva versión. Desactivar es
        enviar `estado: inactivo`. No incluye `id` ni `version` (los gobierna el
        servidor), ni el `tipo` (va en la ruta).
      properties:
        codigo: {type: string}
        etiqueta: {type: string}
        estado:
          type: string
          enum: [activo, inactivo]

    PaginaValoresCatalogo:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ValorCatalogo"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.

    DispositivoGps:
      type: object
      additionalProperties: false
      required: [id, identificador, activo]
      description: >-
        Dispositivo GPS del catálogo registrado (DEC-047 #2). La ficha del viaje
        lo referencia por `id` (DEC-012), sin posición en vivo.
      properties:
        id: {$ref: "_comunes.yaml#/components/schemas/Id"}
        identificador:
          type: string
          description: Alias operativo del dispositivo (p. ej. "MOVIL ST7916").
        activo:
          type: boolean
          description: Si el dispositivo está activo (disponible para seleccionarse).

    PaginaGps:
      type: object
      additionalProperties: false
      required: [items, cursor_siguiente]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/DispositivoGps"}
        cursor_siguiente:
          type: string
          nullable: true
          description: Opcional; mismo formato que `Cursor`. null si no aplica.
